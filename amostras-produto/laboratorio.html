<title>Laboratório de Produto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: bancada de testes do The Founder, noite azul e papel claro do jogo, uma mecânica por aba. */
:root{color-scheme:dark;--night:#1b1d31;--night2:#24273f;--night3:#343859;--paper:#fff7ea;--card:#fffdf8;--ink:#241d33;--soft:#655d78;--line:#eadbc4;--sun:#f2a93b;--sun2:#a8661c;--good:#2f8a5f;--bad:#c2453f;--blue:#3f8fe0;--dim:#b9b6cf;--font:"Nunito","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--night);color:var(--paper);font:600 15px/1.45 var(--font)}
.wrap{max-width:980px;margin:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
h1{margin:0;font-size:24px;font-weight:900}h2{margin:0;font-size:20px;font-weight:900}h3{margin:0;font-size:15px;font-weight:900}p{margin:0}
button{font:800 14px/1.2 var(--font);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:0}
button:hover:not(:disabled){border-color:var(--sun)}button:focus-visible,select:focus-visible{outline:3px solid #7fd0ff;outline-offset:2px}button:disabled{opacity:.45;cursor:default}
.go{background:var(--sun);border-color:var(--sun2);box-shadow:0 3px 0 var(--sun2)}.sel{background:#ffe9c4;border-color:var(--sun2)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lead{color:var(--dim)}.tabs button{background:var(--night2);color:var(--paper);border-color:var(--night3)}.tabs button.on{background:var(--sun);color:var(--ink);border-color:var(--sun2)}.tabs small{display:block;font-size:11px;opacity:.75;margin-top:2px}
select{font:800 14px var(--font);padding:7px 10px;border-radius:10px;border:1.5px solid var(--night3);background:var(--night2);color:var(--paper);max-width:100%}
.panel{background:var(--paper);color:var(--ink);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}.soft{color:var(--soft)}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.two>*{min-width:0}@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:10px;align-content:start}
.stats{display:flex;flex-wrap:wrap;gap:6px}.stat{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}.stat small{display:block;color:var(--soft);font-size:11px;font-weight:800}.stat b{font-size:16px;font-weight:900}
.say{background:var(--card);border-left:4px solid var(--sun);border-radius:8px;padding:8px 12px}.end{background:#eaf7ef;border:1.5px solid #a9dbbd;border-radius:12px;padding:12px;display:grid;gap:6px;justify-items:start}.big{font-size:28px;font-weight:900;color:var(--good)}
.picks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.pick{text-align:left;display:grid;gap:2px}.pick small{color:var(--soft);font-weight:700}
.map{background:var(--night2);border-radius:14px;display:block;width:100%;height:auto}.map text{font:800 12px var(--font);fill:var(--dim)}
.grid{display:grid;gap:3px;background:var(--night);padding:6px;border-radius:12px}.cell{aspect-ratio:1;padding:0;border:0;border-radius:5px;background:#565a7d;color:#fff;font:900 clamp(11px,2vw,15px)/1.05 var(--font);display:grid;place-items:center}
.reach{outline:2px solid #fff7ea;outline-offset:-2px;filter:brightness(1.25)}.bad{outline:3px solid #ffb3ad;outline-offset:-3px}.ghost{opacity:.55}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:5px}
.rate{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;background:var(--night2);border-radius:12px;padding:8px 14px}.rate button{background:transparent;color:var(--sun);border:0;font-size:22px;padding:0 3px}
</style>
<div class="wrap">
 <header class="bar"><div><h1>Laboratório de Produto</h1><p class="lead">Três formas de desenvolver um produto. As regras são as mesmas para os dois produtos, e nada depende de sorte.</p></div><label>Produto <select id="prod"><option value="fone">Fone de ouvido</option><option value="camisa">Camiseta</option></select></label></header>
 <nav class="tabs row" id="tabs" aria-label="Mecânicas"></nav>
 <main class="panel" id="st"></main>
 <section class="rate"><span id="rl"></span><span id="stars"></span></section>
</div>
<script>
const $=id=>document.getElementById(id),brl=n=>'R$ '+Math.round(n).toLocaleString('pt-BR'),stat=(l,v)=>`<div class="stat"><small>${l}</small><b>${v}</b></div>`;
const AX={Q:'Qualidade',D:'Durabilidade',P:'Desempenho',R:'Praticidade',V:'Versatilidade',E:'Economia'};
const DATA={
fone:{base:30,hi:['Caprichado além do que preciso, e paguei por isso.','Parrudo demais. Pesa na cabeça.'],lo:['Parece simples demais, meio de brinquedo.','Parece frágil. Não vai durar.'],
 ing:[['Driver premium',3,0,14],['Almofada macia',2,-1,6],['Carcaça reforçada',0,3,7],['Cabo trançado',1,1,3],['Haste flexível',0,-2,-1],['Plástico simples',-2,-1,-4],['Bateria grande',-1,2,5],['Acabamento fosco',2,0,4]],
 per:[{n:'Clara',t:'Escritório aberto',x:5,y:-1,c:['Passo o dia com ele na cabeça. Tem que ser gostoso de usar.','Troco de fone de tempos em tempos, faz parte.'],w:{P:4,Q:3,V:2}},{n:'Ravi',t:'Treina todo dia',x:1,y:6,c:['Suor, chuva e queda no chão da academia.','Não preciso de luxo, só não quero coisa tosca.'],w:{D:4,R:3,Q:1}},{n:'Seu Jorge',t:'Aposentado, ouve rádio',x:-4,y:3,c:['Não precisa ser chique. Se tocar, está ótimo.','O último não durou um inverno.'],w:{R:3,D:3,E:3}}],
 roles:{nobre:'Driver premium',forte:'Carcaça reforçada',leve:'Pareamento fácil',potente:'Isolamento de ruído',adapta:'Vários aparelhos',barato:'Plástico simples',reforco:'Dobradiça de metal',capricho:'Acabamento fosco'},
 prob:{D:['Almofada aperta a orelha','Cor não agradou','Molde precisa de ajuste'],M:['Fornecedor atrasou o driver','Lote de bateria veio ruim','Preço do plástico subiu'],T:['Chiado no volume alto','Falha no teste de queda','Bateria dura menos']}},
camisa:{base:18,hi:['Bonita, mas é chique demais para mim e custou caro.','Tecido grosso demais. Dá calor.'],lo:['Tem cara de camiseta de brinde.','Fina demais. Vai furar logo.'],
 ing:[['Algodão pima',3,0,9],['Malha leve',1,-2,3],['Costura reforçada',0,3,4],['Gola ribana',1,1,2],['Corte solto',0,-1,-1],['Poliéster barato',-3,-2,-5],['Tecido pesado',-1,3,5],['Corte moderno',2,-1,4]],
 per:[{n:'Bia',t:'Vai de camiseta ao trabalho',x:5,y:1,c:['Quero parecer arrumada sem camisa social.','Não ligo se durar só algumas temporadas.'],w:{Q:4,V:2,R:2}},{n:'Téo',t:'Corre no parque',x:1,y:5,c:['Lavo toda hora e ela não pode deformar.','Não quero logo gigante nem nada chique.'],w:{D:3,R:3,P:2}},{n:'Seu Almir',t:'Compra para a família',x:-4,y:2,c:['Levo logo três. Preço pesa.','Tem que aguentar a máquina de lavar.'],w:{E:4,D:3,R:2}}],
 roles:{nobre:'Algodão pima',forte:'Costura reforçada',leve:'Não precisa passar',potente:'Tecido respirável',adapta:'Vai do treino ao bar',barato:'Poliéster barato',reforco:'Gola ribana',capricho:'Etiqueta macia'},
 prob:{D:['Gola ficou larga','Estampa saiu torta','Modelagem apertada'],M:['Fornecedor atrasou o algodão','Tingimento veio manchado','Preço da malha subiu'],T:['Encolheu na lavagem','Costura abriu no teste','Cor desbotou']}}};
let prod='fone',cur=0,notes={};try{notes=JSON.parse(localStorage.getItem('lab-prod')||'{}');}catch(e){}
const D=()=>DATA[prod];
const pers=(p,set)=>`<label>Persona <select id="ps" style="background:var(--card);color:var(--ink);border-color:var(--line)">${D().per.map((x,i)=>`<option value="${i}" ${i===p?'selected':''}>${x.n}</option>`).join('')}</select></label>`;

/* 1 · Fórmula: mapa de duas dimensões, alvo escondido, resposta em texto */
function formula(root,pi=0){
 const d=D(),p=d.per[pi],s={used:[],cash:3000,tests:[],say:'',done:false};
 const pos=()=>s.used.reduce((a,i)=>[a[0]+d.ing[i][1],a[1]+d.ing[i][2]],[0,0]),cost=()=>Math.max(5,s.used.reduce((n,i)=>n+d.ing[i][3],d.base));
 const px=v=>210+v*19,py=v=>190-v*17;
 function reply(){const[x,y]=pos(),dx=x-p.x,dy=y-p.y;if(Math.hypot(dx,dy)<=1.5)return'É isso! Comprava hoje.';const w=v=>Math.abs(v)>=3?'':'Quase, mas: ';const o=[];if(Math.abs(dx)>=1)o.push(w(dx)+(dx>0?d.hi[0]:d.lo[0]));if(Math.abs(dy)>=1)o.push(w(dy)+(dy>0?d.hi[1]:d.lo[1]));return o.join(' ');}
 function draw(){
  const[x,y]=pos(),fit=Math.max(0,Math.round(100-Math.hypot(x-p.x,y-p.y)*9));let path=`M${px(0)} ${py(0)}`,a=[0,0];s.used.forEach(i=>{a=[a[0]+d.ing[i][1],a[1]+d.ing[i][2]];path+=`L${px(a[0])} ${py(a[1])}`;});
  root.innerHTML=`<div class="bar"><div><h2>Fórmula</h2><p class="soft">Escolha até 6 ingredientes e teste. O alvo está escondido: deduza pelo que a pessoa diz.</p></div>${pers(pi)}</div>
  <div class="say"><b>${p.n}, ${p.t.toLowerCase()}:</b> ${p.c.map(t=>'“'+t+'”').join(' ')}</div>
  <div class="two"><svg class="map" viewBox="0 0 420 380" role="img" aria-label="Mapa do produto"><line x1="210" y1="20" x2="210" y2="360" stroke="#4a4e73"/><line x1="20" y1="190" x2="400" y2="190" stroke="#4a4e73"/><text x="26" y="184">Simples</text><text x="330" y="184">Sofisticado</text><text x="216" y="32">Resistente</text><text x="216" y="358">Delicado</text>${s.tests.map(t=>`<circle cx="${px(t[0])}" cy="${py(t[1])}" r="5" fill="#b9b6cf"/>`).join('')}<path d="${path}" fill="none" stroke="#f2a93b" stroke-width="3" stroke-linejoin="round"/><circle cx="${px(x)}" cy="${py(y)}" r="9" fill="#f2a93b" stroke="#fff7ea" stroke-width="2"/>${s.done?`<circle cx="${px(p.x)}" cy="${py(p.y)}" r="20" fill="#3fae7d55" stroke="#8ff0bf" stroke-width="2"/>`:''}</svg>
  <div class="col"><div class="stats">${stat('Caixa',brl(s.cash))}${stat('Custo por unidade',brl(cost()))}${stat('Testes',s.tests.length)}</div>
  ${s.say?`<div class="say"><b>${p.n} testou:</b> ${s.say}</div>`:''}
  ${s.done?`<div class="end"><h3>Lançado</h3><p class="big">${fit}% de adequação</p><p class="soft">Custo de ${brl(cost())} por unidade, depois de ${s.tests.length} testes. O círculo verde era o alvo.</p><button class="go" id="again">Tentar de novo</button></div>`:`<div class="picks">${d.ing.map((g,i)=>`<button class="pick ${s.used.includes(i)?'sel':''}" data-g="${i}" ${!s.used.includes(i)&&s.used.length>=6?'disabled':''}><b>${g[0]}</b><small>${g[3]>=0?'+':'−'}${brl(Math.abs(g[3]))} por unidade</small></button>`).join('')}</div><div class="row"><button id="test" ${s.cash<500||!s.used.length?'disabled':''}>Testar com ${p.n} · R$ 500</button><button class="go" id="launch" ${!s.used.length?'disabled':''}>Lançar</button></div>`}</div></div>`;
  root.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const i=+b.dataset.g;s.used=s.used.includes(i)?s.used.filter(v=>v!==i):[...s.used,i];draw();});
  const t=$('test');if(t)t.onclick=()=>{s.cash-=500;s.tests.push(pos());s.say=reply();draw();};const l=$('launch');if(l)l.onclick=()=>{s.done=true;draw();};const ag=$('again');if(ag)ag.onclick=()=>formula(root,pi);$('ps').onchange=e=>formula(root,+e.target.value);
 }
 draw();
}

/* 2 · Quebra-cabeça: peças fixas num espaço limitado; vizinhos ajudam ou atrapalham */
const PIECES={nobre:{c:[[0,0],[1,0],[0,1],[1,1]],a:{Q:3},cost:12,col:'#8f6bd1'},forte:{c:[[0,0],[0,1],[0,2],[1,2]],a:{D:3},cost:7,col:'#3f8fe0'},leve:{c:[[0,0],[1,0],[2,0]],a:{R:2},cost:4,col:'#3fae7d'},potente:{c:[[0,0],[1,0],[2,0],[1,1]],a:{P:3},cost:9,col:'#d9744f'},adapta:{c:[[0,0],[1,0]],a:{V:2},cost:3,col:'#2aa7a0'},barato:{c:[[0,0],[1,0],[2,0],[3,0]],a:{E:3},cost:-5,col:'#c9a227'},reforco:{c:[[0,0],[0,1]],a:{D:1,P:1},cost:3,col:'#5f7fb5'},capricho:{c:[[0,0]],a:{Q:1},cost:2,col:'#b77fc9'}};
const LINKS=[['nobre','barato','Q',-2,'Nobre ao lado de barato: −2 Qualidade'],['forte','reforco','D',1,'Reforço com estrutura: +1 Durabilidade'],['potente','leve','P',1,'Função com facilidade: +1 Desempenho'],['adapta','leve','R',1,'Adaptável e fácil: +1 Praticidade'],['capricho','nobre','Q',1,'Detalhe com material nobre: +1 Qualidade']];
function puzzle(root,pi=0){
 const d=D(),p=d.per[pi],W=6,H=5,s={grid:Array(W*H).fill(null),sel:null,rot:0,hover:null,done:false},keys=Object.keys(PIECES);
 const shape=(k,r)=>{let c=PIECES[k].c;for(let i=0;i<r;i++)c=c.map(([x,y])=>[-y,x]);const mx=Math.min(...c.map(q=>q[0])),my=Math.min(...c.map(q=>q[1]));return c.map(([x,y])=>[x-mx,y-my]);};
 const cellsAt=(k,at)=>{const X=at%W,Y=Math.floor(at/W);return shape(k,s.rot).map(([x,y])=>{const a=X+x,b=Y+y;return a<W&&b<H?b*W+a:-1;});},fits=c=>c.every(i=>i>=0&&!s.grid[i]),placed=k=>s.grid.includes(k);
 function result(){const v={Q:0,D:0,P:0,R:0,V:0,E:0};let cost=d.base;const active=[];keys.filter(placed).forEach(k=>{cost+=PIECES[k].cost;Object.entries(PIECES[k].a).forEach(([a,n])=>v[a]+=n);});
  LINKS.forEach(([a,b,ax,n,txt])=>{const touch=s.grid.some((k,i)=>k===a&&[i-W,i+W,i%W?i-1:-1,i%W<W-1?i+1:-1].some(j=>j>=0&&s.grid[j]===b));if(touch){v[ax]+=n;active.push(txt);}});
  const need=Object.values(p.w).reduce((x,y)=>x+y,0),got=Object.entries(p.w).reduce((x,[a,n])=>x+Math.min(n,Math.max(0,v[a])),0);return{v,cost:Math.max(5,cost),fit:Math.round(got/need*100),active};}
 function draw(){
  const r=result(),prev=s.sel&&s.hover!=null&&!placed(s.sel)?cellsAt(s.sel,s.hover):[],ok=prev.length&&fits(prev);
  root.innerHTML=`<div class="bar"><div><h2>Quebra-cabeça de decisões</h2><p class="soft">Encaixe as decisões no espaço do projeto. Não cabe tudo, e os vizinhos mudam o resultado.</p></div>${pers(pi)}</div>
  <div class="say"><b>${p.n} precisa de:</b> ${Object.entries(p.w).map(([a,n])=>`${AX[a]} ${Math.max(0,r.v[a])}/${n}`).join(' · ')}</div>
  <div class="two"><div class="col"><div class="grid" style="grid-template-columns:repeat(${W},minmax(0,1fr))" id="pg">${s.grid.map((k,i)=>`<button class="cell ${prev.includes(i)?(ok?'reach':'bad'):''}" data-c="${i}" style="${k?'background:'+PIECES[k].col:''}" aria-label="Espaço ${i+1}${k?', '+d.roles[k]:''}"></button>`).join('')}</div><div class="row"><button id="rot">Girar a peça</button><button class="go" id="fin">Lançar</button></div></div>
  <div class="col"><div class="stats">${stat('Adequação',r.fit+'%')}${stat('Custo por unidade',brl(r.cost))}</div>
  ${s.done?`<div class="end"><h3>Lançado</h3><p class="big">${r.fit}% de adequação</p><p class="soft">Custo de ${brl(r.cost)} por unidade.</p><button class="go" id="again">Tentar de novo</button></div>`:''}
  <div class="picks">${keys.map(k=>`<button class="pick ${s.sel===k?'sel':''}" data-p="${k}"><b style="color:${PIECES[k].col}">■ ${d.roles[k]}</b><small>${Object.entries(PIECES[k].a).map(([a,n])=>'+'+n+' '+AX[a]).join(', ')} · ${PIECES[k].c.length} espaços${placed(k)?' · clique para tirar':''}</small></button>`).join('')}</div>
  <div class="chips">${LINKS.map(l=>`<span class="chip" style="${r.active.includes(l[4])?'background:#ffe9c4;border-color:var(--sun2)':''}">${l[4]}</span>`).join('')}</div></div></div>`;
  root.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.p;if(placed(k)){s.grid=s.grid.map(v=>v===k?null:v);s.sel=k;}else s.sel=s.sel===k?null:k;draw();});
  root.querySelectorAll('[data-c]').forEach(b=>{b.onmouseenter=()=>{if(s.sel&&!placed(s.sel)){s.hover=+b.dataset.c;paint();}};b.onclick=()=>{const i=+b.dataset.c;if(s.grid[i]&&!s.sel){const k=s.grid[i];s.grid=s.grid.map(v=>v===k?null:v);draw();return;}if(!s.sel||placed(s.sel))return;const c=cellsAt(s.sel,i);if(fits(c)){c.forEach(j=>s.grid[j]=s.sel);s.sel=null;s.hover=null;draw();}else{s.hover=i;paint();}};});
  $('rot').onclick=()=>{s.rot=(s.rot+1)%4;paint();};$('fin').onclick=()=>{s.done=true;draw();};const ag=$('again');if(ag)ag.onclick=()=>puzzle(root,pi);$('ps').onchange=e=>puzzle(root,+e.target.value);
 }
 function paint(){const prev=s.sel&&s.hover!=null&&!placed(s.sel)?cellsAt(s.sel,s.hover):[],ok=prev.length&&fits(prev);root.querySelectorAll('[data-c]').forEach(b=>{const i=+b.dataset.c;b.classList.toggle('reach',!!ok&&prev.includes(i));b.classList.toggle('bad',!ok&&prev.includes(i));});}
 draw();
}

/* 3 · Antecipar problemas: tudo visível antes; o erro é sempre do jogador */
const SCRIPT=[[1,0,0,'D',3],[1,4,1,'M',2],[2,2,3,'T',2],[3,5,0,'D',3],[3,0,4,'M',2],[4,3,1,'T',2],[4,5,4,'T',3],[5,1,2,'D',2],[5,4,3,'M',2],[6,2,0,'M',2],[6,0,3,'T',2],[7,3,4,'D',2],[7,5,2,'T',2]];
const TEAM=[{n:'Ana',k:'D',role:'Design'},{n:'Beto',k:'M',role:'Materiais'},{n:'Caio',k:'T',role:'Testes'}];
const KCOL={D:'#8f6bd1',M:'#c9a227',T:'#d9574f'},KHIT={D:'−1 Qualidade',M:'+R$ 2 por unidade',T:'+1 defeito'};
function foresee(root){
 const W=6,H=5,turns=8,d=D(),count={D:0,M:0,T:0},s={turn:1,team:[{x:0,y:2,moved:false},{x:3,y:2,moved:false},{x:5,y:3,moved:false}],probs:[],sel:null,q:5,cost:d.base,def:0,solved:0,missed:0,log:'',done:false};
 const spawn=t=>SCRIPT.filter(x=>x[0]===t).forEach(([,x,y,k,cd])=>{s.probs.push({x,y,k,cd,name:d.prob[k][count[k]++%3]});});spawn(1);
 const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),at=(x,y)=>s.team.findIndex(m=>m.x===x&&m.y===y);
 function endTurn(){const msgs=[];s.probs=s.probs.filter(p=>{const here=s.team.map((m,i)=>m.x===p.x&&m.y===p.y?i:-1).filter(i=>i>=0);if(here.some(i=>TEAM[i].k===p.k)||here.length>=2){s.solved++;msgs.push('✓ '+p.name);return false;}p.cd--;if(p.cd<=0){s.missed++;if(p.k==='D')s.q--;if(p.k==='M')s.cost+=2;if(p.k==='T')s.def++;msgs.push('✕ '+p.name+': '+KHIT[p.k]);return false;}return true;});s.team.forEach(m=>m.moved=false);s.sel=null;s.log=msgs.join(' · ')||'Rodada tranquila.';s.turn++;if(s.turn>turns){s.done=true;s.probs=[];}else spawn(s.turn);draw();}
 function draw(){
  const next=SCRIPT.filter(x=>x[0]===s.turn+1),m=s.sel==null?null:s.team[s.sel];let cells='';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=s.probs.find(q=>q.x===x&&q.y===y),g=next.find(q=>q[1]===x&&q[2]===y),i=at(x,y),reach=m&&!m.moved&&dist(m,{x,y})<=2&&(i<0||i===s.sel);
   cells+=`<button class="cell ${reach?'reach':''}" data-x="${x}" data-y="${y}" style="${i>=0?'background:'+KCOL[TEAM[i].k]+';box-shadow:inset 0 0 0 3px #fff7ea':p?'background:'+KCOL[p.k]:g?'background:'+KCOL[g[3]]+';opacity:.45':''}" aria-label="Linha ${y+1}, coluna ${x+1}${p?', problema: '+p.name:''}${i>=0?', '+TEAM[i].n:''}">${i>=0?TEAM[i].n[0]+(p?'!':''):p?p.cd:g?'?':''}</button>`;}
  const score=Math.max(0,Math.round(s.solved/(s.solved+s.missed||1)*100));
  root.innerHTML=`<div><h2>Antecipar problemas</h2><p class="soft">Os números mostram quantas rodadas faltam para o problema estourar. As células apagadas mostram onde surgem os da próxima rodada. Cada pessoa anda até 2 casas. Quem é da área resolve sozinho; fora da área, são precisos dois.</p></div>
  <div class="two"><div class="col"><div class="grid" style="grid-template-columns:repeat(${W},minmax(0,1fr))">${cells}</div><div class="chips">${TEAM.map(t=>`<span class="chip"><b style="color:${KCOL[t.k]}">■</b> ${t.n}: ${t.role}, estouro ${KHIT[t.k]}</span>`).join('')}</div></div>
  <div class="col"><div class="stats">${stat('Rodada',Math.min(s.turn,turns)+' de '+turns)}${stat('Qualidade',s.q+'/5')}${stat('Custo por unidade',brl(s.cost))}${stat('Defeitos',s.def)}</div>
  ${s.log?`<div class="say">${s.log}</div>`:''}
  ${s.done?`<div class="end"><h3>Projeto entregue</h3><p class="big">${score}% resolvido</p><p class="soft">${s.solved} resolvidos e ${s.missed} estouraram. O projeto é sempre o mesmo: dá para jogar de novo e melhorar.</p><button class="go" id="again">Tentar de novo</button></div>`:`<div class="picks">${TEAM.map((t,i)=>`<button class="pick ${s.sel===i?'sel':''}" data-t="${i}" ${s.team[i].moved?'disabled':''}><b>${t.n}</b><small>${s.team[i].moved?'Já se moveu':t.role}</small></button>`).join('')}</div><div class="col">${s.probs.map(p=>`<span class="chip"><b style="color:${KCOL[p.k]}">■</b> ${p.name}: estoura em ${p.cd}</span>`).join('')}</div><button class="go" id="end">Encerrar a rodada</button>`}</div></div>`;
  root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{s.sel=+b.dataset.t;draw();});
  root.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const x=+b.dataset.x,y=+b.dataset.y,i=at(x,y);if(i>=0&&!s.team[i].moved&&i!==s.sel){s.sel=i;draw();return;}if(!m||m.moved||s.done||dist(m,{x,y})>2||i>=0)return;m.x=x;m.y=y;m.moved=true;s.sel=null;draw();});
  const e=$('end');if(e)e.onclick=endTurn;const ag=$('again');if(ag)ag.onclick=()=>foresee(root);
 }
 draw();
}

const MODES=[['Fórmula','Deduzir',formula],['Quebra-cabeça','Encaixar',puzzle],['Antecipar','Planejar',foresee]];
function show(i){cur=i;const m=MODES[i],key=m[0];
 const tabs=()=>{$('tabs').innerHTML=MODES.map((x,j)=>`<button data-tab="${j}" class="${j===i?'on':''}" aria-pressed="${j===i}">${x[0]}${notes[x[0]]?' '+'★'.repeat(notes[x[0]]):''}<small>${x[1]}</small></button>`).join('');$('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(+b.dataset.tab));};
 const stars=()=>{$('stars').innerHTML=[1,2,3,4,5].map(n=>`<button data-n="${n}" aria-label="Nota ${n}">${n<=(notes[key]||0)?'★':'☆'}</button>`).join('');$('stars').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{notes[key]=+b.dataset.n;try{localStorage.setItem('lab-prod',JSON.stringify(notes));}catch(e){}tabs();stars();});};
 tabs();stars();$('rl').textContent=`Quanto ${key} divertiu?`;m[2]($('st'));}
$('prod').onchange=e=>{prod=e.target.value;show(cur);};show(0);
</script>
