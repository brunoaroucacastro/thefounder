sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:.5,far:40});sun.shadow.bias=-.0008;
const lamp=new THREE.PointLight('#ffb060',1.5,6,1.6);lamp.position.set(5.62,1.38,.5);lamp.castShadow=true;lamp.shadow.mapSize.set(1024,1024);lamp.shadow.bias=-.004;scene.add(lamp);
const monL=new THREE.PointLight('#66ddff',.5,3,2);monL.position.set(4.8,1.4,.9);scene.add(monL);
glow(5.66,.45,1.46,1.6,'#ffb060',.55);glow(4.8,.45,1.43,2.2,'#66ddff',.18);

/* ---------- câmera ---------- */
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);const target=new THREE.Vector3(4,.9,4);
let ang=Math.PI/4,drag=null;
function placeCam(){cam.position.set(target.x+Math.sin(ang)*14,target.y+11.5,target.z+Math.cos(ang)*14);cam.lookAt(target)}
function resize(){renderer.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight,v=a>1.25?5.8:7.4/a;cam.left=-v*a;cam.right=v*a;cam.top=v;cam.bottom=-v;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();placeCam();
renderer.domElement.addEventListener('pointerdown',e=>drag=e.clientX);addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(drag===null)return;ang=Math.max(.2,Math.min(1.37,ang-(e.clientX-drag)*.005));drag=e.clientX;placeCam()});

/* ---------- animação ---------- */
const clk=new THREE.Clock();
function loop(){const t=clk.getElapsedTime();
  arms[0].rotation.x=-.25+Math.sin(t*22)*.06;arms[1].rotation.x=-.25+Math.sin(t*22+Math.PI)*.06;
  head.rotation.z=Math.sin(t*1.9)*.05;head.rotation.x=Math.sin(t*.8)*.04;
  cat.scale.set(1,1+Math.sin(t*2.2)*.04,1);
  bulbs.forEach((b,i)=>b.material.opacity=.45+.35*Math.sin(t*2+i*1.3));
  if(flashT>0){flashT-=clk.getDelta?0:0;}
  renderer.render(scene,cam);requestAnimationFrame(loop)}
loop();

/* ---------- vendas ---------- */
const buyers=['Marina, 24','Caio, 31','Júlia, 19','Rafael, 42','Bia, 27','Otávio, 35'];let cash=12450,n=0,mins=19*60+42;
function sale(){const v=[159,189,189,219,174][n%5];cash+=v;n++;
  document.getElementById('cash').textContent='R$ '+cash.toLocaleString('pt-BR');document.getElementById('toast-val').textContent='+R$ '+v;document.getElementById('toast-who').textContent='Fone Aurora · '+buyers[n%buyers.length];
  const tt=document.getElementById('toast');tt.classList.add('show');setTimeout(()=>tt.classList.remove('show'),2600);
  bars=bars.slice(1).concat([.3+Math.random()*.6]);flashT=1;drawScreen();setTimeout(()=>{flashT=0;drawScreen()},200);
  const p=new THREE.Vector3(4.8,2.0,.4).project(cam);const d=document.createElement('div');d.className='float';d.textContent='+R$ '+v;
  d.style.left=(p.x+1)/2*innerWidth+'px';d.style.top=(1-p.y)/2*innerHeight+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
setTimeout(sale,1200);setInterval(sale,4200);
setInterval(()=>{mins++;document.getElementById('clock').textContent=String(Math.floor(mins/60)%24).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')},1000);
</script>
