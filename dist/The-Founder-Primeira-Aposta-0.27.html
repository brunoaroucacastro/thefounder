 function drawOverview(){const groups=C.overview(g);$('product-overview').hidden=!overviewOpen;if(!overviewOpen)return;$('product-overview').innerHTML='<div class="product-book"><div class="book-head"><div><small>SUA PRATELEIRA · PANORAMA POR PRODUTO</small><h2>O que cada criação já conquistou.</h2></div>'+button('Voltar à oficina','closeOverview','','secondary')+'</div><p>Resultado usa o custo das unidades vendidas; caixa também considera o estoque comprado. As estrelas abaixo agrupam a linha; a prova social nas vendas usa a versão atual. Os R$8.000 do MVP e os investimentos em melhoria entram no resultado.</p>'+groups.map(r=>'<article class="product-account"><h3>'+esc(r.name)+' <small>'+r.versions.length+' versão(ões)</small></h3><div class="account-highlights"><div><small>UNIDADES VENDIDAS · TOTAL</small><b>'+r.sold+'</b></div><div><small>TOTAL INVESTIDO / PAGO</small><b>'+money(r.invested)+'</b></div><div><small>RESULTADO ACUMULADO</small><b class="'+(r.profit<0?'negative':'positive')+'">'+money(r.profit)+'</b><small>'+(r.profit>0?'Deu lucro após os custos registrados':r.profit<0?'Ainda não recuperou os custos no resultado':'Resultado zerado')+'</small></div><div><small>NOTA MÉDIA</small><b>'+(r.averageStars===null?'Sem avaliações':r.averageStars.toFixed(1)+' ★ / 5')+'</b><small>'+r.reviewCount+' avaliações</small></div></div><div class="account-secondary"><span>Receita: <b>'+money(r.revenue)+'</b></span><span>Estoque: <b>'+r.stock+' un. · '+money(r.inventoryValue)+'</b></span><span>Saldo de caixa gerado: <b>'+money(r.cashGenerated)+'</b></span><span>CAC pago'+(r.incompleteCAC?' · desde a atualização':'')+': <b>'+(r.cac===null?'—':money(r.cac))+'</b></span><span>MC após marketing: <b>'+(r.afterMarketing===null?'Histórico incompleto':money(r.afterMarketing)+(r.afterMarketingPercent===null?'':' · '+r.afterMarketingPercent.toFixed(1)+'%'))+'</b></span></div><details><summary>Ver versões e a conta completa</summary>'+r.versions.map(v=>'<section><h4>'+esc(v.name)+' · NV '+v.level+'</h4><p>'+v.sold+' vendidas · '+money(v.revenue)+' de receita · '+money(v.profit)+' de resultado · '+(v.averageStars===null?'sem nota':v.averageStars.toFixed(1)+' ★')+'</p><p>Receita '+money(v.revenue)+' − custo dos produtos vendidos '+money(v.cogs)+' − comissão '+money(v.fees)+' − marketing '+(v.marketingUnknown?'incluído nos custos históricos':money(v.marketing))+' − MVP, pesquisa, praça e operação '+money(v.fixed)+' = '+money(v.profit)+'</p><p>Compra de estoque: '+money(v.materials)+' · estoque restante: '+money(v.inventoryValue)+'. Investido é tudo que foi pago, incluindo despesas e comissões.'+(v.incompleteCAC?' CAC anterior sem clientes identificados: não foi estimado retroativamente.':'')+'</p></section>').join('')+'</details></article>').join('')+(!groups.length?'<p>Sua primeira criação aparecerá aqui quando você escolher um gadget.</p>':'')+'</div>';}
 function showOverview(){if(rolling){notify('Conclua a rolagem antes de abrir a prateleira.');return;}overviewWasPaused=g.paused;if(!g.paused)dispatch({type:'pause'});overviewOpen=true;drawOverview();}
 function closeOverview(){overviewOpen=false;drawOverview();if(!overviewWasPaused&&g.paused)dispatch({type:'pause'});}
 function render(){
  const p=g.phase,c=C.client(g),job=g.job,hidden=!!rolling;let html='';
  $('company').textContent=g.company+(g.evolution?' · NV '+g.level:'')+' · Dia '+(1+Math.floor(g.clock/60))+' · '+String(8+Math.floor(g.clock%60/5)).padStart(2,'0')+'h';$('cash').textContent=money(g.cash);$('focus').textContent='★'.repeat(g.focus)+'☆'.repeat(4-g.focus);$('pause').textContent=g.paused?'▶':'Ⅱ';$('pause').disabled=!!rolling;$('speed').disabled=!!rolling;$('speed').textContent=g.speed+'×';$('sound').textContent=sound?'♫':'♪';
  if(p==='intro'){chooseGuide('UMA GARAGEM. UMA IDEIA.','Uma ideia que alguém queira comprar.','Uma pequena experiência de criar, testar e conquistar as primeiras vendas.');html=`<div class="intro"><div class="art" style="font-size:65px;color:#b8936e">♬</div><div class="intro-copy"><h2>A sua primeira aposta.</h2><p>Conheça alguém. Monte o gadget. Veja sua ideia encontrar compradores.</p><p><b>${money(g.cash)}</b> para começar · quatro decisões por ciclo · tempo com pausa.</p></div>${button('Entrar na oficina →','start')}</div>`;}
  else if(p==='catalog'){chooseGuide('1 · ESCOLHER GADGET','Qual será sua próxima criação?','Três famílias iniciais. Novas tecnologias chegam com pesquisa.');html=head('A bancada está livre.','Escolha primeiro o produto; depois conheça quem vai usá-lo.')+'<div class="choices">'+C.G.products.map(item=>{const open=g.unlocked.includes(item.id);return '<button class="choice" data-action="'+(open?'product':'unlockGadget')+'" data-id="'+item.id+'" '+(!open&&g.history.length<item.unlock?'disabled':'')+'><span class="art">'+item.icon+'</span><div><h3>'+item.name+'</h3><p>'+(open?'Pesquisar três personas · R$150':g.history.length<item.unlock?'🔒 Conclua dois produtos para pesquisar':'Pesquisar tecnologia · R$1.200')+'</p></div></button>';}).join('')+'</div>';}
  else if(p==='design'&&g.gadgets){chooseGuide('1º P · PRODUTO','Seu MVP tem até 4 pontos.',c.name+': '+c.quote);html=head(C.G.product(g).name+' · MVP com até 4 pontos',C.G.total(g)+' de 4 pontos usados · '+(4-C.G.total(g))+' livres')+'<div class="design-lab">'+radar()+'<div class="attribute-grid">'+C.axes(g).map(a=>'<div class="attribute"><div><b>'+a.name+'</b><small>'+a.hint+' · '+({cost:'reduz custo',speed:'+R$6/un.',reliability:'+R$5/un.',quality:'+R$9/un.',sustainability:'+R$7/un.',flexibility:'+R$4/un.'}[a.id])+'</small></div>'+button('−','attribute','data-id="'+a.id+'" data-delta="-1" '+(!g.attributes[a.id]?'disabled':''),'secondary')+'<strong>'+g.attributes[a.id]+'</strong>'+button('+','attribute','data-id="'+a.id+'" data-delta="1" '+(C.G.total(g)>=C.pointBudget(g)||g.attributes[a.id]>=5?'disabled':''),'secondary')+'</div>').join('')+'<p class="trade-note">MVP: até 4 pontos. Evolua até 15 pontos no nível 10. Máximo de 5 por atributo. Atributos têm relevâncias diferentes para cada persona.</p></div></div><div class="tray-foot"><div class="grow"><input class="product-name" id="product-name" maxlength="28" aria-label="Nome do produto" value="'+esc(g.name)+'"><span>Custo variável: '+money(C.unitCost(g))+'/unidade · MVP fixo: R$8.000</span></div>'+button('Trocar persona','backClient','','compact-link')+button('Escolher praça e promoção →','reveal','')+'</div>';}
  else if(p==='pricing'){chooseGuide('PREÇO · ANTES DO D20 DA CAMPANHA','Quanto vale o que você criou?','A margem define o preço por unidade. O desenvolvimento é um investimento separado.');const cost=g.pricingContext==='recampaign'&&g.stock?g.inventoryBook/g.stock:g.bulkDice?C.batchUnitCost(g):C.unitCost(g),price=C.priceFor(g,g.margin);html=head('Cada unidade custa '+money(cost)+'. Por quanto vender?','MVP: R$8.000 fixos · lote de '+g.batchSize+' unidades · desconto de '+Math.round(C.volumeDiscount(g.batchSize)*100)+'% · comissão de '+Math.round(C.place(g).fee*100)+'%.')+'<div class="pricing-desk">'+gadgetArt()+'<div class="grow"><label for="margin">Margem antes da aquisição: <b id="margin-value">'+g.margin+'%</b></label><input id="margin" type="range" min="10" max="'+C.maxMargin(g)+'" step="1" value="'+g.margin+'" aria-label="Margem antes do marketing, com comissão"><div class="price-calculation"><span>CUSTO / UNIDADE<b>'+money(cost)+'</b></span><span>PREÇO DE VENDA<b id="calculated-price">'+money(price)+'</b></span><span>CONTRIBUIÇÃO / UNIDADE<b id="gross-value">'+money(price-cost-price*(C.place(g)?.fee||0))+'</b></span></div><p>Margem = (preço − custo do lote − comissão) ÷ preço. Comissão da praça já incluída. Essa contribuição ainda paga promoção, aluguel e MVP.</p><p>Mais caro pode afastar compradores. A conta após CAC aparece abaixo; o realizado só será conhecido com as vendas.</p><div id="pricing-acquisition">'+forecastMarkup({...g,price})+'</div></div>'+(g.behavior&&g.priorPrice&&!g.pricingContext?button('Manter preço anterior · '+money(g.priorPrice),'keepPrice','','secondary'):'')+button(g.pricingContext==='recampaign'?'Voltar ao plano de campanha →':'Confirmar preço e rolar campanha →','confirmPrice')+'</div>';}
  else if(p==='place'){chooseGuide('2º P · PRAÇA','Onde seu produto vai encontrar pessoas?','Praça é o lugar de venda. Alcance, custo e comissão mudam.');html=head('Escolha sua vitrine.','Defina praça e promoção; depois lote e preço, antes de rolar a campanha.')+'<div class="choices">'+C.places.map(pl=>'<button class="choice" data-action="place" data-id="'+pl.id+'"><span class="art">'+pl.icon+'</span><div><h3>'+pl.name+'</h3><p>'+pl.detail+'</p><small>Abertura: '+money(pl.cost)+' · comissão: '+Math.round(pl.fee*100)+'%</small><p>Comissão é por venda. CAC é o gasto da campanha por novo cliente; será estimado após definir preço e promoção.</p></div></button>').join('')+'</div>';}
  else if(p==='promotion'){const used=Object.values(g.promo).reduce((n,v)=>n+v,0);chooseGuide('3º P · PROMOÇÃO','Como sua ideia vai chamar atenção?','Até 4 pontos de campanha. Seu produto e sua promessa precisam combinar.');html=head('Distribua a força da campanha.',used+' de 4 pontos usados · custo '+money(150+used*100))+'<div class="choices">'+[{id:'demo',name:'Mostrar funcionando',icon:'▶',text:'Ajuda a convencer. Funciona melhor em demonstrações na feira.'},{id:'creator',name:'Espalhar a novidade',icon:'★',text:'Mais alcance e público mais variado. Nem todos precisam do seu produto.'},{id:'offer',name:'Explicar o valor',icon:'♥',text:'Ajuda a entender por que vale a compra. Sem desconto automático.'}].map(ad=>'<div class="choice"><span class="art">'+ad.icon+'</span><div><h3>'+ad.name+'</h3><p>'+ad.text+'</p>'+button('−','promoPoint','data-id="'+ad.id+'" data-delta="-1" '+(!g.promo[ad.id]?'disabled':''),'secondary')+' <b>'+g.promo[ad.id]+'</b> '+button('+','promoPoint','data-id="'+ad.id+'" data-delta="1" '+(used>=4?'disabled':''),'secondary')+'</div></div>').join('')+'</div><div class="tray-foot"><p class="grow">Aquisição: R$150 de preparação + R$100 por ponto. Esse gasto entra no CAC, separado da comissão.</p>'+button('Ver minha criação →','confirmPromotion')+'</div>';}
  else if(p==='blueprint'){chooseGuide('4 · SUA CRIAÇÃO',g.name,'Um conceito pronto para sair do papel.');html='<div class="blueprint">'+gadgetArt()+'<div><h2>'+esc(g.name)+'</h2><p>'+esc(g.description)+'</p><p><b>Para '+esc(c.name)+'</b> · '+esc(c.title)+'</p><small>Custo base: '+money(C.unitCost(g))+'/unidade · lote e preço serão definidos antes do D20 da campanha.</small><p>'+C.axes(g).filter(a=>g.attributes[a.id]>0).map(a=>a.name+': '+g.attributes[a.id]).join(' · ')+'</p><p>'+esc(C.place(g)?.name||'')+' · '+Object.values(g.promo).reduce((n,v)=>n+v,0)+' pontos de promoção</p><small>Desenvolvimento: R$8.000 · praça: '+money(C.place(g)?.cost||0)+' · promoção: '+money(150+Object.values(g.promo).reduce((n,v)=>n+v,0)*100)+'</small></div><div class="result-actions">'+button('Desenvolver MVP · R$8.000','build')+button('Ajustar o projeto','editDesign','','secondary')+'</div></div>';}
  else if(p==='upgradePlan'){const u=g.upgrade;chooseGuide('EVOLUIR · '+g.name,'Nível '+g.level+' → '+(g.level+1),'Redistribua os atributos. Mais pontos mudam custo, valor percebido e avaliações.');html=head('Qual será a próxima geração?','Investimento: '+money(u.cost)+' · dificuldade '+u.difficulty+' no D20 · chance base '+Math.round((21-u.difficulty)/20*100)+'% sem bônus')+'<div class="version-ladder">'+[4,5,6,7,8,9,10].map(l=>'<span class="'+(l<=g.level?'complete':l===g.level+1?'next':'')+'">NV '+l+'</span>').join('')+'</div>'+(g.behavior&&g.reviews.length?'<div class="upgrade-feedback"><b>O que os compradores disseram</b>'+g.reviews.slice(-3).map(r=>'<p>'+('★'.repeat(r.stars))+' · '+esc(r.feedback)+'</p>').join('')+'</div>':'')+'<div class="tray-foot"><label class="grow">Nome da nova versão <input id="upgrade-name" class="product-name" maxlength="28" value="'+esc(u.name)+'"></label><p>Atual: '+esc(g.name)+' · '+g.stock+' unidades antigas em estoque</p></div><p>Distribua até '+u.budget+' pontos · usados '+C.G.U.total(u.attributes)+' · máximo 5 por atributo. Você pode redistribuir o projeto.</p><div class="choices four">'+C.axes(g).map(ax=>'<div class="choice"><h3>'+ax.name+'</h3>'+button('−','upgradePoint','data-id="'+ax.id+'" data-delta="-1"','secondary')+' <b>'+u.attributes[ax.id]+' / 5</b> '+button('+','upgradePoint','data-id="'+ax.id+'" data-delta="1"','secondary')+'</div>').join('')+'</div><div class="tray-foot"><p class="grow">Se falhar: dinheiro gasto, produto e nível preservados. Se passar: nova versão, sem transformar o estoque antigo.</p>'+button('Voltar','upgradeCancel','','secondary')+button('Investir '+money(u.cost)+' e desenvolver','upgradeStart',g.cash<u.cost?'disabled':'')+'</div>';}
  else if(['upgradeReady','upgradeOutcome'].includes(p)){const ready=p==='upgradeReady',r=g.upgrade.roll;chooseGuide('D20 · NOVA GERAÇÃO',g.upgrade.name,'Precisa alcançar '+g.upgrade.difficulty+' no total. Natural 1 sempre falha.');html='<div class="dice-tray">'+dieHTML(r,ready?'rollUpgrade':null)+'<div class="dice-copy"><h2>'+(hidden?'Vamos testar a evolução…':ready?'Seu projeto alcança o próximo nível?':r.success?'Passou! Nível '+(g.level+1)+' disponível.':'Ainda não foi desta vez.')+'</h2><p>'+(hidden?'O investimento já virou trabalho na bancada.':ready?'Dificuldade '+g.upgrade.difficulty+'. O resultado será salvo antes da animação.':r.success?'A nova versão recebe o projeto planejado, com até '+g.upgrade.budget+' pontos. O estoque antigo conserva os atributos anteriores.':'A tentativa custou '+money(g.upgrade.cost)+'. '+esc(g.name)+' continua no nível '+g.level+'.')+'</p>'+(!hidden?formula(r):'')+'<div class="dice-bands"><span>Natural 1 · falha</span><span>Total abaixo de '+g.upgrade.difficulty+' · mantém nível</span><span class="'+(!hidden&&r?.success?'lit':'')+'">'+g.upgrade.difficulty+'+ · avança 1 nível</span></div></div><div class="result-actions">'+(hidden?'':ready?button('Rolar evolução 🎲','rollUpgrade'):button(r.success?'Lançar '+esc(g.upgrade.name)+' →':'Cuidar do produto atual →','upgradeResolve'))+'</div></div>';}
  else if(p==='recampaignPlan'){const d=g.campaignDraft,used=Object.values(d.promo).reduce((n,v)=>n+v,0),cost=C.campaignBudget(d);chooseGuide('MAIS PESSOAS · '+g.name,d.forLaunch?'Sua nova versão merece uma estreia.':'Uma nova campanha para o mesmo produto.','O orçamento compra alcance. Produto, preço e estoque precisam convencer.');html=head('Como você vai mostrar '+esc(g.name)+'?',used+' de 4 pontos · investimento '+money(cost))+(g.behavior&&!d.forLaunch?'<div class="campaign-kinds">'+button('📣 Atrair novas pessoas','campaignKind','data-kind="reach"',d.kind==='reach'?'selected':'secondary')+button('↻ Convencer interessados · <span id="warm-count">'+C.warmCandidates(g).length+'</span>','campaignKind','data-kind="retarget"',d.kind==='retarget'?'selected':'secondary')+'</div>':'')+'<div class="choices">'+[{id:'demo',name:'Mostrar funcionando',icon:'▶'},{id:'creator',name:'Espalhar a novidade',icon:'★'},{id:'offer',name:'Explicar o valor',icon:'♥'}].map(ad=>'<div class="choice"><span class="art">'+ad.icon+'</span><div><h3>'+ad.name+'</h3>'+button('−','recampaignPoint','data-id="'+ad.id+'" data-delta="-1" '+(!d.promo[ad.id]?'disabled':''),'secondary')+' <b>'+d.promo[ad.id]+'</b> '+button('+','recampaignPoint','data-id="'+ad.id+'" data-delta="1" '+(used>=4?'disabled':''),'secondary')+'</div></div>').join('')+'</div><div class="tray-foot"><div class="grow"><div class="price-tags">'+[{n:1,label:'Enxuta'},{n:2,label:'Reforçada'},{n:4,label:'Grande aposta'}].map(v=>button(v.label+'<small>'+money(C.campaignBudget({...d,scale:v.n}))+'</small>','recampaignScale','data-scale="'+v.n+'"',d.scale===v.n?'selected':'secondary')).join('')+'</div><p>'+(d.kind==='retarget'?'Reapresenta o produto a até '+Math.min(C.warmCandidates(g).length,C.retargetLimit(d))+' interessados. O dado muda a eficácia. O interesse esfria em três dias simulados.':'12 no dado: '+C.campaignPotential(g,d)+' interessados · 18: '+Math.round(C.campaignPotential(g,d)*1.45)+'. Mais orçamento tem retorno decrescente.')+'</p></div>'+(g.behavior&&!d.forLaunch?button('Rever preço · '+money(g.price),'campaignPrice','','secondary'):'')+(d.forLaunch?'':button('Voltar','recampaignCancel','','secondary'))+button('Preparar campanha · '+money(cost),'recampaignStart',g.cash<cost?'disabled':'')+'</div>';}

  const key=(g.reviews?.length||0)+'|'+Math.floor(g.crew?.elapsed||0)+'|'+p+'|'+g.revision+'|'+!!rolling+'|'+g.sales?.seen;if(key!==signature){if(g.fourPs&&['selling','recap'].includes(g.phase)){const reviews=[...g.portfolio.flatMap(pr=>pr.reviews||[]),...g.reviews];html+='<div class="review-board"><b>AVALIAÇÕES · '+reviews.length+'</b><small> Uma avaliação de um comprador real a cada 10 unidades vendidas. Pessoas diferentes têm expectativas diferentes.</small>'+reviews.slice(-3).map(rv=>'<article><strong>'+('★'.repeat(rv.stars)+'☆'.repeat(5-rv.stars))+'</strong><span>'+esc(rv.buyer)+' · após '+rv.sold+' vendas</span><p>'+esc(rv.feedback)+'</p>'+(rv.profile?'<small>'+esc(rv.profile.context)+' · '+esc(rv.profile.age)+'</small>':'')+'</article>').join('')+(!reviews.length?'<p>Primeira avaliação ao completar 10 vendas.</p>':'')+'</div>';} $('tray').innerHTML=html;signature=key;resize();}if(overviewOpen)drawOverview();
  updateLive();
 }
 function updateLive(){if(g.behavior&&g.phase==='recampaignPlan'){const el=$('warm-count');if(el)el.textContent=C.warmCandidates(g).length;}if(g.fourPs)$('company').textContent=g.company+' · Dia '+(1+Math.floor(g.clock/60))+' · '+String(8+Math.floor(g.clock%60/5)).padStart(2,'0')+'h';if(g.job){const el=$('job-progress');if(el)el.style.width=g.job.elapsed/g.job.duration*100+'%';}if(g.crew&&g.phase==='selling'){const el=$('crew-progress');if(el)el.textContent=Math.floor(g.crew.elapsed/g.crew.duration*100)+'% · bancada ocupada';}if(g.sales&&g.phase==='selling'){const el=$('sales-progress');if(el)el.style.width=g.sales.seen/g.leads*100+'%';}if(blocked)return;const bubble=$('bubble');if(rolling){bubble.innerHTML='<b>Na bancada</b>Vamos ver como essa aposta se sai…';bubble.className='speech';}else if(g.phase==='customer'||g.phase==='intro'){bubble.innerHTML='<b>Nina · produção</b>Escolha alguém. A gente constrói para essa pessoa.';bubble.className='speech';}else if(g.phase==='design'){bubble.innerHTML='<b>'+esc(C.client(g).name)+'</b>'+esc(C.client(g).quote);bubble.className='speech';}else if(g.lastEvent){bubble.innerHTML='<b>'+(['sale','lost'].includes(g.lastEvent.kind)?esc(g.lastEvent.actor||'Um visitante'):'Na oficina')+'</b>'+esc(g.lastEvent.text);bubble.className='speech '+g.lastEvent.kind;}
  $('notice').textContent=g.paused?'Ⅱ Em pausa':g.portfolio?.some(p=>p.stock>0)?'CATÁLOGO · '+g.portfolio.reduce((n,p)=>n+p.stock,0)+' unidades anteriores ainda à venda':g.phase==='recap'?g.history.length+' criação(ões) na sua prateleira':g.polish?'✦ Acabamento caprichado':g.early?'✦ Apresentação adiantada · +6 interessados':'';
 }
 function restart(){if(!window.confirm('Começar uma empresa nova neste experimento? Seu jogo completo não será alterado.'))return;try{const next=C.fresh(Date.now(),{gadgets:true,fourPs:true,bulkDice:true,evolution:true,accounting:true,behavior:true,universal:true});if(blocked){localStorage.setItem(KEY,JSON.stringify(next));expected=JSON.stringify(next);blocked=false;}else persist(next);g=next;rolling=null;signature='';render();}catch(e){fail(e);}}
 $('restart').addEventListener('click',restart);$('products').addEventListener('click',showOverview);$('product-overview').addEventListener('click',event=>{if(event.target.closest('button[data-action="closeOverview"]'))closeOverview();});window.addEventListener('keydown',event=>{if(event.key==='Escape'&&overviewOpen)closeOverview();});
 $('tray').addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const type=b.dataset.action;if(type==='reset'){restart();return;}if(type==='overview'){showOverview();return;}dispatch({type,id:b.dataset.id,choice:b.dataset.choice,price:Number(b.dataset.price),quantity:Number(b.dataset.quantity),delta:Number(b.dataset.delta),task:b.dataset.task,kind:b.dataset.kind,scale:Number(b.dataset.scale)});});
 $('tray').addEventListener('change',event=>{if(['batch-quantity','restock-quantity'].includes(event.target.id)){const q=Number(event.target.value);if(!C.validQuantity(q)){notify('Escolha de 100 a 10.000 unidades inteiras.');signature='';render();return;}dispatch({type:event.target.id==='batch-quantity'?'batch':'restockSize',quantity:q});}});
 $('tray').addEventListener('input',event=>{if(event.target.id==='upgrade-name'){try{const next=C.act(g,{type:'upgradeName',name:event.target.value});persist(next);g=next;}catch(e){fail(e);}return;}if(event.target.id==='margin'){try{const next=C.act(g,{type:'margin',margin:Number(event.target.value)});persist(next);g=next;$('margin-value').textContent=g.margin+'%';$('calculated-price').textContent=money(g.price);$('gross-value').textContent=money(C.contribution(g).amount);$('pricing-acquisition').innerHTML=forecastMarkup(g);}catch(e){fail(e);}return;}if(event.target.id!=='product-name')return;try{const next=C.act(g,{type:'name',name:event.target.value});persist(next);g=next;}catch(e){fail(e);}});
 $('pause').addEventListener('click',()=>dispatch({type:'pause'}));$('speed').addEventListener('click',()=>dispatch({type:'speed'}));$('sound').addEventListener('click',()=>{sound=!sound;if(sound)tone('good');render();});
 canvas.addEventListener('click',event=>{if(g.phase!=='customer')return;const box=canvas.getBoundingClientRect(),x=(event.clientX-box.left-transform.x)/transform.scale,y=(event.clientY-box.top-transform.y)/transform.scale;const i=C.personas(g).slice(personaPage*3,personaPage*3+3).findIndex((_,i)=>Math.abs(x-(120+i*83))<35&&Math.abs(y-(390+i%2*20))<65);if(i>=0)dispatch({type:'customer',id:C.personas(g)[personaPage*3+i].id});});
 function resize(){const box=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);transform.scale=Math.min(box.width/PilotWorld.width,box.height/PilotWorld.height);transform.x=(box.width-PilotWorld.width*transform.scale)/2;transform.y=(box.height-PilotWorld.height*transform.scale)/2;transform.dpr=dpr;}
 window.addEventListener('resize',resize);
 function frame(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;t+=g.paused||blocked?0:dt;visual.saleFlash=Math.max(0,visual.saleFlash-dt);visual.reviewFlash=Math.max(0,(visual.reviewFlash||0)-dt);if(rolling){rolling.elapsed+=dt;if(rolling.elapsed>=rolling.duration){const r=rollResult(rolling.kind);rolling=null;signature='';tone(['great','exceptional'].includes(r.grade)?'great':['partial','critical'].includes(r.grade)?'bad':'good');render();}else{const el=$('die-value');if(el)el.textContent=1+Math.floor(rolling.elapsed*31)%20;}}
  if(!blocked&&!rolling){const before=g,next=C.tick(g,dt),critical=next.phase!==g.phase||next.sales?.seen!==g.sales?.seen||next.sold!==g.sold||next.reviews?.length!==g.reviews?.length||next.stock!==g.stock||next.legacyRevenue!==g.legacyRevenue||!!next.crew!==!!g.crew;try{saveTimer+=dt;if(critical||saveTimer>1){persist(next);saveTimer=0;}if((next.reviews?.length||0)>(g.reviews?.length||0)){const rv=next.reviews.at(-1);visual.reviewStars=rv.stars;visual.reviewFlash=4;notify('Nova avaliação: '+'★'.repeat(rv.stars)+' · '+rv.feedback);tone(rv.stars>=4?'great':'good');}g=next;if(critical){signature='';render();}}catch(e){g=before;fail(e);}}
  if(g.lastEvent&&g.lastEvent.id!==lastEventId){lastEventId=g.lastEvent.id;if(g.lastEvent.kind==='sale'){visual.saleFlash=1;visual.saleValue=C.netPrice(g);tone('sale');}if(g.phase==='recap'&&g.summary?.profit>0)tone('great');}
  const displayed=rolling?{...g,phase:rolling.kind==='test'?'testing':rolling.kind==='rollUpgrade'?'upgradeTesting':'campaignRolling',...(rolling.kind==='test'?{quality:0,polish:false}:{})}:{...g,personaPage};PilotWorld.actors(displayed,visual,g.paused||blocked?0:dt);ctx.setTransform(transform.dpr*transform.scale,0,0,transform.dpr*transform.scale,transform.x*transform.dpr,transform.y*transform.dpr);ctx.clearRect(-transform.x/transform.scale,-transform.y/transform.scale,canvas.width,canvas.height);PilotWorld.render(ctx,displayed,t,visual);updateLive();requestAnimationFrame(frame);
 }
 lastEventId=g.lastEvent?.id;resize();render();if(loadError)fail(loadError);requestAnimationFrame(frame);
})();
