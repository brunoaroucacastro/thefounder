/* Campaign simulation. Receives the shared D20 roller; never owns a RNG. */
const CampaignRules=(()=>{
 const names=['Busca paga','Conteúdo & SEO','Redes sociais'],keys=['ads','seo','social'];
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
 const physical=['dnvb','wearables','electric-mobility','gadgets','fashion','consumables','beauty','pet','home-garden'];
 function ensure(s){s.campaigns??=s.budgets.map(()=>({efficiency:1,blockedMonth:null,reached:0,activeMonths:0,last:null}));s.audienceExposure??=[0,0,0,0];s.team.forEach(p=>{if(p.role==='Marketing')p.specialty??='ads';});return s;}
 function affinity(s){return physical.includes(s.marketId)?[1,.8,1.4]:[1.15,1.4,.8];}
 function audience(s,models){const m=models?.[s.business],target=s.target||0;return Math.max(0,Math.floor(m?m[4]*m[5][target]/100:100000));}
 function saturation(s,models){const size=audience(s,models);return size?clamp(s.audienceExposure[s.target||0]/size,0,1):1;}
 function blocked(s,i){return s.campaigns[i].blockedMonth===s.month+1;}
 function adjustment(s,a){const i=a.channel??a.index,old=s.budgets[i],mode=a.type==='budget'?(a.value>old?'scale':'reduce'):a.mode;return {i,old,mode,value:mode==='optimize'?old:a.value};}
 function validate(s,a,touched){ensure(s);const {i,old,mode,value}=adjustment(s,a);if(![0,1,2].includes(i)||!['scale','reduce','optimize'].includes(mode))throw Error('Campanha inválida.');if(touched?.has(i))throw Error('Escolha um ajuste por canal neste mês. Remova o anterior para substituir.');if(!Number.isInteger(value)||value<0||value>1000000)throw Error('Use um orçamento mensal inteiro entre R$ 0 e R$ 1 milhão.');if(mode==='scale'&&value<=old)throw Error('Escalar exige uma verba maior.');if(mode==='reduce'&&value>=old)throw Error('Reduzir exige uma verba menor.');if(mode==='optimize'&&old<=0)throw Error('Ative o canal antes de otimizar.');if(blocked(s,i)&&mode!=='reduce')throw Error('Canal bloqueado neste mês. Você ainda pode reduzir ou pausar a verba.');return {i,old,mode,value};}
 function modifiers(s,a,models){const {i,old,mode,value}=adjustment(s,a),mods=[];const specialist=Math.max(0,...s.team.filter(p=>p.role==='Marketing'&&p.specialty===keys[i]).map(p=>p.level));if(specialist)mods.push({label:'Especialista em '+names[i],value:Math.min(4,specialist)});const fit=affinity(s)[i];mods.push({label:'Afinidade do canal',value:fit>=1.3?2:fit<1?-2:0});const sat=Math.floor(saturation(s,models)*5);if(sat)mods.push({label:'Saturação do público',value:-sat});const growth=mode==='scale'?value/Math.max(500,old)-1:0,penalty=Math.min(8,Math.ceil(Math.max(0,growth-.25)*2));if(penalty)mods.push({label:'Escala agressiva',value:-penalty});return mods;}
 function apply(s,a,{preview=false,models,roll,touched}={}){
  const {i,old,mode,value}=validate(s,a,touched);touched?.add(i);const campaign=s.campaigns[i],before=campaign.efficiency;
  if(preview){s.budgets[i]=value;return {status:'planned',channel:i,mode,budget:value};}
  // Reducing financial exposure is guaranteed; the die affects remaining efficiency.
  if(blocked(s,i)){s.budgets[i]=value;return {status:'executed',channel:i,mode,budget:value,note:'Verba reduzida durante bloqueio; sem sorteio.'};}
  const die=roll(s,{label:mode+' · '+names[i],modifiers:modifiers(s,a,models),difficulty:11});
  let delta=die.critical?-.30:die.total<=10?-Math.min(.30,(11-die.total)*.03):Math.min(.30,(die.total-10)*.03);
  campaign.efficiency=clamp(before+delta,.35,2);
  if(die.critical){campaign.blockedMonth=s.month+2;s.budgets[i]=mode==='reduce'?value:old;}else s.budgets[i]=value;
  return {status:die.critical?'critical':die.outcome,channel:i,mode,budget:s.budgets[i],efficiencyBefore:before,efficiencyAfter:campaign.efficiency,die,note:die.critical?'Falha crítica: ajuste cancelado (reduções mantidas); canal bloqueado no próximo mês.':'Eficiência '+Math.round(before*100)+'% → '+Math.round(campaign.efficiency*100)+'%'};
 }
 function forecast(s){ensure(s);return s.budgets.reduce((n,b,i)=>n+(blocked(s,i)?0:b),0);}
 function acquire(s,{models,conversion}){
  ensure(s);const size=audience(s,models),target=s.target||0,seen=clamp(s.audienceExposure[target],0,size),remaining=Math.max(0,size-seen),fits=affinity(s);
  const rows=s.campaigns.map((c,i)=>{const spend=blocked(s,i)?0:s.budgets[i],maturity=i===1?1+Math.min(12,c.activeMonths)*.03:1;const potential=Math.floor(spend*2/Math.pow(1+spend/2000,.55)*c.efficiency*fits[i]*maturity);return {channel:i,name:names[i],spend,blocked:blocked(s,i),potential,efficiency:c.efficiency,affinity:fits[i]};});
  // One shared audience pool per persona. Allocate once across all paid channels
  // and organic traffic, rather than granting each channel its own full market.
  const organic=200,total=rows.reduce((n,r)=>n+r.potential,organic),unique=Math.min(remaining,total),scale=total?unique/total:0;
  let assigned=0;rows.forEach(r=>{r.reach=Math.floor(r.potential*scale);assigned+=r.reach;});
  const organicReach=unique-assigned;
  rows.forEach(r=>{r.leads=Math.floor(r.reach*.10);r.newCustomers=s.launched?Math.floor(r.leads*conversion):0;r.attributedRevenue=r.newCustomers*s.price;r.roas=r.spend>0?r.attributedRevenue/r.spend:null;const c=s.campaigns[r.channel];c.reached+=r.reach;if(r.spend>0)c.activeMonths++;c.last={...r,month:s.month+1};});
  const organicLeads=Math.floor(organicReach*.10),organicCustomers=s.launched?Math.floor(organicLeads*conversion):0;
  s.audienceExposure[target]=seen+unique;
  const spend=rows.reduce((n,r)=>n+r.spend,0),attributedRevenue=rows.reduce((n,r)=>n+r.attributedRevenue,0);
  return {channels:rows,reach:unique,leads:rows.reduce((n,r)=>n+r.leads,organicLeads),newCustomers:rows.reduce((n,r)=>n+r.newCustomers,organicCustomers),organicCustomers,spend,attributedRevenue,roas:spend?attributedRevenue/spend:null,audience:size,seen:s.audienceExposure[target],saturation:size?s.audienceExposure[target]/size:1};
 }
 return {names,keys,ensure,affinity,audience,saturation,blocked,adjustment,validate,modifiers,apply,forecast,acquire};
})();
if(typeof module!=='undefined')module.exports=CampaignRules;

</script><script>
/* Pure domain rules: no DOM, globals, localStorage or callbacks in the plan. */
const GameRules=(()=>{
 const campaigns=typeof CampaignRules!=='undefined'?CampaignRules:require('./campaign-rules.js');
 const copy=x=>JSON.parse(JSON.stringify(x)),limit=(x,a,b)=>Math.max(a,Math.min(b,x));
 const staff=[{name:'Lia',role:'Produto',salary:4500,color:'#be8066'},{name:'Caio',role:'Marketing',salary:3500,color:'#809ec1'},{name:'Nina',role:'Suporte',salary:2800,color:'#beac5e'}];
 const labels={develop:'Desenvolver produto',launch:'Lançar produto',research:'Ouvir clientes',price:'Ajustar preço',campaign:'Ajustar campanha',budget:'Orçamento de marketing',hire:'Contratar',promote:'Promover',fire:'Desligar',meeting:'Reunião da equipe',loan:'Captar R$ 20 mil',repay:'Amortizar dívida',target:'Escolher público'};
 function migrate(input,seed=Date.now()){
  const s=copy(input);if(s.schemaVersion>3)throw Error('Save de uma versão mais nova. Abra-o na versão correspondente.');
  if(!s.schemaVersion||s.schemaVersion<2){s.legacyUsed=limit(4-(s.actions??4),0,4);s.plan=[];s.planRevision=0;s.nextId=1;s.schemaVersion=2;}
  s.plan??=[];s.planRevision??=0;s.nextId??=1;s.legacyUsed??=0;s.rolls??=[];s.rng??=(seed>>>0)||123456789;s.companyId??='company-'+s.rng;
  s.marketId??=['dnvb','wearables','electric-mobility','saas','games','ai-app','health-network','charging','shared-mobility','fintech','marketplace','edtech'][s.business]||'legacy-default';
  campaigns.ensure(s);s.schemaVersion=3;
  s.team.forEach(p=>{if(!p.id)p.id='person-'+s.nextId++;});return s;
 }
 function rollD20(state,{label='D20',modifiers=[],difficulty=11}={},random){
  let u;if(random){u=random();}else{let x=state.rng>>>0;x^=x<<13;x^=x>>>17;x^=x<<5;state.rng=x>>>0;u=state.rng/4294967296;}
  if(!(u>=0&&u<1))throw Error('Sorteio inválido');
  const natural=1+Math.floor(u*20),mods=modifiers.map(m=>({label:String(m.label),value:Number(m.value)}));
  if(mods.some(m=>!Number.isFinite(m.value)))throw Error('Modificador inválido');
  const total=natural+mods.reduce((a,m)=>a+m.value,0),critical=natural===1;
  const r={label,natural,modifiers:mods,total,difficulty,critical,outcome:critical?'critical':total>=difficulty?'success':'failure',month:state.month};state.rolls.push(r);state.rolls=state.rolls.slice(-100);return r;
 }
 function cost(s,a,meta){switch(a.type){case'campaign':return a.mode==='optimize'?500:0;case'develop':return 3000;case'research':return 500;case'hire':return meta.skills.includes('people')?600:1200;case'fire':return s.team.find(p=>p.id===a.personId)?.salary??0;case'repay':return Math.min(10000,s.debt);default:return 0;}}
 function apply(s,a,meta,context={}){
  if(!labels[a.type])throw Error('Ação desconhecida');
  const p=s.team.find(p=>p.id===a.personId);let n;
  if(['promote','fire'].includes(a.type)&&!p)throw Error('Pessoa não está na equipe nesta etapa.');
  if(a.type==='develop'&&s.quality>=100)throw Error('Qualidade já chegou ao máximo.');
  if(a.type==='launch'&&(s.launched||s.dev<2))throw Error('Lançar exige duas entregas anteriores e produto ainda não lançado.');
  if(a.type==='hire'&&(!staff[a.index]||s.team.length>=12))throw Error('Contratação indisponível.');
  if(a.type==='loan'&&s.debt>=60000)throw Error('Limite de crédito atingido.');
  if(a.type==='repay'&&s.debt<=0)throw Error('Não há dívida para amortizar.');
  if(a.type==='price'&&(!Number.isFinite(a.value)||a.value<29||a.value>249))throw Error('Preço inválido.');
  if(['budget','campaign'].includes(a.type))campaigns.validate(s,a,context.touched);
  if(a.type==='target'&&![0,1,2,3].includes(a.value))throw Error('Público inválido.');
  const paid=cost(s,a,meta);if(s.cash<paid)throw Error('Caixa insuficiente nesta etapa. Reordene ou remova ações.');s.cash-=paid;
  switch(a.type){
   case'develop':s.dev++;s.quality=limit(s.quality+Math.round((10+s.team.filter(p=>p.role==='Produto').reduce((v,p)=>v+p.level,0)*5)*s.motivation/100)+(meta.skills.includes('product')?3:0),0,100);s.motivation=limit(s.motivation-2,0,100);break;
   case'launch':s.launched=true;break;
   case'research':s.research++;s.quality=limit(s.quality+3,0,100);if(!meta.knowledge.includes('b2b'))meta.knowledge.push('b2b');break;
   case'price':s.price=a.value;break;
   case'budget':case'campaign':{const effect=campaigns.apply(s,a,{...context,roll:(state,options)=>rollD20(state,options,context.random)});return {id:a.id,type:a.type,label:describe(a),cost:paid,...effect};}
   case'target':s.target=a.value;break;
   case'hire':s.team.push({...staff[a.index],id:'hire-'+a.id,level:1,...(a.index===1?{specialty:['ads','seo','social'].includes(a.specialty)?a.specialty:'ads'}:{})});break;
   case'promote':p.salary=Math.round(p.salary*1.2);p.level++;s.motivation=limit(s.motivation+12,0,100);break;
   case'fire':s.team=s.team.filter(x=>x.id!==a.personId);s.motivation=limit(s.motivation-8,0,100);break;
   case'meeting':s.motivation=limit(s.motivation+14,0,100);break;
   case'loan':s.debt+=20000;s.cash+=20000;break;
   case'repay':s.debt-=paid;break;
  }
  return {id:a.id,type:a.type,label:describe(a),cost:paid,status:'executed'};
 }
 function describe(a){let label=labels[a.type]||a.type;if(a.type==='campaign')label+=' · '+({scale:'Escalar',reduce:'Reduzir',optimize:'Otimizar'}[a.mode]||'')+' · '+campaigns.names[a.channel]+(a.mode==='optimize'?'':' · R$ '+a.value+'/mês');if(a.type==='budget')label+=' · '+['Busca','SEO','Redes'][a.index]+' · R$ '+a.value+'/mês';if(a.type==='price')label+=' · R$ '+a.value;if(a.type==='hire')label+=' · '+(staff[a.index]?.name||'');if(a.personName)label+=' · '+a.personName;if(a.type==='target')label+=' · '+['18–24','25–34','35–54','55+'][a.value];return label;}
 function project(input,meta){let state=migrate(input),m=copy(meta),entries=[],errors=[],touched=new Set();
  if(state.plan.length>4-state.legacyUsed)errors.push({index:-1,message:'Máximo de quatro ações por mês.'});
  state.plan.forEach((a,index)=>{try{entries.push(apply(state,a,m,{preview:true,touched}));}catch(e){errors.push({index,message:e.message});entries.push({id:a.id,label:describe(a),status:'invalid',cost:0});}});
  const expenses=2000+state.team.reduce((n,p)=>n+p.salary,0)+campaigns.forecast(state)+state.debt*.025;
  const friendsDue=state.capital===1&&state.month+1>6?Math.min(1750,state.friendsDebt||0):0;
  return {state,meta:m,entries,errors,cost:entries.reduce((n,e)=>n+e.cost,0),expenses,friendsDue,reserve:state.cash-expenses-friendsDue};
 }
 function enqueue(input,meta,action){let s=migrate(input);if(s.ended)throw Error('Esta jornada terminou.');if(s.plan.length>=4-s.legacyUsed)throw Error('Agenda cheia. Remova uma ação para substituir.');const a={...action,id:s.companyId+'-'+s.nextId++};s.plan.push(a);const p=project(s,meta);if(p.errors.length)throw Error(p.errors.at(-1).message);s.planRevision++;return s;}
 function edit(input,index,direction){let s=migrate(input);if(index<0||index>=s.plan.length)return s;if(direction===0)s.plan.splice(index,1);else{let j=index+direction;if(j<0||j>=s.plan.length)return s;[s.plan[index],s.plan[j]]=[s.plan[j],s.plan[index]];}s.planRevision++;return s;}
 function token(s){return s.companyId+':'+s.month+':'+s.planRevision;}
 function resolve(input,meta,expected,context={}){
  let s=migrate(input);if(s.ended||token(s)!==expected)throw Error('Revisão expirou. Revise a agenda novamente.');const preview=project(s,meta);if(preview.errors.length)throw Error('Corrija a ordem ou remova as ações marcadas.');

function titleScreen(){shell(`<div class="title-screen"><small>UM SIMULADOR DE RECOMEÇOS</small><h1>the<br><em>founder.</em></h1>${avatar()}<p>Uma ideia. Uma chance. Seu próximo começo.</p><button class="primary" onclick="step=0;creator()">▶ NOVA JORNADA</button>${s.founder||s.month>0?'<button onclick="document.getElementById(\'creation\').remove();render()">CONTINUAR</button>':''}<small>PROTÓTIPO 0.6 · PIXEL OFFICE</small></div>`);}
function chips(key,colors){return colors.map(col=>`<button aria-label="${key} ${col}" class="swatch ${draft[key]===col?'selected':''}" style="background:${col}" onclick="draft.${key}='${col}';creator()"></button>`).join('');}
function bars(vals,labels){return vals.map((v,i)=>`<div class="aud-row"><span>${labels[i]}</span><div><i style="width:${v}%;background:${['#f4ba69','#9bcda1','#b99edb','#e895a5'][i%4]}"></i></div><b>${v}%</b></div>`).join('');}
function creator(){let m=models[draft.model];shell(`<div class="creator"><div class="creator-head"><button onclick="titleScreen()">← Início</button><span>${['FOUNDER','EMPRESA','CAPITAL'].map((x,i)=>`<b class="${step===i?'current':''}">${i+1} ${x}</b>`).join('')}</span></div><div class="creation-grid"><aside class="portrait">${avatar()}<h2>${esc(draft.name)}</h2><p>${profiles[draft.profile]}</p><div class="sign">${esc(draft.company)}</div></aside><section class="choices">${step===0?`<h1>Quem vai começar essa história?</h1><label>Nome do founder<input maxlength="24" value="${esc(draft.name)}" oninput="draft.name=this.value"></label><div class="palette"><label>Cabelo</label>${chips('hair',['#593e50','#edb657','#a65335','#dbd6d8','#393447'])}</div><div class="palette"><label>Roupa</label>${chips('shirt',['#eb895a','#6ba8bb','#a48bd3','#83b47b','#e583a3'])}</div><div class="palette"><label>Pele</label>${chips('skin',['#f2bd8b','#d5956b','#a96d4d','#744b3f'])}</div><h3>Seu jeito de empreender</h3><div class="pick-grid">${profiles.map((p,i)=>`<button class="${draft.profile===i?'selected':''}" onclick="draft.profile=${i};creator()">${['⚡','✦','▥','★','⚒','⚙','∞','☀','◆','♥'][i]} ${p}</button>`).join('')}</div>${profileInfo()}`:step===1?`<h1>O que vamos construir?</h1><label>Nome da empresa<input maxlength="28" value="${esc(draft.company)}" oninput="draft.company=this.value"></label><div class="pick-grid">${['produto','serviço'].map(t=>`<button class="${m[2]===t?'selected':''}" onclick="draft.model=${t==='produto'?0:6};creator()">${t==='produto'?'📦 PRODUTO':'🤝 SERVIÇO'}</button>`).join('')}</div>${[m[2]==='produto'?'físico':'presencial','digital'].map(k=>`<h3>${k.toUpperCase()}</h3><div class="pick-grid models">${models.map((x,i)=>x[2]===m[2]&&x[3]===k?`<button class="${draft.model===i?'selected':''}" onclick="draft.model=${i};creator()"><strong>${x[0]}</strong>${x[1]}</button>`:'').join('')}</div>`).join('')}<div class="selection-info"><h3>${m[0]} ${m[1]}</h3><p>${modelDescriptions[draft.model]}</p></div>${audienceInfo(m)}`:`<h1>Como financiar o começo?</h1><div class="capital-grid">${capitals.map((x,i)=>`<button class="${draft.capital===i?'selected':''}" onclick="draft.capital=${i};creator()"><strong>${x[0]} ${x[1]}</strong><b>${money(x[2])}</b><small>${x[3]}</small></button>`).join('')}</div><div class="audience"><h3>${models[draft.model][0]} ${esc(draft.company)} · ${models[draft.model][1]}</h3><p>${draft.capital===1?'Devolução: R$ 1.750/mês, do mês 7 ao 26. Atrasos reduzem confiança.':draft.capital===3?'Investidores avaliam crescimento de receita a cada trimestre. Relacionamento começa em 80/100.':draft.capital===2?'Juros iniciais: R$ 1.875/mês. Amortização pelo caderno financeiro.':'Pouco caixa. Toda decisão conta.'}</p></div>`}<div class="creator-next">${step>0?'<button onclick="step--;creator()">← Voltar</button>':''}<button class="primary" onclick="creationNext()">${step===2?'FUNDAR EMPRESA ▶':'Continuar →'}</button></div></section></div></div>`);}
function creationNext(){if(!draft.name.trim()||!draft.company.trim())return toast('Dê um nome ao founder e à empresa.');if(step<2){step++;creator();return;}if(!s.ended&&(s.month>0||s.founder)){modal('<h2>Começar outra jornada?</h2><p>O save desta empresa será substituído. Seus aprendizados anteriores continuam.</p><button onclick="foundCompany()">Começar</button> <button onclick="closeModal()">Voltar</button>');return;}foundCompany();}
function foundCompany(){closeModal();s=fresh(draft.company.trim());s.founder={...draft};s.business=draft.model;s.capital=draft.capital;s.cash=capitals[draft.capital][2];s.debt=draft.capital===2?s.cash:0;s.friendsDebt=draft.capital===1?s.cash:0;s.trust=80;s.equity=draft.capital===3?.85:1;s.target=0;s.actions=4;tab=0;save();$('creation').remove();render();}
newCompany=function(){step=0;creator();};
const baseProduct=product;
product=function(){let m=models[s.business??3];return baseProduct().replace('PRODUTO 01 · SOFTWARE B2B',`${m[2].toUpperCase()} · ${m[1].toUpperCase()}`).replace('Flow — menos planilhas, mais tempo.',`${m[0]} Sua primeira oferta`).replace('Uma plataforma de gestão para pequenas empresas. Seu público valoriza facilidade, confiabilidade e um preço justo.','Desenvolva sua oferta, encontre seu público e ajuste o preço.').replace('ASSINATURA MENSAL','PREÇO POR CLIENTE / MÊS')+`<section class="panel"><h3>◎ Público-alvo · ${m[4].toLocaleString('pt-BR')} potenciais</h3><div class="pick-grid">${(m[7]||['18–24','25–34','35–54','55+']).map((v,i)=>`<button class="${(s.target||0)===i?'selected':''}" onclick="queueAction('target',{value:${i}})">${v} · ${m[5][i]}%</button>`).join('')}</div>${audienceInfo(m)}<p class="muted">O segmento escolhido altera aquisição. Renda afeta tolerância ao preço. A demo usa uma operação mensal simplificada para todos os modelos.</p></section>`;};
function marketFactor(){if(s.business===undefined)return 1;let m=models[s.business],share=m[5][s.target||0]/100;return Math.min(2,Math.sqrt(m[4]*share/25000))*Math.max(.1,1-s.customers/Math.max(1,m[4]*share));}
function buyingPower(){if(s.business===undefined)return 1;let a=models[s.business][6];return (a[0]*1.6+a[1]+a[2]*.65)/100;}
const baseFinance=finance;
finance=function(){return baseFinance()+`<section class="panel"><h3>Capital: ${capitals[s.capital||0][1]}</h3><p>Sua participação: ${Math.round((s.equity??1)*100)}%${s.friendsDebt?' · Saldo com amigos: '+money(s.friendsDebt):''}${s.capital===1||s.capital===3?' · Confiança: '+s.trust+'/100':''}</p></section>`;};
titleScreen();

</script><script>
/* UI adapter. The agenda and monthly rules live in rules.js. */
let reviewToken=null,resolvingMonth=false;
let expectedSave=localStorage.getItem(KEY);
save=function(){try{if(s.schemaVersion>3)throw Error('Save de versão mais nova.');if(localStorage.getItem(KEY)!==expectedSave)throw Error('O save mudou em outra aba. Reabra o jogo antes de continuar.');const data=JSON.stringify({s,meta});localStorage.setItem(KEY,data);expectedSave=data;return true;}catch(e){toast('Não foi possível salvar: '+e.message);return false;}};
function phaseState(){s=GameRules.migrate(s);return s;}
function plannedState(){return GameRules.project(phaseState(),meta).state;}
function roasText(value){return value===null||value===undefined?'—':value.toFixed(2)+'×';}
function campaignAction(channel,mode){const state=plannedState(),value=mode==='optimize'?state.budgets[channel]:Number($('campaignBudget'+channel).value);queueAction('campaign',{channel,mode,value});}
function setCampaignBudget(channel,value){$('campaignBudget'+channel).value=value;campaignRisk(channel);}
function campaignRisk(channel){const current=s.budgets[channel],value=Number($('campaignBudget'+channel).value),mod=GameRules.campaigns.modifiers(s,{type:'campaign',channel,mode:value>current?'scale':'reduce',value},models).find(m=>m.label==='Escala agressiva');$('campaignRisk'+channel).textContent=value<current?'Redução de verba garantida. A eficiência ainda depende do dado.':mod?'⚠ Escala agressiva: '+mod.value+' no D20.':'Escala gradual: sem penalidade por crescimento.';}
function renderMarketingPanel(){
 const real=phaseState(),projected=GameRules.project(real,meta).state,C=GameRules.campaigns,last=real.lastMonthReport?.acquisition,fit=C.affinity(real),size=C.audience(real,models),sat=C.saturation(real,models);
 return `<div class="campaign-summary"><div><small>PÚBLICO EXPLORADO · PERSONA ATUAL</small><b>${Math.min(real.audienceExposure[real.target||0],size).toLocaleString('pt-BR')} / ${size.toLocaleString('pt-BR')}</b><div class="bar"><i style="width:${sat*100}%"></i></div></div><div><small>ROAS DO ÚLTIMO MÊS</small><b>${roasText(last?.roas)}</b></div><div><small>COMPROMISSO MENSAL PREVISTO</small><b>${money(C.forecast(projected))}/mês</b></div></div><div class="campaign-funnel"><span>◎ ${last?.reach||0}<small>ALCANÇADOS</small></span><b>→</b><span>◇ ${last?.leads||0}<small>INTERESSADOS</small></span><b>→</b><span>♙ ${last?.newCustomers||0}<small>NOVOS CLIENTES</small></span></div><div class="campaign-grid">${real.campaigns.map((c,i)=>{const isBlocked=C.blocked(real,i),scheduled=real.plan.some(a=>(a.type==='campaign'&&(a.channel===i))||(a.type==='budget'&&a.index===i)),row=last?.channels[i],budget=projected.budgets[i],bonus=C.modifiers(real,{type:'campaign',channel:i,mode:'optimize'},models),lastChange=real.lastMonthReport?.entries.find(e=>e.channel===i&&e.die);return `<section class="panel campaign-card"><div class="panel-head"><h2>${['⌕','✎','◎'][i]} ${C.names[i]}</h2><span class="badge">${fit[i]>=1.3?'★★★ Afinidade alta':fit[i]>=1?'★★ Afinidade média':'★ Afinidade baixa'}</span></div><div class="campaign-eff"><b>${Math.round(c.efficiency*100)}%</b><small>EFICIÊNCIA</small></div><div class="bar"><i style="width:${c.efficiency/2*100}%"></i></div>${isBlocked?'<div class="campaign-warning">🔒 Bloqueado neste mês · gasto R$ 0<br><small>Volta automaticamente no próximo. Você pode reduzir ou pausar.</small></div>':''}<div class="row"><span>Verba atual</span><b>${money(real.budgets[i])}/mês</b></div><label class="campaign-label" for="campaignBudget${i}">Planejar verba mensal</label><input id="campaignBudget${i}" type="number" min="0" max="1000000" step="1" value="${budget}" aria-label="Verba mensal ${C.names[i]}" oninput="campaignRisk(${i})"><div class="budget-presets"><button onclick="setCampaignBudget(${i},${Math.round(budget*.75)})">−25%</button><button onclick="setCampaignBudget(${i},${budget===0?500:Math.round(budget*1.25)})">+25%</button><button onclick="setCampaignBudget(${i},0)">Pausar</button></div><p id="campaignRisk${i}" class="campaign-hint">Saltos acima de 25% penalizam o D20.</p><div class="actions"><button onclick="campaignAction(${i},'reduce')" ${scheduled?'disabled':''}>↘ Reduzir</button><button onclick="campaignAction(${i},'scale')" ${scheduled||isBlocked?'disabled':''}>↗ Escalar</button></div><button class="optimize-button" onclick="campaignAction(${i},'optimize')" ${scheduled||isBlocked||budget<=0?'disabled':''}>⚒ Otimizar · R$ 500</button><small class="campaign-hint">${scheduled?'✓ Ajuste na agenda. Revise para remover ou substituir.':'Cada ajuste usa 1 ação. A verba é cobrada todo mês.'}</small><div class="campaign-kpis"><div><small>GASTO</small><b>${row?money(row.spend):'—'}</b></div><div><small>RECEITA ATRIBUÍDA</small><b>${row?money(row.attributedRevenue):'—'}</b></div><div><small>ROAS</small><b>${roasText(row?.roas)}</b></div></div><details><summary>⚄ Riscos e modificadores</summary><p>1 natural: ajuste falha e o próximo mês fica bloqueado. Redução de verba é mantida.</p><p>Total até 10: eficiência cai. De 11 em diante: melhora. Saltos acima de 25% penalizam a rolagem.</p>${bonus.map(m=>`<div class="row"><span>${esc(m.label)}</span><b>${m.value>=0?'+':''}${m.value}</b></div>`).join('')}<small>O melhor especialista do canal ajuda em até +4. Maior saturação prejudica o dado e reduz novos alcançados.</small>${lastChange?`<p>Último ajuste: dado ${lastChange.die.natural} → total ${lastChange.die.total}. ${esc(lastChange.note)}</p>`:''}</details></section>`;}).join('')}</div><p class="muted">ROAS = receita inicial dos clientes atribuídos ao canal ÷ gasto no canal. Clientes antigos e vendas orgânicas ficam de fora. ROAS não é lucro. Ao atingir todo o público, mais verba não gera novos alcançados.</p>`;
}
function chooseMarketingSpecialty(){modal(`<small>CONTRATAÇÃO · MARKETING</small><h2>Qual especialidade?</h2><div class="specialty-options">${GameRules.campaigns.names.map((name,i)=>`<button onclick="closeModal();queueAction('hire',{index:1,specialty:'${GameRules.campaigns.keys[i]}'})">${['⌕','✎','◎'][i]} ${name}</button>`).join('')}</div><p>Mesmo salário. O bônus D20 ajuda só no canal escolhido.</p><button onclick="closeModal()">Voltar</button>`);}
hire=function(index,specialty){if(index!==1||specialty)queueAction('hire',{index,specialty});else chooseMarketingSpecialty();};
function queueAction(type,params={}){const before=s;try{s=GameRules.enqueue(phaseState(),meta,{type,...params});if(!save()){s=before;return;}render();toast('＋ Na agenda · nada executado ainda');}catch(e){toast(e.message);} }
function editPlan(index,direction){const before=s;s=GameRules.edit(phaseState(),index,direction);reviewToken=null;if(!save()){s=before;return;}render();if($('modal').open)reviewMonth();}
function agendaMarkup(){const state=phaseState();return `<div class="agenda-dock"><div class="agenda-title"><b>▦ AGENDA DO MÊS</b><span>${state.plan.length+state.legacyUsed}/4</span><button onclick="reviewMonth()">Revisar →</button></div><div class="agenda-slots">${Array.from({length:4},(_,i)=>i<state.legacyUsed?'<div class="agenda-slot used">✓ Já realizada</div>':state.plan[i-state.legacyUsed]?`<button class="agenda-slot filled" onclick="reviewMonth()">${i+1}. ${esc(GameRules.describe(state.plan[i-state.legacyUsed]))}</button>`:`<div class="agenda-slot empty">${i+1} · Livre</div>`).join('')}</div></div>`;}
function reviewMonth(){if(s.ended)return;const p=GameRules.project(phaseState(),meta);reviewToken=GameRules.token(s);modal(`<small>PLANEJE → REVISE → APROVE</small><h2>Seu próximo mês</h2><p>${s.plan.length} ação(ões) planejada(s). A ordem abaixo será respeitada.</p><div class="plan-list">${s.plan.map((a,i)=>`<div class="plan-item ${p.errors.some(e=>e.index===i)?'invalid':''}"><b>${i+1}</b><div>${esc(GameRules.describe(a))}<small>${money(p.entries[i]?.cost||0)} · ${p.errors.find(e=>e.index===i)?esc(p.errors.find(e=>e.index===i).message):(['campaign','budget'].includes(a.type)?'⚄ D20 ao executar · resultado incerto':'Pronta para executar')}</small></div><button aria-label="Subir ação ${i+1}" onclick="editPlan(${i},-1)" ${i===0?'disabled':''}>↑</button><button aria-label="Descer ação ${i+1}" onclick="editPlan(${i},1)" ${i===s.plan.length-1?'disabled':''}>↓</button><button aria-label="Remover ação ${i+1}" onclick="editPlan(${i},0)">✕</button></div>`).join('')||'<div class="plan-item">☕ Mês sem ações. Os custos mensais continuam.</div>'}</div><div class="plan-money"><div>Caixa hoje <b>${money(s.cash)}</b></div><div>Custo das ações <b>−${money(p.cost)}</b></div><div>Compromissos mensais¹ <b>−${money(p.expenses+p.friendsDue)}</b></div><div>Reserva antes de vendas <b class="${p.reserve<0?'negative':''}">${money(p.reserve)}</b></div></div><small>¹ Folha, aluguel, marketing/mês, juros e parcela prevista aos amigos. Custos variáveis e eventos dependem do fechamento.</small>${p.reserve<0?'<p class="negative">⚠ Os compromissos superam sua reserva. Você dependerá das vendas para fechar o mês.</p>':''}<div class="actions"><button onclick="reviewToken=null;closeModal()">← Continuar planejando</button><button class="primary" onclick="approveMonth()" ${p.errors.length?'disabled':''}>Aprovar e executar mês ▶</button></div>`);}
function showMonthReport(){const h=s.lastMonthReport;if(!h)return toast('Ainda não há fechamento.');modal(`<small>FECHAMENTO · MÊS ${h.month}</small><h2>${h.profit>=0?'Mais um passo.':'Hora de ajustar a rota.'}</h2><div class="plan-results">${h.entries.map(e=>`<div class="plan-item">${e.status==='critical'?'✕':e.status==='failure'?'⚠':'✓'} <div>${esc(e.label)}<small>${e.status==='critical'?'Falha crítica':e.status==='failure'?'Eficiência caiu':'Executada'} · ${money(e.cost)}</small></div></div>`).join('')}</div><div class="plan-money"><div>Caixa inicial <b>${money(h.startCash)}</b></div><div>Ações <b>−${money(h.actionCost)}</b></div><div>Receita <b>${money(h.revenue)}</b></div><div>Resultado operacional <b>${money(h.profit)}</b></div><div>Eventos extraordinários <b>${money(h.eventCash)}</b></div><div>Parcela aos amigos <b>−${money(h.friendsPaid)}</b></div><div>Caixa final <b>${money(h.cash)}</b></div></div><p>Clientes: +${h.newCustomers} / −${h.churn}</p>${h.acquisition?`<div class="plan-money"><div>Receita atribuída ao marketing <b>${money(h.acquisition.attributedRevenue)}</b></div><div>ROAS de aquisição <b>${roasText(h.acquisition.roas)}</b></div><div>Público da persona explorado <b>${Math.round(h.acquisition.saturation*100)}%</b></div></div>`:''}${h.events.map(t=>`<p>${esc(t)}</p>`).join('')}${h.rolls.length?`<details><summary>⚄ Ver rolagens D20</summary>${h.rolls.map(r=>`<p><b>${r.natural}</b> natural ${r.modifiers.map(m=>`${m.value>=0?'+':''}${m.value} ${esc(m.label)}`).join(' ')} → <b>${r.total}</b> · ${esc(r.label)}${r.critical?' · FALHA CRÍTICA':''}</p>`).join('')}</details>`:'<small>Sem sorteios neste mês. As campanhas só rolam D20 quando você ajusta. Desenvolvimento ganha riscos na próxima fase.</small>'}<button class="primary" onclick="closeModal()">Planejar próximo mês →</button>`);}
function approveMonth(){if(!reviewToken||resolvingMonth)return;const token=reviewToken;reviewToken=null;resolvingMonth=true;try{
 if(localStorage.getItem(KEY)!==expectedSave)throw Error('O save mudou em outra aba. Reabra o jogo antes de continuar.');
 const stored=JSON.parse(localStorage.getItem(KEY)||'null');
 if(stored?.s&&GameRules.token(GameRules.migrate(stored.s))!==token)throw Error('O save mudou em outra aba. Reabra o jogo para carregar a agenda mais recente.');
 const result=GameRules.resolve(phaseState(),meta,token,{models});
 // Write once before exposing the new state. Failed writes leave the old month intact.
 const serialized=JSON.stringify({s:result.state,meta:result.meta});localStorage.setItem(KEY,serialized);expectedSave=serialized;s=result.state;meta=result.meta;closeModal();render();
 if(result.bankrupt)modal(`<small>FIM DA JORNADA</small><h2>O caixa acabou. A experiência fica.</h2><p>Caixa final: ${money(s.cash)} · +${result.report.bankruptcyXP} pontos de aprendizado.</p><div class="actions"><button onclick="showMonthReport()">Ver fechamento</button><button class="primary" onclick="closeModal();tab=5;render()">Ver aprendizados →</button></div>`);else showMonthReport();
 }catch(e){toast('Mês não executado: '+e.message);}finally{resolvingMonth=false;}}
// Existing panels display a preview, so queued development enables launch and
// queued hires have stable IDs. The office and HUD always display real state.
const actualProduct=product,actualPeople=people,actualFinance=finance;
function previewPanel(fn){const actual=s;try{s=GameRules.project(phaseState(),meta).state;return '<div class="preview-note">◷ Prévia da agenda · efeitos somente após aprovação</div>'+fn();}finally{s=actual;}}
product=()=>previewPanel(actualProduct);marketing=renderMarketingPanel;people=()=>previewPanel(actualPeople).replaceAll('Aumenta a eficiência de aquisição em 18%.','Bônus D20 específico do canal.');finance=()=>previewPanel(actualFinance);
const officeRender=render;
render=function(){phaseState();s.actions=4-s.legacyUsed-s.plan.length;officeRender();const world=$('content').querySelector('.world');if(world){world.insertAdjacentHTML('beforeend',agendaMarkup()+(s.lastMonthReport?'<button class="report-link" onclick="showMonthReport()">▤ Último fechamento</button>':''));const button=world.querySelector('.hud>.primary');if(button)button.textContent='Revisar mês ▶';}};
advance=reviewMonth;
help=function(){modal('<small>FASE 2 · CAMPANHAS</small><h2>Quatro decisões. Um mês.</h2><p>① Clique nos objetos do escritório.<br>② Adicione até quatro ações à agenda.<br>③ Revise, remova ou mude a ordem.<br>④ Aprove para executar e fechar o mês.</p><p>Nada é cobrado enquanto você planeja. Marketing continua sendo um compromisso mensal. Você pode avançar com menos de quatro ações. No telefone, reduza, escale ou otimize campanhas. Cada canal aceita um ajuste por mês.</p><button class="primary" onclick="closeModal()">Vamos planejar ▶</button>');};
