let draft={name:'Alex',company:'Aurora',hair:'#593e50',shirt:'#eb895a',skin:'#f2bd8b',profile:0,model:MarketData.first,capital:0},step=0;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function avatar(){return `<svg viewBox="0 0 64 80" shape-rendering="crispEdges" class="avatar"><ellipse cx="32" cy="73" rx="22" ry="5" fill="#35263e"/><path d="M20 52h10v20H18v-6h2zm14 0h10v14h3v6H34" fill="#393549"/><path d="M17 32h30v25H17z" fill="${draft.shirt}"/><path d="M11 36h7v21h-7zm35 0h7v21h-7zM19 12h27v23H19z" fill="${draft.skin}"/><path d="M16 8h32v10H22v8h-6z" fill="${draft.hair}"/><path d="M28 22h3v4h-3zm12 0h3v4h-3z" fill="#34283e"/><path d="M32 30h8v2h-8z" fill="#a76568"/></svg>`;}
function shell(body){closeModal();let el=$('creation');if(!el){el=document.createElement('div');el.id='creation';document.body.appendChild(el);}el.innerHTML=body;}
function titleScreen(){shell(`<div class="title-screen"><small>UM SIMULADOR DE RECOMEÇOS</small><h1>the<br><em>founder.</em></h1>${avatar()}<p>Uma ideia. Uma chance. Seu próximo começo.</p><button class="primary" onclick="step=0;creator()">▶ NOVA JORNADA</button>${s.founder||s.month>0?'<button onclick="document.getElementById(\'creation\').remove();render();resumeDicePlayback()">CONTINUAR</button>':''}<small>PROTÓTIPO 0.14 · PIXEL OFFICE</small></div>`);}
function chips(key,colors){return colors.map(col=>`<button aria-label="${key} ${col}" class="swatch ${draft[key]===col?'selected':''}" style="background:${col}" onclick="draft.${key}='${col}';creator()"></button>`).join('');}

function creator(){if(!MarketData.currentIndices.includes(draft.model))draft.model=MarketData.first;let m=models[draft.model];shell(`<div class="creator"><div class="creator-head"><button onclick="titleScreen()">← Início</button><small class="build-label">VERSÃO 0.14 · 12 MERCADOS B2C</small><span>${['FOUNDER','EMPRESA','CAPITAL'].map((x,i)=>`<b class="${step===i?'current':''}">${i+1} ${x}</b>`).join('')}</span></div><div class="creation-grid"><aside class="portrait">${avatar()}<h2>${esc(draft.name)}</h2><p>${profiles[draft.profile]}</p><div class="sign">${esc(draft.company)}</div></aside><section class="choices">${step===0?`<h1>Quem vai começar essa história?</h1><label>Nome do founder<input maxlength="24" value="${esc(draft.name)}" oninput="draft.name=this.value"></label><div class="palette"><label>Cabelo</label>${chips('hair',['#593e50','#edb657','#a65335','#dbd6d8','#393447'])}</div><div class="palette"><label>Roupa</label>${chips('shirt',['#eb895a','#6ba8bb','#a48bd3','#83b47b','#e583a3'])}</div><div class="palette"><label>Pele</label>${chips('skin',['#f2bd8b','#d5956b','#a96d4d','#744b3f'])}</div><h3>Seu jeito de empreender</h3><div class="pick-grid">${profiles.map((p,i)=>`<button class="${draft.profile===i?'selected':''}" onclick="draft.profile=${i};creator()">${['⚡','✦','▥','★','⚒','⚙','∞','☀','◆','♥'][i]} ${p}</button>`).join('')}</div>${profileInfo()}`:step===1?`<h1>O que vamos construir?</h1><label>Nome da empresa<input maxlength="28" value="${esc(draft.company)}" oninput="draft.company=this.value"></label><div class="pick-grid">${['produto','serviço'].map(t=>`<button class="${m[2]===t?'selected':''}" onclick="draft.model=${t==='produto'?MarketData.first:MarketData.first+6};creator()">${t==='produto'?'📦 PRODUTO':'🤝 SERVIÇO'}</button>`).join('')}</div>${[...new Set(MarketData.current.filter(x=>x[2]===m[2]).map(x=>x[3]))].map(k=>`<h3>${k.toUpperCase()}</h3><div class="pick-grid models">${MarketData.currentIndices.map(i=>{const x=models[i];return x[2]===m[2]&&x[3]===k?`<button class="${draft.model===i?'selected':''}" onclick="draft.model=${i};creator()"><strong>${x[0]}</strong>${x[1]}</button>`:'';}).join('')}</div>`).join('')}<div class="selection-info"><h3>${m[0]} ${m[1]}</h3><p>${modelDescriptions[draft.model]}</p></div>${audienceInfo(m)}`:`<h1>Como financiar o começo?</h1><div class="capital-grid">${capitals.map((x,i)=>`<button class="${draft.capital===i?'selected':''}" onclick="draft.capital=${i};creator()"><strong>${x[0]} ${x[1]}</strong><b>${money(x[2])}</b><small>${x[3]}</small></button>`).join('')}</div><div class="audience"><h3>${models[draft.model][0]} ${esc(draft.company)} · ${models[draft.model][1]}</h3><p>${draft.capital===1?'Devolução: R$ 2.500/mês, do mês 7 ao 26. Atrasos reduzem confiança.':draft.capital===3?'Investidores avaliam crescimento de receita a cada trimestre. Relacionamento começa em 80/100.':draft.capital===2?'Juros iniciais: R$ 2.000/mês. Amortização pelo caderno financeiro.':'Começo enxuto: espaço de R$ 500/mês para até duas pessoas contratadas. Marketing inicial: R$ 500/mês.'}</p></div>`}<div class="creator-next">${step>0?'<button onclick="step--;creator()">← Voltar</button>':''}<button class="primary" onclick="creationNext()">${step===2?'FUNDAR EMPRESA ▶':'Continuar →'}</button></div></section></div></div>`);}
function creationNext(){if(!draft.name.trim()||!draft.company.trim())return toast('Dê um nome ao founder e à empresa.');if(step<2){step++;creator();return;}if(!s.ended&&(s.month>0||s.founder)){modal('<h2>Começar outra jornada?</h2><p>O save desta empresa será substituído. Seus aprendizados anteriores continuam.</p><button onclick="foundCompany()">Começar</button> <button onclick="closeModal()">Voltar</button>');return;}foundCompany();}
function foundCompany(){const previous=s,previousTab=tab;closeModal();s=fresh(draft.company.trim());s.founder={...draft};s.business=draft.model;s.marketCatalogVersion=MarketData.version;s.marketId=MarketData.ids[draft.model];s.capital=draft.capital;s.cash=capitals[draft.capital][2];s.balanceVersion=1;s.officeMode='garage';s.budgets=[250,250,0];s.debt=draft.capital===2?s.cash:0;s.friendsDebt=draft.capital===1?s.cash:0;s.friendsInstallment=draft.capital===1?2500:0;s.trust=80;s.equity=draft.capital===3?.85:1;s.target=0;s.actions=4;s=GameRules.migrate(s);tab=0;if(!save()){s=previous;tab=previousTab;return;}$('creation').remove();render();}
newCompany=function(){step=0;creator();};
function marketFactor(){if(s.business===undefined)return 1;let m=models[s.business],share=m[5][s.target||0]/100;return Math.min(2,Math.sqrt(m[4]*share/25000))*Math.max(.1,1-s.customers/Math.max(1,m[4]*share));}
function buyingPower(){if(s.business===undefined)return 1;let a=models[s.business][6];return (a[0]*1.6+a[1]+a[2]*.65)/100;}
const baseFinance=finance;
finance=function(){return baseFinance()+`<section class="panel"><h3>Capital: ${capitals[s.capital||0][1]}</h3><p>Sua participação: ${Math.round((s.equity??1)*100)}%${s.friendsDebt?' · Saldo com amigos: '+money(s.friendsDebt):''}${s.capital===1||s.capital===3?' · Confiança: '+s.trust+'/100':''}</p></section>`;};
titleScreen();

</script><script>
/* UI adapter. The agenda and monthly rules live in rules.js. */
let reviewToken=null,resolvingMonth=false;
let expectedSave=localStorage.getItem(KEY);
save=function(){try{if(s.schemaVersion>6)throw Error('Save de versão mais nova.');if(localStorage.getItem(KEY)!==expectedSave)throw Error('O save mudou em outra aba. Reabra o jogo antes de continuar.');const data=JSON.stringify({s,meta});localStorage.setItem(KEY,data);expectedSave=data;return true;}catch(e){toast('Não foi possível salvar: '+e.message);return false;}};
function phaseState(){s=GameRules.migrate(s);return s;}
function plannedState(){return GameRules.project(phaseState(),meta).state;}

function campaignAction(channel,mode){const state=plannedState(),value=mode==='optimize'?state.budgets[channel]:Number($('campaignBudget'+channel).value);queueAction('campaign',{channel,mode,value});}
function setCampaignBudget(channel,value){$('campaignBudget'+channel).value=value;campaignRisk(channel);}
function campaignRisk(channel){const current=s.budgets[channel],value=Number($('campaignBudget'+channel).value),mod=GameRules.campaigns.modifiers(s,{type:'campaign',channel,mode:value>current?'scale':'reduce',value},models).find(m=>m.label==='Escala agressiva');$('campaignRisk'+channel).textContent=value<current?'Redução de verba garantida. A eficiência ainda depende do dado.':mod?'⚠ Escala agressiva: '+mod.value+' no D20.':'Escala gradual: sem penalidade por crescimento.';}
function renderMarketingPanel(){
 const real=phaseState(),projected=GameRules.project(real,meta).state,C=GameRules.campaigns,last=real.lastMonthReport?.acquisition,fit=C.affinity(real),size=C.audience(real,models),sat=C.saturation(real,models);
 return `<div class="campaign-summary"><div><small>PÚBLICO EXPLORADO · ${GameRules.products.ages[real.target||0]}</small><b>${Math.min(real.audienceExposure[real.target||0],size).toLocaleString('pt-BR')} / ${size.toLocaleString('pt-BR')}</b><div class="bar"><i style="width:${sat*100}%"></i></div></div><div><small>ROAS DO ÚLTIMO MÊS</small><b>${roasText(last?.roas)}</b></div><div><small>COMPROMISSO MENSAL PREVISTO</small><b>${money(C.forecast(projected))}/mês</b></div></div><div class="campaign-funnel"><span>◎ ${last?.reach||0}<small>ALCANÇADOS</small></span><b>→</b><span>◇ ${last?.leads||0}<small>INTERESSADOS</small></span><b>→</b><span>♙ ${last?.newCustomers||0}<small>NOVOS CLIENTES</small></span></div><div class="campaign-grid">${real.campaigns.map((c,i)=>{const isBlocked=C.blocked(real,i),scheduled=real.plan.some(a=>(a.type==='campaign'&&(a.channel===i))||(a.type==='budget'&&a.index===i)),row=last?.channels[i],budget=projected.budgets[i],bonus=C.modifiers(real,{type:'campaign',channel:i,mode:'optimize'},models),lastChange=real.lastMonthReport?.entries.find(e=>e.channel===i&&e.die);return `<section class="panel campaign-card"><div class="panel-head"><h2>${['⌕','✎','◎'][i]} ${C.names[i]}</h2><span class="badge">${fit[i]>=1.3?'★★★ Afinidade alta':fit[i]>=1?'★★ Afinidade média':'★ Afinidade baixa'}</span></div><div class="campaign-eff"><b>${Math.round(c.efficiency*100)}%</b><small>EFICIÊNCIA</small></div><div class="bar"><i style="width:${c.efficiency/2*100}%"></i></div>${isBlocked?'<div class="campaign-warning">🔒 Bloqueado neste mês · gasto R$ 0<br><small>Volta automaticamente no próximo. Você pode reduzir ou pausar.</small></div>':''}<div class="row"><span>Verba atual</span><b>${money(real.budgets[i])}/mês</b></div><label class="campaign-label" for="campaignBudget${i}">Planejar verba mensal</label><input id="campaignBudget${i}" type="number" min="0" max="1000000" step="1" value="${budget}" aria-label="Verba mensal ${C.names[i]}" oninput="campaignRisk(${i})"><div class="budget-presets"><button onclick="setCampaignBudget(${i},${Math.round(budget*.75)})">−25%</button><button onclick="setCampaignBudget(${i},${budget===0?500:Math.round(budget*1.25)})">+25%</button><button onclick="setCampaignBudget(${i},0)">Pausar</button></div><p id="campaignRisk${i}" class="campaign-hint">Saltos acima de 25% penalizam o D20.</p><div class="actions"><button onclick="campaignAction(${i},'reduce')" ${scheduled?'disabled':''}>↘ Reduzir</button><button onclick="campaignAction(${i},'scale')" ${scheduled||isBlocked?'disabled':''}>↗ Escalar</button></div><button class="optimize-button" onclick="campaignAction(${i},'optimize')" ${scheduled||isBlocked||budget<=0?'disabled':''}>⚒ Otimizar · R$ 500</button><small class="campaign-hint">${scheduled?'✓ Ajuste na agenda. Revise para remover ou substituir.':'Cada ajuste usa 1 ação. A verba é cobrada todo mês.'}</small><div class="campaign-kpis"><div><small>GASTO</small><b>${row?money(row.spend):'—'}</b></div><div><small>RECEITA ATRIBUÍDA</small><b>${row?money(row.attributedRevenue):'—'}</b></div><div><small>ROAS</small><b>${roasText(row?.roas)}</b></div></div><details><summary>⚄ Riscos e modificadores</summary><p>1 natural: ajuste falha e o próximo mês fica bloqueado. Redução de verba é mantida.</p><p>Total até 10: eficiência cai. De 11 em diante: melhora. Saltos acima de 25% penalizam a rolagem.</p>${bonus.map(m=>`<div class="row"><span>${esc(m.label)}</span><b>${m.value>=0?'+':''}${m.value}</b></div>`).join('')}<small>O melhor especialista do canal ajuda em até +4. Maior saturação prejudica o dado e reduz novos alcançados.</small>${lastChange?`<p>Último ajuste: dado ${lastChange.die.natural} → total ${lastChange.die.total}. ${esc(lastChange.note)}</p>`:''}</details></section>`;}).join('')}</div><p class="muted">ROAS = receita inicial dos clientes atribuídos ao canal ÷ gasto no canal. Clientes antigos e vendas orgânicas ficam de fora. ROAS não é lucro. Ao atingir todo o público, mais verba não gera novos alcançados.</p>`;
}
function chooseMarketingSpecialty(){modal(`<small>CONTRATAÇÃO · MARKETING</small><h2>Qual especialidade?</h2><div class="specialty-options">${GameRules.campaigns.names.map((name,i)=>`<button onclick="closeModal();queueAction('hire',{index:1,specialty:'${GameRules.campaigns.keys[i]}'})">${['⌕','✎','◎'][i]} ${name}</button>`).join('')}</div><p>Mesmo salário. O bônus D20 ajuda só no canal escolhido.</p><button onclick="closeModal()">Voltar</button>`);}
hire=function(index,specialty){if(index!==1||specialty)queueAction('hire',{index,specialty});else chooseMarketingSpecialty();};
function queueAction(type,params={}){const before=s;try{s=GameRules.enqueue(phaseState(),meta,{type,...params});if(!save()){s=before;return;}render();toast('＋ Na agenda · nada executado ainda');}catch(e){toast(e.message);} }
function editPlan(index,direction){const before=s;s=GameRules.edit(phaseState(),index,direction);reviewToken=null;if(!save()){s=before;return;}render();if($('modal').open)reviewMonth();}
function agendaMarkup(){const state=phaseState();return `<div class="agenda-dock"><div class="agenda-title"><b>▦ AGENDA DO MÊS</b><span>${state.plan.length+state.legacyUsed}/4</span><button onclick="reviewMonth()">Revisar →</button></div><div class="agenda-slots">${Array.from({length:4},(_,i)=>i<state.legacyUsed?'<div class="agenda-slot used">✓ Já realizada</div>':state.plan[i-state.legacyUsed]?`<button class="agenda-slot filled" onclick="reviewMonth()">${i+1}. ${esc(GameRules.describe(state.plan[i-state.legacyUsed]))}</button>`:`<div class="agenda-slot empty">${i+1} · Livre</div>`).join('')}</div></div>`;}
function reviewMonth(){if(s.ended)return;const p=GameRules.project(phaseState(),meta);reviewToken=GameRules.token(s);modal(`<small>PLANEJE → REVISE → APROVE</small><h2>Seu próximo mês</h2><p>${s.plan.length} ação(ões) planejada(s). A ordem abaixo será respeitada.</p><div class="plan-list">${s.plan.map((a,i)=>`<div class="plan-item ${p.errors.some(e=>e.index===i)?'invalid':''}"><b>${i+1}</b><div>${esc(GameRules.describe(a))}<small>${money(p.entries[i]?.cost||0)} · ${p.errors.find(e=>e.index===i)?esc(p.errors.find(e=>e.index===i).message):(['campaign','budget','product_develop','product_research','finance_benchmark','finance_supplier','finance_credit','people_train','people_meeting','meeting','promote'].includes(a.type)?'⚄ D20 ao executar · resultado incerto':'Pronta para executar')}</small></div><button aria-label="Subir ação ${i+1}" onclick="editPlan(${i},-1)" ${i===0?'disabled':''}>↑</button><button aria-label="Descer ação ${i+1}" onclick="editPlan(${i},1)" ${i===s.plan.length-1?'disabled':''}>↓</button><button aria-label="Remover ação ${i+1}" onclick="editPlan(${i},0)">✕</button></div>`).join('')||'<div class="plan-item">☕ Mês sem ações. Os custos mensais continuam.</div>'}</div><div class="plan-money"><div>Caixa hoje <b>${money(s.cash)}</b></div><div>Custo das ações <b>−${money(p.cost)}</b></div><div>Compromissos mensais¹ <b>−${money(p.expenses+p.friendsDue+(p.principalDue||0))}</b></div><div>Reserva antes de vendas <b class="${p.reserve<0?'negative':''}">${money(p.reserve)}</b></div></div><small>¹ Folha, aluguel, marketing/mês, juros, principal bancário previsto e parcela aos amigos. Custos variáveis e eventos dependem do fechamento.</small>${p.reserve<0?'<p class="negative">⚠ Os compromissos superam sua reserva. Você dependerá das vendas para fechar o mês.</p>':''}${Object.values(s.finance?.suppliers||{}).some(p=>p.offer?.status==='open'&&s.month>=p.offer.expiresAt)?'<p class="negative">Há oferta de fornecedor pendente que expirará neste fechamento.</p><button onclick="reviewToken=null;closeModal();financeNav(\'suppliers\')">Ver oferta antes de executar</button>':''}<div class="actions"><button onclick="reviewToken=null;closeModal()">← Continuar planejando</button><button class="primary" onclick="approveMonth()" ${p.errors.length?'disabled':''}>Aprovar e executar mês ▶</button></div>`);}
function showMonthReport(){const h=s.lastMonthReport;if(!h)return toast('Ainda não há fechamento.');modal(`<small>FECHAMENTO · MÊS ${h.month}</small><h2>${h.profit>=0?'Mais um passo.':'Hora de ajustar a rota.'}</h2><div class="plan-results">${h.entries.map(e=>`<div class="plan-item">${e.status==='skipped'?'⊘':e.status==='critical'?'✕':e.status==='failure'?'⚠':'✓'} <div>${esc(e.label)}<small>${e.status==='skipped'?'Pulado · sem custo':e.status==='critical'?'Falha crítica':e.status==='failure'?'Tentativa falhou':'Executada'} · ${money(e.cost)}</small></div></div>`).join('')}</div><div class="plan-money"><div>Caixa inicial <b>${money(h.startCash)}</b></div><div>Crédito recebido <b>${money(h.creditReceived||0)}</b></div><div>Ações <b>−${money(h.actionCost)}</b></div><div>Receita <b>${money(h.revenue)}</b></div><div>Resultado operacional <b>${money(h.profit)}</b></div><div>Eventos extraordinários <b>${money(h.eventCash)}</b></div><div>Principal bancário <b>−${money(h.bankPrincipalPaid||0)}</b></div><div>Parcela aos amigos <b>−${money(h.friendsPaid)}</b></div><div>Caixa final <b>${money(h.cash)}</b></div></div><p>Novos compradores: ${h.newBuyers??h.newCustomers} · cancelamentos: ${h.churn}</p>${h.unitsSold!==undefined?`<p>Unidades vendidas: ${h.unitsSold} · assinaturas cobradas: ${h.subscriptionsBilled} · assinantes ativos: ${h.activeSubscribers}</p>`:''}${h.productSales?.length?`<details><summary>◇ Resultado por produto</summary>${h.productSales.map(p=>`<div class="plan-item"><div><b>${esc(p.name)}</b><small>${p.units} ${p.mode==='recurring'?'cobranças':'vendas'} · Receita ${money(p.revenue)} · Custo ${money(p.cogs)} · NPS ${p.nps}</small></div></div>`).join('')}</details>`:''}${h.acquisition?`<div class="plan-money"><div>Receita atribuída ao marketing <b>${money(h.acquisition.attributedRevenue)}</b></div><div>ROAS de aquisição <b>${roasText(h.acquisition.roas)}</b></div><div>Público da persona explorado <b>${Math.round(h.acquisition.saturation*100)}%</b></div></div>`:''}${h.peopleChanges?.length?`<details><summary>♥ Motivação da equipe</summary>${h.peopleChanges.map(p=>`<p>${esc(p.name)}: ${p.before} → ${p.after} · resultado ${p.financial>=0?'+':''}${p.financial} · área ${p.activity>=0?'+':''}${p.activity}</p>`).join('')}</details>`:''}${h.events.map(t=>`<p>${esc(t)}</p>`).join('')}${h.rolls.length?`<button onclick="replayDice()">⚄ Rever dados rolando</button><details><summary>Ver números registrados</summary>${h.rolls.map(r=>`<p><b>${r.natural}</b> natural ${r.modifiers.map(m=>`${m.value>=0?'+':''}${m.value} ${esc(m.label)}`).join(' ')} → <b>${r.total}</b> · ${esc(r.label)}${r.kind==='selection'?' · SORTEIO DE CATEGORIA':r.critical?' · FALHA CRÍTICA':''}</p>`).join('')}</details>`:'<small>Sem sorteios neste mês. As campanhas só rolam D20 quando você ajusta. Pessoas e desenvolvimento usam D20 nas respectivas decisões.</small>'}<button class="primary" onclick="closeModal()">Planejar próximo mês →</button>`);}
function approveMonth(){if(!reviewToken||resolvingMonth)return;const token=reviewToken;reviewToken=null;resolvingMonth=true;try{
 if(localStorage.getItem(KEY)!==expectedSave)throw Error('O save mudou em outra aba. Reabra o jogo antes de continuar.');
 const stored=JSON.parse(localStorage.getItem(KEY)||'null');
 if(stored?.s&&GameRules.token(GameRules.migrate(stored.s))!==token)throw Error('O save mudou em outra aba. Reabra o jogo para carregar a agenda mais recente.');
 const result=GameRules.resolve(phaseState(),meta,token,{models});
 // Write once before exposing the new state. Failed writes leave the old month intact.
 if(result.report.rolls.length)result.state.dicePlayback={token:result.report.token,index:0,stage:'ready'};
 const serialized=JSON.stringify({s:result.state,meta:result.meta});localStorage.setItem(KEY,serialized);expectedSave=serialized;s=result.state;meta=result.meta;closeModal();render();
 presentMonthResult();
 }catch(e){toast('Mês não executado: '+e.message);}finally{resolvingMonth=false;}}
// Existing panels display a preview, so queued development enables launch and

</script><script>
/* Visual catalog and editor. Only queued actions mutate the company. */

const P=GameRules.products;
function productRadar(values,max=10){const pts=[[100,18],[182,100],[100,182],[18,100]],polygon=values.map((v,i)=>[100+(pts[i][0]-100)*v/max,100+(pts[i][1]-100)*v/max].join(',')).join(' ');return `<svg viewBox="0 0 200 200" class="product-radar" role="img" aria-label="Atributos: ${values.map((v,i)=>P.axes[i]+' '+v).join(', ')}"><path d="M100 18 182 100 100 182 18 100Z M100 46 154 100 100 154 46 100Z M100 73 127 100 100 127 73 100Z" fill="none" stroke="#bca8b9"/><path d="M100 18V182 M18 100H182" stroke="#bca8b9"/><polygon points="${polygon}" fill="#a3c99180" stroke="#517c59" stroke-width="2"/>${values.map((v,i)=>`<circle cx="${100+(pts[i][0]-100)*v/max}" cy="${100+(pts[i][1]-100)*v/max}" r="4" fill="#f5b968"/>`).join('')}</svg>`;}
function adoptionChart(p,size){const share=Math.min(1,size?p.uniqueBuyers/size:1),x=20+share*280;return `<div class="adoption"><svg viewBox="0 0 320 100" role="img" aria-label="Curva de adoção, ${Math.round(share*100)} por cento"><path d="M20 82 C60 82 75 20 160 18 S250 82 300 82" fill="none" stroke="#ac93ae" stroke-width="3"/><path d="M62 10V87" stroke="#d28568" stroke-dasharray="4 3"/><path d="M${x} 10V87" stroke="#507e5c" stroke-width="3"/><text x="66" y="94" font-size="8" fill="#8e5f62">ABISMO · 15%</text></svg><div><b>${P.stage(p,size).name}</b><small>${p.uniqueBuyers.toLocaleString('pt-BR')} / ${size.toLocaleString('pt-BR')} compradores · ${(share*100).toFixed(1)}%</small></div></div>`;}
function priceHistory(p){const rows=p.history.slice(-12);if(rows.length<2)return '';const max=Math.max(1,...rows.map(r=>Math.abs(r.revenue-r.cogs)));return `<details class="price-history"><summary>▥ Minhas experiências de preço</summary><div class="price-experiments">${rows.map(r=>{const value=r.revenue-r.cogs;return `<div><i style="height:${Math.max(3,Math.abs(value)/max*70)}px;background:${value<0?'#bc7977':'#91ad77'}" title="Preço ${money(r.price)} · ${r.units} unidades · margem bruta ${money(value)}"></i><small>${money(r.price)}</small></div>`;}).join('')}</div><p class="muted">Margem bruta realizada: receita menos custo variável. As vendas também dependem de marketing, público e estágio do produto.</p></details>`;}
function renderProductPanel(){
 const real=phaseState(),state=GameRules.project(real,meta).state;for(const hint of meta.productInsights||[]){if(hint.marketId===state.marketId){const key=hint.age+'-'+hint.income;state.marketResearch[key]??={};state.marketResearch[key][hint.axis]??=hint;}}const list=state.products,active=list.filter(p=>!p.retired);if(!selectedProductId||!P.find(state,selectedProductId))selectedProductId=active[0]?.id||list[0]?.id;
 const p=P.find(state,selectedProductId),m=models[state.business??3];
 return `<div class="product-toolbar"><div><small>SEU LABORATÓRIO</small><h2>Ideias precisam encontrar pessoas.</h2></div><button class="primary" onclick="newProductEditor()">＋ Novo produto</button><button onclick="researchEditor()">⌕ Pesquisar persona · R$ 1 mil</button></div><div class="preview-note">◷ Prévia da agenda · desenvolvimento pode falhar. Lançamentos dependentes serão pulados sem custo.</div><div class="catalog-layout"><div class="catalog-list">${list.map(x=>`<button class="catalog-item ${p?.id===x.id?'selected':''}" onclick="selectedProductId='${esc(x.id)}';render()"><span>${x.retired?'▣':x.launched?'◆':'◇'}</span><b>${esc(x.name)}</b><small>${x.retired?'Arquivado':x.launched?'No mercado':'Em desenvolvimento'} · NV ${x.level}/10</small></button>`).join('')||'<div class="panel empty-product"><span>◇</span><h3>Qual será sua primeira ideia?</h3><p>Dê um nome, escolha uma persona e distribua quatro pontos.</p></div>'}</div><div>${p?productDetail(state,p):`<section class="panel product-intro"><div class="pixel-box">✦</div><h2>Um produto com a sua assinatura.</h2><p class="muted">Uma boa execução não garante demanda. Descubra o que seu público valoriza.</p><button class="primary" onclick="newProductEditor()">Criar meu primeiro produto →</button></section>`}</div></div>`;
}
function productDetail(state,p){const cost=P.unitCost(state,p,meta),size=P.marketSize(state,p,models),stats=p.history.at(-1),price=p.price;return `<section class="panel"><div class="panel-head"><div><small>${p.generation>1?'GERAÇÃO '+p.generation:'PRODUTO ORIGINAL'} · ${p.mode==='oneoff'?'COMPRA ÚNICA':'RECORRENTE'}</small><h2>${esc(p.name)}</h2></div><span class="badge">${p.scale==='lean'?'MVP ENXUTO':'PROJETO COMPLETO'}</span></div><div class="product-metrics"><div><small>NÍVEL</small><b>${p.level}/10</b></div><div><small>CUSTO POR UNIDADE${p.mode==='recurring'?'/MÊS':''}</small><b>${money(cost)}</b></div><div><small>PREÇO${p.mode==='recurring'?'/MÊS':''}</small><b>${price===null?'A definir':money(price)}</b></div><div><small>NPS</small><b>${p.launched?P.nps(state,p):'—'}</b></div></div><div class="product-design">${productRadar(p.attributes)}<div>${p.attributes.map((v,i)=>`<div class="attribute-summary"><b>${P.axes[i]}</b><span>${v}</span><div class="bar"><i style="width:${v*10}%"></i></div><small>↔ ${P.opposites[i]}</small></div>`).join('')}</div></div><div class="persona-badge">♙ ${P.ages[p.age]} anos · Classe ${P.classes[p.income]} · ${size.toLocaleString('pt-BR')} potenciais</div>${state.target!==p.age?`<p class="negative">Marketing está mirando ${P.ages[state.target||0]}, mas este produto atende ${P.ages[p.age]}. Direcione as campanhas abaixo.</p>`:''}${p.launched?adoptionChart(p,size):'<p class="muted">O primeiro desenvolvimento cria o MVP com quatro pontos. Cada melhoria abre um ponto extra, até dez.</p>'}${stats?`<div class="product-metrics"><div><small>VENDAS / COBRANÇAS</small><b>${stats.units}</b></div><div><small>RECEITA</small><b>${money(stats.revenue)}</b></div><div><small>MARGEM BRUTA</small><b>${money(stats.revenue-stats.cogs)}</b></div></div>`:''}<div class="actions">${!p.retired&&p.level<10?`<button onclick="developProductEditor('${esc(p.id)}')">⚒ ${p.level===0?'Desenvolver MVP':'Melhorar'} · ${money(P.developmentCost(p))}</button>`:''}${!p.retired&&!p.launched&&p.level>=4?`<button class="primary" onclick="priceProductEditor('${esc(p.id)}',true)">Lançar →</button>`:''}${p.launched&&!p.retired?`<button onclick="priceProductEditor('${esc(p.id)}',false)">Ajustar preço</button><button onclick="newProductEditor('${esc(p.id)}')">＋ Próxima geração</button>`:''}</div>${!p.retired?`<div class="actions"><button onclick="queueAction('target',{value:${p.age}})">◎ Direcionar marketing para ${P.ages[p.age]}</button><button onclick="retireProduct('${esc(p.id)}')">Arquivar</button></div>`:''}${priceHistory(p)}${p.nextObsolete!==null&&!p.retired?`<p class="muted">Obsolescência: −1 ponto ao fim do mês ${p.nextObsolete}. Priorize melhorias ou uma nova geração.</p>`:''}</section>`;}
function newProductEditor(parentId=null){const parent=parentId?P.find(plannedState(),parentId):null;productDraft={kind:'create',name:parent?parent.name+' '+(parent.generation+1):'',mode:parent?.mode||'oneoff',scale:'lean',age:parent?.age??(s.target||0),income:parent?.income??1,attributes:parent?P.allocate(4,parent.attributes):[1,1,1,1],parentId};drawProductEditor();}
function developProductEditor(id){const p=P.find(plannedState(),id);if(!p)return;productDraft={kind:'develop',productId:id,name:p.name,mode:p.mode,scale:p.scale,age:p.age,income:p.income,attributes:p.level===0?[...p.blueprint]:[...p.attributes],budget:P.nextLevel(p)};drawProductEditor();}
function adjustAttribute(i,delta){const d=productDraft,budget=d.kind==='create'?4:d.budget,values=[...d.attributes];values[i]=Math.max(0,Math.min(10,values[i]+delta));if(values.reduce((n,v)=>n+v,0)>budget)return;d.attributes=values;drawProductEditor();}
function drawProductEditor(){const d=productDraft,state=plannedState(),creating=d.kind==='create',budget=creating?4:d.budget,used=d.attributes.reduce((n,v)=>n+v,0),p=creating?{...d,level:4}:P.find(state,d.productId),cost=creating?(d.scale==='lean'?6000:30000):P.developmentCost(p),research={...Object.fromEntries((meta.productInsights||[]).filter(x=>x.marketId===state.marketId&&x.age===d.age&&x.income===d.income).map(x=>[x.axis,x])),...(state.marketResearch[d.age+'-'+d.income]||{})};modal(`<small>${creating?'NOVO CONCEITO':'DESENVOLVIMENTO · D20'}</small><h2>${creating?'Dê vida à sua ideia.':esc(d.name)}</h2>${creating?`<label>Nome do produto<input id="productName" maxlength="32" type="text" value="${esc(d.name)}" oninput="productDraft.name=this.value"></label><div class="product-form-grid"><label>Cobrança<select onchange="productDraft.mode=this.value"><option value="oneoff" ${d.mode==='oneoff'?'selected':''}>Compra única</option><option value="recurring" ${d.mode==='recurring'?'selected':''}>Recorrente / mensal</option></select></label><label>Projeto<select onchange="productDraft.scale=this.value;drawProductEditor()"><option value="lean" ${d.scale==='lean'?'selected':''}>Enxuto · MVP R$ 6 mil</option><option value="standard" ${d.scale==='standard'?'selected':''}>Completo · MVP R$ 30 mil</option></select></label><label>Idade<select onchange="productDraft.age=+this.value;drawProductEditor()">${P.ages.map((v,i)=>`<option value="${i}" ${d.age===i?'selected':''}>${v}</option>`).join('')}</select></label><label>Classe<select onchange="productDraft.income=+this.value;drawProductEditor()">${P.classes.map((v,i)=>`<option value="${i}" ${d.income===i?'selected':''}>${v}</option>`).join('')}</select></label></div>`:''}<div class="points-counter">✦ ${used} / ${budget} pontos distribuídos</div><div class="product-design">${productRadar(d.attributes)}<div>${P.axes.map((name,i)=>`<div class="attribute-editor"><div><b>${name}</b><small>↔ ${P.opposites[i]}${research[i]?' · Pesquisa: prioridade '+research[i].priority:''}</small></div><button aria-label="Diminuir ${name}" onclick="adjustAttribute(${i},-1)">−</button><strong>${d.attributes[i]}</strong><button aria-label="Aumentar ${name}" onclick="adjustAttribute(${i},1)">＋</button></div>`).join('')}</div></div><p class="muted">Mais qualidade e recursos elevam o custo. Personalização reduz padronização; originalidade reduz familiaridade. O público pode não valorizar o que você priorizou.</p><div class="product-metrics"><div><small>PRÓXIMA TENTATIVA</small><b>${money(cost)}</b></div><div><small>DIFICULDADE D20</small><b>${creating?6:P.difficulty(p)}</b></div><div><small>CUSTO UNITÁRIO ESTIMADO</small><b>${money(P.unitCost(state,{...p,attributes:d.attributes},meta))}</b></div></div>${!creating?`<div class="dice-modifiers">${P.modifiers(state,meta).map(m=>`<div class="modifier-chip ${m.value<0?'debuff':'buff'}"><b>${m.value>=0?'+':''}${m.value}</b><span>${esc(m.label)}</span></div>`).join('')}</div>`:''}${creating?`<p class="muted">${d.scale==='lean'?'Enxuto: entrada barata, custo por unidade 25% maior e menor disposição a pagar.':'Completo: maior investimento inicial, operação mais eficiente.'} Criar o conceito usa uma ação sem custo; desenvolver usa outra.</p>`:'<p class="muted">A tentativa é paga mesmo se falhar. Natural 1 reduz um nível. As dependências serão revalidadas.</p>'}${d.parentId?'<p class="negative">Ao lançar esta geração, a anterior será arquivada e suas assinaturas encerradas.</p>':''}<div class="actions"><button onclick="closeModal()">Voltar</button><button class="primary" onclick="submitProductEditor()" ${used!==budget?'disabled':''}>Adicionar à agenda →</button></div>`);}
function submitProductEditor(){const d=productDraft;if(!d)return;const before=s.plan.length;if(d.kind==='create')queueAction('product_create',{name:d.name,mode:d.mode,scale:d.scale,age:d.age,income:d.income,attributes:[...d.attributes],parentId:d.parentId});else queueAction('product_develop',{productId:d.productId,productName:d.name,attributes:[...d.attributes]});if(s.plan.length>before){closeModal();const created=plannedState().products.at(-1);if(d.kind==='create'&&created)selectedProductId=created.id;render();}}

function submitProductPrice(id,launch){const p=P.find(plannedState(),id),before=s.plan.length;queueAction(launch?'product_launch':'product_price',{productId:id,productName:p?.name,price:Number($('productPrice').value),...(launch?{mode:$('productLaunchMode').value}:{})});if(s.plan.length>before)closeModal();}
function researchEditor(){modal(`<small>ANTES DE APOSTAR</small><h2>Quem você quer conhecer?</h2><div class="product-form-grid"><label>Idade<select id="researchAge">${P.ages.map((v,i)=>`<option value="${i}">${v}</option>`).join('')}</select></label><label>Classe<select id="researchIncome">${P.classes.map((v,i)=>`<option value="${i}">${v}</option>`).join('')}</select></label></div><p>Uma pesquisa pode revelar a prioridade de um atributo. Custa R$ 1.000 e uma ação. D20 10+ traz uma pista; pode falhar.</p><div class="actions"><button onclick="closeModal()">Voltar</button><button class="primary" onclick="queueAction('product_research',{age:+document.getElementById('researchAge').value,income:+document.getElementById('researchIncome').value});closeModal()">Pesquisar →</button></div>`);}

/* Finance UI: read the close, plan decisions, then resolve persisted offers. */
const F=GameRules.finance;let financeTab='overview';
function financePct(value,revenue){return revenue>0?(value/revenue*100).toFixed(1)+'%':'—';}
function financeNav(tabName){financeTab=tabName;tab=4;render();}
function renderFinancePanel(){const real=phaseState(),state=GameRules.project(real,meta).state,h=real.history.at(-1),f=real.finance;return `<div class="finance-heading"><div><small>ADMINISTRATIVO-FINANCEIRO</small><h2>Caixa é tempo para acertar.</h2></div><span class="badge">${capitals[real.capital||0][1]} · ${Math.round((real.equity??1)*100)}% seu</span></div><div class="finance-tabs">${[['overview','▥ Resultado'],['suppliers','🤝 Fornecedores'],['credit','🏦 Crédito'],['benchmarks','⌕ Benchmarks']].map(([key,name])=>`<button class="${financeTab===key?'selected':''}" onclick="financeNav('${key}')">${name}</button>`).join('')}</div>${financeTab==='overview'?financeOverview(real,state,h):financeTab==='suppliers'?supplierPanel(real):financeTab==='credit'?creditPanel(real,state):benchmarkPanel(real,h)}`;}
function financeOverview(real,state,h){const amounts=h?[['Receita',h.revenue,false],['Custos variáveis',h.cogs,true],['Pessoas',h.payroll,true],['Aluguel',h.rent??2000,true],['Marketing',h.marketing,true],['Juros',h.interest,true],['Resultado operacional',h.profit,false]]:[];return `<div class="finance-kpis"><div><small>CAIXA REAL</small><b>${money(real.cash)}</b></div><div><small>COMPROMISSOS / MÊS</small><b>${money(F.rent(state)+payrollOf(state)+GameRules.campaigns.forecast(state)+F.interest(state)+F.principalDue(state)+(state.capital===1&&state.month+1>6?Math.min(state.friendsInstallment??1750,state.friendsDebt||0):0))}</b></div><div><small>DÍVIDA BANCÁRIA</small><b>${money(real.debt)}</b></div></div><div class="grid"><section class="panel"><div class="panel-head"><h2>Resultado${h?' · mês '+h.month:''}</h2><span class="badge">% DA RECEITA</span></div>${h?amounts.map(([name,value,isCost])=>`<div class="finance-line"><span>${name}</span><b>${money(isCost?-value:value)}</b><strong class="${value>h.revenue&&isCost?'negative':''}">${financePct(value,h.revenue)}</strong>${isCost?`<div class="bar"><i style="width:${Math.max(0,Math.min(100,h.revenue?value/h.revenue*100:0))}%"></i></div>`:''}</div>`).join(''):'<p class="muted">Feche um mês para conhecer o resultado. Sem receita, percentuais aparecem como “—”.</p>'}<p class="muted">Investimentos e amortizações saem do caixa, mas não são despesas operacionais nesta DRE simplificada.</p>${h?`<details><summary>Do resultado ao caixa</summary><div class="row"><span>Caixa inicial</span><b>${money(h.startCash??0)}</b></div><div class="row"><span>Crédito recebido</span><b>${money(h.creditReceived||0)}</b></div><div class="row"><span>Ações / investimentos</span><b>−${money(h.actionCost||0)}</b></div><div class="row"><span>Resultado operacional</span><b>${money(h.profit)}</b></div><div class="row"><span>Eventos</span><b>${money(h.eventCash||0)}</b></div><div class="row"><span>Principal bancário automático</span><b>−${money(h.bankPrincipalPaid||0)}</b></div><div class="row"><span>Family & friends</span><b>−${money(h.friendsPaid||0)}</b></div><div class="row"><span>Caixa do fechamento</span><b>${money(h.cash??real.cash)}</b></div></details>`:''}</section><div><section class="panel mission"><small>PRÓXIMO CAPÍTULO</small><h2>${money(valuation())}</h2><p>Oferta simulada de compra. Exige seis meses de empresa e três meses seguidos de lucro.</p><button onclick="sell()" ${real.month<6||real.streak<3||real.ended?'disabled':''}>Vender empresa →</button></section><section class="panel"><h3>Inflação dos fornecedores</h3><p class="big">+${((real.finance.inflationFactor-1)*100).toFixed(1)}%</p><p class="muted">3% ao ano sobre custo variável e aluguel. Não altera salários nem sua verba de marketing automaticamente.</p></section>${real.capital===1?`<section class="panel"><h3>Family & friends</h3><p>${money(real.friendsDebt||0)} a devolver · confiança ${real.trust}/100</p><p class="muted">Sem juros. ${money(real.friendsInstallment??1750)} por mês após a carência inicial.</p></section>`:real.capital===3?`<section class="panel"><h3>Investidores</h3><p>Confiança ${real.trust}/100</p><p class="muted">Avaliam crescimento a cada trimestre.</p></section>`:''}<section class="panel"><h3>Encerrar esta jornada</h3><button onclick="askEnd()" ${real.ended?'disabled':''}>Liquidar empresa</button></section></div></div>`;}
