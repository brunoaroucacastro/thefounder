f}h1{font-size:29px;letter-spacing:-1px;margin:7px 0}h2{font-size:20px;margin:0 0 8px}h3{margin:0 0 10px;font-size:16px}.time{display:flex;align-items:center;gap:18px}.time span{font-size:12px;color:var(--muted)}#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}.stat{border:1px solid var(--line);background:#fff;border-radius:10px;padding:19px 21px}.stat label{font-size:11px;color:var(--muted)}.stat strong{display:block;font:27px 'Space Grotesk',sans-serif;margin:9px 0}.stat small{letter-spacing:0;font-size:10px}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(270px,1fr);gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:23px;margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.badge{font-size:10px;border-radius:20px;background:#edf0e6;padding:6px 10px;color:#638062}.office{padding:0;overflow:hidden;background:#e8e9d9}.office .panel-head{padding:22px 23px 0}.office canvas{display:block;width:100%;height:290px}.office-bottom{display:flex;justify-content:space-between;background:#fff;padding:16px 22px;font-size:11px;color:var(--muted)}.mission{background:var(--green);color:#fff}.mission small{color:var(--lime)}.mission p{line-height:1.7;color:#c9d4c5;font-size:12px}.mission h2{margin-top:13px}.bar{height:7px;background:#e8ecdf;border-radius:20px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#9cb76d;border-radius:20px}.mission .bar{background:#53715c}.mission .bar i{background:var(--lime)}.muted{color:var(--muted);font-size:12px;line-height:1.6}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eceee7}.row:last-child{border:0}.row small{letter-spacing:0}.amount{font-family:'Space Grotesk';font-weight:600}.positive{color:#478153}.negative{color:#b65f4c}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button{flex:1}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cards .panel{margin:0}input[type=range]{width:100%;accent-color:var(--green);margin:15px 0}input[type=text],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;margin:8px 0 18px}.big{font:38px 'Space Grotesk';letter-spacing:-1px}.icon{width:45px;height:45px;display:grid;place-items:center;border-radius:12px;background:#eceddf;font-size:22px;margin-bottom:20px}.log{padding:12px 0;border-bottom:1px solid #eee;font-size:12px;line-height:1.5}.log small{display:block;font-size:9px;letter-spacing:0;margin-top:5px}.chart{height:130px;display:flex;gap:7px;align-items:flex-end;margin-top:20px}.chart div{flex:1;background:#a1b47d;border-radius:4px 4px 0 0;min-height:3px;position:relative}.chart div:hover:after{content:attr(data-tip);position:absolute;bottom:100%;background:var(--green);color:white;padding:6px;font-size:10px;white-space:nowrap;z-index:2}footer{display:flex;justify-content:space-between;color:#92998c;font-size:9px;letter-spacing:1px;padding:12px 0}footer b{color:#c4cab9;padding:0 8px}dialog{border:0;border-radius:16px;max-width:540px;width:90%;padding:32px;color:var(--ink);box-shadow:0 20px 100px #18312240}dialog::backdrop{background:#18312288;backdrop-filter:blur(4px)}dialog p{line-height:1.7;color:#6e7a70}dialog button{margin-top:12px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--green);color:white;border-radius:8px;padding:15px 25px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.funnel div{padding:16px;margin:5px auto;background:#e3eacb;text-align:center;border-radius:6px}.funnel div:nth-child(2){width:85%;background:#c8d9a9}.funnel div:nth-child(3){width:70%;background:#a7c184}.funnel div:nth-child(4){width:55%;background:#749b68;color:white} @media(max-width:1100px){aside{width:190px;padding:25px 15px}main{margin-left:190px;padding:25px 20px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:720px){aside{position:static;width:auto;padding:15px}.brand{font-size:23px}.company,.aside-bottom{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto;padding:10px}main{margin:0;padding:20px}header{align-items:flex-start;gap:10px}h1{font-size:22px}.time{flex-direction:column;gap:8px}#stats{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.stat{padding:14px}.stat strong{font-size:23px}footer span:last-child{display:none}}

<body><aside><a class="brand" href="#">the founder<span>UM SIMULADOR DE RECOMEÇOS</span></a><div class="company"><span class="logo">f.</span><div><b id="company">Sua primeira empresa</b><small>SOFTWARE · B2B</small></div></div><nav id="nav"></nav><div class="aside-bottom"><span class="live">● SALVAMENTO AUTOMÁTICO</span><p>Uma boa ideia é só o começo.</p><button onclick="help()">Como jogar ↗</button><button id="sound" onclick="toggleSound()">♫ Som desligado</button></div></aside>
<main><header><div><small id="season">ANO 1 / JANEIRO</small><h1 id="heading">Seu próximo grande passo.</h1></div><div class="time"><span id="actions"></span><button class="primary" onclick="advance()" id="advance">Fechar mês →</button></div></header><section id="stats"></section><div id="content"></div><footer><span>THE FOUNDER <b> / </b> PROTÓTIPO 0.3.1</span><span>Decisões pequenas. Consequências grandes.</span></footer></main>
<dialog id="modal"><div id="modalBody"></div></dialog><div id="toast" role="status"></div><script>
const $=id=>document.getElementById(id), money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const KEY='the-founder-v1', months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let meta={wealth:0,xp:0,skills:[],runs:0,knowledge:[]},s,tab=0,audioCtx,osc,gain,sound=false;
function fresh(name='Aurora Labs'){return {name,month:0,cash:60000,price:89,quality:35,launched:false,dev:0,customers:0,motivation:82,team:[],budgets:[500,500,0],debt:0,actions:4,research:0,history:[],logs:[{text:'As chaves são suas. Comece desenvolvendo seu primeiro produto.',month:0}],totalRevenue:0,ended:false,streak:0};}
try{let data=JSON.parse(localStorage.getItem(KEY));if(data){s=data.s;meta=data.meta;}}catch(e){}if(!s)s=fresh();
const tabs=['Visão geral','Produto & preço','Marketing','Pessoas','Financeiro','Aprendizados'],icons=['◈','◇','↗','♙','▥','✧'];
function save(){try{localStorage.setItem(KEY,JSON.stringify({s,meta}));}catch(e){toast('O navegador bloqueou o salvamento. Mantenha esta aba aberta.');}}
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.opacity=0,3600);}
function log(t){s.logs.unshift({text:t,month:s.month});s.logs=s.logs.slice(0,35);}
function modal(html){$('modalBody').innerHTML=html;if(!$('modal').open)$('modal').showModal();}
function closeModal(){$('modal').close();}
function spend(cost,fn){if(s.ended)return toast('Esta jornada terminou. Comece outra empresa.');if(s.actions<1)return toast('Sua agenda está cheia. Feche o mês para continuar.');if(s.cash<cost)return toast('Caixa insuficiente para esta decisão.');s.cash-=cost;s.actions--;fn();save();render();}
function skill(id){return meta.skills.includes(id);}
function payroll(){return s.team.reduce((a,p)=>a+p.salary,0);}
function capacity(){return Math.round((45+s.team.filter(p=>p.role==='Suporte').reduce((a,p)=>a+p.level,0)*110+s.quality*2)*(s.motivation/100));}
function valuation(){let h=s.history.slice(-3);return Math.round(Math.max(0,s.cash-s.debt)+Math.max(0,h.reduce((a,b)=>a+b.profit,0)/Math.max(1,h.length))*24+s.customers*120);}
function render(){
 $('company').textContent=s.name;$('season').textContent=`ANO ${Math.floor(s.month/12)+1} / ${months[s.month%12].toUpperCase()}`;$('actions').textContent=`◷ ${s.actions}/4 ações disponíveis`;$('advance').disabled=s.ended;
 $('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()"><span>${icons[i]}</span>${t}</button>`).join('');
 const last=s.history.at(-1)||{revenue:0,profit:0,churn:0};$('heading').textContent=['Seu próximo grande passo.','Uma ideia que vale a pena.','Encontre seus primeiros fãs.','Grandes negócios são pessoas.','Caixa é tempo para acertar.','Toda jornada deixa algo.'][tab];
 $('stats').innerHTML=[['Caixa disponível',money(s.cash),s.cash<12000?'Atenção à sua reserva':'Seu combustível para crescer'],['Receita mensal',money(last.revenue),s.launched?`${s.customers} clientes ativos`:'Seu produto ainda não foi lançado'],['Resultado do mês',money(last.profit),s.history.length?'Depois de todos os custos':'A primeira página está em branco'],['Motivação da equipe',s.motivation+'%',`${s.team.length+1} pessoas · incluindo você`]].map((x,i)=>`<div class="stat"><label>${x[0]}</label><strong class="${i===2?(last.profit<0?'negative':'positive'):''}">${x[1]}</strong><small>${x[2]}</small></div>`).join('');
 $('content').innerHTML=[overview,product,marketing,people,finance,learning][tab]();if(tab===0)drawOffice();
}
function overview(){let pct=clamp(s.totalRevenue/1000000*100,0,100);return `<div class="grid"><div><section class="panel office"><div class="panel-head"><div><small>ONDE TUDO ACONTECE</small><h2 style="margin-top:7px">Primeiro escritório</h2></div><span class="badge">● ${s.ended?'Jornada encerrada':'Portas abertas'}</span></div><canvas id="office" width="900" height="380" aria-label="Escritório animado da empresa"></canvas><div class="office-bottom"><span>⌂ ${s.team.length+1} pessoas construindo o futuro</span><span>Aluguel: R$ 2.000/mês</span></div></section><section class="panel"><div class="panel-head"><h2>O pulso do negócio</h2><span class="badge">Últimos 12 meses</span></div>${s.history.length?`<div class="chart">${s.history.slice(-12).map(h=>`<div style="height:${Math.max(3,h.revenue/Math.max(1,...s.history.slice(-12).map(x=>x.revenue))*100)}%" data-tip="Mês ${h.month}: ${money(h.revenue)}"></div>`).join('')}</div>`:'<p class="muted">Sua história começa com um produto. Desenvolva, lance e acompanhe as primeiras vendas aqui.</p>'}<div class="actions"><button onclick="tab=1;render()">◇ Cuidar do produto</button><button onclick="meeting()">☕ Reunir a equipe · 1 ação</button></div></section></div><div><section class="panel mission"><small>SUA AMBIÇÃO, POR ENQUANTO</small><h2>Do zero ao primeiro milhão.</h2><p>Acumule R$ 1 milhão em receita e construa uma empresa que alguém queira comprar.</p><div class="bar"><i style="width:${pct}%"></i></div><div style="display:flex;justify-content:space-between;font-size:11px"><span>${money(s.totalRevenue)}</span><span>${pct.toFixed(1)}%</span></div></section><section class="panel"><h3>Na sua mesa</h3>${s.logs.slice(0,5).map(l=>`<div class="log">${l.text}<small>MÊS ${l.month+1}</small></div>`).join('')}</section><section class="panel"><small>PRÓXIMA MELHOR DECISÃO</small><p class="muted">${!s.launched?'Invista duas ações em desenvolvimento e lance seu MVP. Cada mês sem vender consome caixa.':s.customers>capacity()?'O suporte está sobrecarregado. Contrate alguém para reduzir cancelamentos.':lastAdvice()}</p></section></div></div>`;}
function lastAdvice(){return s.price>120?'O preço alto aumenta sua margem, mas também dificulta a conversão. Teste e compare os fechamentos.':'Você vende uma assinatura. Qualidade e suporte reduzem cancelamentos; marketing traz novos clientes.';}
function product(){return `<div class="grid"><section class="panel"><div class="panel-head"><div><small>PRODUTO 01 · SOFTWARE B2B</small><h2 style="margin-top:8px">Flow — menos planilhas, mais tempo.</h2></div><span class="badge">${s.launched?'No mercado':'Em desenvolvimento'}</span></div><p class="muted">Uma plataforma de gestão para pequenas empresas. Seu público valoriza facilidade, confiabilidade e um preço justo.</p><div class="row"><span>Qualidade do produto</span><b>${s.quality}/100</b></div><div class="bar"><i style="width:${s.quality}%"></i></div><div class="row"><span>${s.launched?'NPS estimado':'Progresso do MVP'}</span><b>${s.launched?clamp(Math.round(s.quality*.95-20-Math.max(0,s.customers-capacity())*.1),-100,100):s.dev+'/2 etapas'}</b></div><div class="actions"><button class="primary" onclick="develop()">${s.launched?'Melhorar produto':'Desenvolver MVP'} · R$ 3 mil</button>${!s.launched?`<button onclick="launch()" ${s.dev<2?'disabled':''}>Lançar produto →</button>`:''}<button onclick="research()">Ouvir clientes · R$ 500</button></div><p class="muted">Cada decisão usa 1 ação. Desenvolvedores aceleram a qualidade; a motivação afeta a entrega.</p></section><section class="panel"><small>PREÇO · ASSINATURA MENSAL</small><p class="big" id="priceValue">${money(s.price)}</p><input aria-label="Preço mensal" type="range" min="29" max="249" step="5" value="${s.price}" oninput="document.getElementById('priceValue').textContent=money(+this.value)" onchange="setPrice(+this.value)"><p class="muted">Preço de referência do mercado: R$ 89. Custo por cliente: R$ 14. A disposição a pagar cresce com a qualidade.</p><div class="row"><span>Margem por assinatura*</span><b>${money(s.price-14)}</b></div><small>*ANTES DE FOLHA, MARKETING, ALUGUEL E JUROS</small><p class="muted">${s.research?'Pesquisa validada: busca e conteúdo são canais fortes neste mercado. Clientes toleram preços maiores quando a qualidade supera 70.':'Ouça clientes para descobrir pistas sobre o mercado.'}</p></section></div>`;}
function develop(){if(s.quality>=100)return toast('Qualidade máxima atingida.');spend(3000,()=>{s.dev++;s.quality=clamp(s.quality+Math.round((10+s.team.filter(p=>p.role==='Produto').reduce((a,p)=>a+p.level,0)*5)*(s.motivation/100))+(skill('product')?3:0),0,100);s.motivation=clamp(s.motivation-2,0,100);log('O Flow recebeu uma nova entrega. Qualidade agora em '+s.quality+'/100.');});}
function launch(){if(s.dev<2||s.launched)return;spend(0,()=>{s.launched=true;log('O Flow está no ar. Agora você precisa encontrar seus primeiros clientes!');toast('Produto lançado! Feche o mês para medir as vendas.');});}
function setPrice(v){if(v===s.price)return;spend(0,()=>{s.price=v;log('Assinatura reajustada para '+money(v)+'. Observe a conversão no próximo mês.');});render();}
function research(){spend(500,()=>{s.research++;s.quality=clamp(s.quality+3,0,100);if(!meta.knowledge.includes('b2b'))meta.knowledge.push('b2b');log('Clientes B2B pesquisam antes de comprar: busca e conteúdo são fortes. Produto melhor sustenta um preço maior.');toast('Conhecimento registrado para suas próximas empresas.');});}
function marketing(){let h=s.history.at(-1)||{reach:0,leads:0,newCustomers:0};return `<div class="grid"><div class="cards" style="grid-template-columns:1fr">${['Busca paga','Conteúdo & SEO','Redes sociais'].map((n,i)=>`<section class="panel"><div class="panel-head"><h3>${['⌕','✎','◎'][i]} ${n}</h3><span class="badge">${money(s.budgets[i])}/mês</span></div><p class="muted">${['Pessoas com intenção de compra. Leads menores, conversão maior.','Confiança que se acumula. Cresce com o tempo e melhora a retenção.','Muito alcance. Este público B2B converte menos por aqui.'][i]}</p><select aria-label="Orçamento de ${n}" onchange="budget(${i},+this.value)">${[0,500,1500,3000,6000].map(v=>`<option value="${v}" ${s.budgets[i]===v?'selected':''}>${money(v)} por mês</option>`).join('')}</select></section>`).join('')}</div><div><section class="panel"><h2>Da atenção à recorrência</h2><p class="muted">Resultado do último fechamento. O investimento só é cobrado ao fechar o mês.</p><div class="funnel"><div>${h.reach.toLocaleString('pt-BR')}<br><small>ALCANÇADOS</small></div><div>${h.leads}<br><small>CONSIDERANDO</small></div><div>${h.newCustomers}<br><small>NOVOS CLIENTES</small></div><div>${s.customers}<br><small>ATIVOS</small></div></div><div class="row"><span>Investimento mensal</span><b>${money(s.budgets.reduce((a,b)=>a+b,0))}</b></div><p class="muted">Mais verba tem retorno decrescente. Profissionais de Marketing ampliam sua capacidade de execução.</p></section></div></div>`;}
function budget(i,v){if(v===s.budgets[i])return;spend(0,()=>{s.budgets[i]=v;log('Orçamento de marketing atualizado. Novo total: '+money(s.budgets.reduce((a,b)=>a+b,0))+'/mês.');});render();}
const candidates=[{name:'Lia',role:'Produto',salary:4500,color:'#be8066'},{name:'Caio',role:'Marketing',salary:3500,color:'#809ec1'},{name:'Nina',role:'Suporte',salary:2800,color:'#beac5e'}];
function people(){return `<div class="panel"><div class="panel-head"><div><small>CULTURA SE CONSTRÓI TODOS OS DIAS</small><h2 style="margin-top:8px">Gente que faz acontecer.</h2></div><button onclick="meeting()">☕ Reunião · 1 ação</button></div><p class="muted">Motivação: ${s.motivation}%. Abaixo de 35%, há risco de saída. Reuniões e promoções ajudam; sobrecarga e tempo sem cuidado desgastam.</p></div><div class="cards">${s.team.map((p,i)=>`<section class="panel"><div class="icon" style="background:${p.color}55">♙</div><h2>${p.name}</h2><small>${p.role.toUpperCase()} · NÍVEL ${p.level}</small><div class="row"><span>Salário mensal</span><b>${money(p.salary)}</b></div><p class="muted">${p.role==='Produto'?'Acelera entregas e aumenta a qualidade.':p.role==='Marketing'?'Aumenta a eficiência de aquisição em 18%.':'Adiciona capacidade para 110 clientes.'}</p><div class="actions"><button onclick="promote(${i})">Promover</button><button onclick="fire(${i})">Demitir</button></div></section>`).join('')}${candidates.map((p,i)=>`<section class="panel"><small>TALENTO DISPONÍVEL</small><div class="icon" style="margin-top:16px">${icons[i+1]}</div><h2>${p.name}${s.team.some(t=>t.role===p.role)?' Jr.':''}</h2><p>${p.role}</p><p class="muted">${money(p.salary)}/mês · recrutamento ${money(skill('people')?600:1200)}</p><button onclick="hire(${i})">+ Contratar · 1 ação</button></section>`).join('')}</div>`;}
function hire(i){if(s.team.length>=12)return toast('Limite deste escritório: 12 contratações.');spend(skill('people')?600:1200,()=>{s.team.push({...candidates[i],level:1});log(candidates[i].name+' entrou para o time de '+candidates[i].role+'.');});}
function promote(i){spend(0,()=>{let p=s.team[i];p.salary=Math.round(p.salary*1.2);p.level++;s.motivation=clamp(s.motivation+12,0,100);log(p.name+' foi promovido. A equipe valorizou o reconhecimento.');});}
function fire(i){let p=s.team[i];modal(`<h2>Desligar ${p.name}?</h2><p>A rescisão custa ${money(p.salary)}. A motivação da equipe cai 8 pontos.</p><button onclick="closeModal();spend(${p.salary},()=>{s.team.splice(${i},1);s.motivation=clamp(s.motivation-8,0,100);log('Um desligamento mudou o clima da equipe.');})">Confirmar desligamento</button> <button onclick="closeModal()">Voltar</button>`);}
function meeting(){spend(0,()=>{s.motivation=clamp(s.motivation+14,0,100);log(['A equipe recomenda: acompanhe a margem, não apenas o faturamento.','Suporte avisa: acima da nossa capacidade, os clientes cancelam mais.','Marketing lembra: busca paga converte melhor para software B2B.'][s.month%3]);});}

const models=[["🧴","DNVB","produto","físico",400000,[20,40,30,10],[25,50,25]],["⌚","Wearables","produto","físico",650000,[20,35,30,15],[35,45,20]],["⚡","Mobilidade elétrica","produto","físico",300000,[15,35,35,15],[40,45,15]],["☁","SaaS","produto","digital",800000,[20,40,30,10],[20,50,30]],["🎮","Estúdio de jogos","produto","digital",1000000,[40,30,20,10],[15,45,40]],["✦","App de IA","produto","digital",1200000,[30,40,25,5],[25,45,30]],["🏥","Rede de saúde","serviço","presencial",450000,[10,20,35,35],[20,40,40]],["🔋","Rede de recarga","serviço","presencial",250000,[10,25,45,20],[50,40,10]],["🚲","Mobilidade compartilhada","serviço","presencial",700000,[35,35,25,5],[10,45,45]],["💳","Fintech","serviço","digital",1500000,[20,35,30,15],[15,40,45]],["🛍","Marketplace","serviço","digital",1800000,[20,35,30,15],[15,40,45]],["🎓","Edtech","serviço","digital",900000,[30,35,25,10],[15,45,40]]];
const profiles=['Agressivo','Criativo','Analítico','Comercial','Construtor','Operador','Conector','Visionário','Resiliente','Orientado a impacto'];
const modelDescriptions=["Crie uma marca própria e venda produtos físicos direto ao consumidor, começando online.","Crie relógios e dispositivos inteligentes que acompanham saúde, rotina e desempenho.","Desenvolva bicicletas e scooters elétricas para consumidores. Produção e assistência sustentam a expansão.","Ofereça um software de produtividade pessoal por assinatura. Conquiste usuários e faça valer a renovação.","Crie jogos próprios, lance novos títulos e construa uma comunidade de jogadores.","Crie um aplicativo de IA para ajudar pessoas a produzir, estudar ou criar. Cobre por acesso ou uso.","Construa uma rede de atendimento ambulatorial. Expanda unidades mantendo qualidade e confiança.","Opere estações de recarga para motoristas de veículos elétricos e cobre pelo uso.","Opere uma frota de bicicletas ou scooters compartilhadas. Ganhe por viagem ou assinatura.","Ofereça conta digital e pagamentos para pessoas. Cresça com uso recorrente, confiança e segurança.","Conecte compradores a vendedores e receba uma comissão pelas transações. Os dados mostram o lado comprador.","Ofereça aulas online e acompanhamento de aprendizagem por assinatura. Professores e tecnologia trabalham juntos."];
const profileDetails=[["Cresce rápido e enfrenta a concorrência.","Decisão rápida e iniciativa.","Pode consumir caixa cedo demais."],["Encontra soluções e produtos diferentes.","Diferenciação e novas ideias.","Pode dispersar o foco."],["Decide investigando dados e alternativas.","Diagnóstico e controle.","Pode demorar para agir."],["Transforma interesse em negócios.","Vendas e negociação.","Pode prometer além da entrega."],["Transforma ideias em produtos que funcionam.","Execução técnica e qualidade.","Pode deixar vendas em segundo plano."],["Organiza a empresa para entregar bem.","Processos e eficiência.","Pode resistir à experimentação."],["Abre portas construindo relações.","Parcerias e acesso a talentos.","Pode depender demais da sua rede."],["Enxerga oportunidades antes de ficarem óbvias.","Direção e capacidade de inspirar.","Pode subestimar o trabalho cotidiano."],["Aprende, adapta e continua após dificuldades.","Persistência e uso cuidadoso de recursos.","Pode insistir numa aposta ruim."],["Empreende para resolver problemas das pessoas.","Propósito e engajamento.","Pode ter dificuldade com concessões de margem."]];
function profileInfo(){let d=profileDetails[draft.profile];return '<div class="selection-info"><h3>'+profiles[draft.profile]+'</h3><p>'+d[0]+'</p><div class="trait-columns"><div><small>✚ PRÓS</small><p>'+d[1]+'</p></div><div><small>− CONTRAS</small><p>'+d[2]+'</p></div></div><small>Perfil de design · bônus numéricos ainda não ativos.</small></div>';}
function audienceInfo(m){return '<div class="audience"><div class="market-size"><small>◎ TAMANHO DO PÚBLICO</small><h2>'+m[4].toLocaleString('pt-BR')+' pessoas</h2></div><div class="audience-sections"><section><h3>♙ IDADE</h3>'+bars(m[5],['18–24','25–34','35–54','55+'])+'</section><section><h3>◈ RENDA</h3>'+bars(m[6],['A · alta','B · média','C · menor'])+'</section></div><small>Mercado potencial simulado · não são clientes garantidos.</small></div>';}
const capitals=[['🌱','Próprio',12000,'100% seu · sem dívida'],['🤝','Family & friends',35000,'Sem juros · 6 meses de carência'],['🏦','Banco',75000,'2,5% de juros/mês · quite quando puder'],['🚀','Venture capital',150000,'85% seu · metas trimestrais']];
let draft={name:'Alex',company:'Aurora',hair:'#593e50',shirt:'#eb895a',skin:'#f2bd8b',profile:0,model:0,capital:0},step=0;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function avatar(){return `<svg viewBox="0 0 64 80" shape-rendering="crispEdges" class="avatar"><ellipse cx="32" cy="73" rx="22" ry="5" fill="#35263e"/><path d="M20 52h10v20H18v-6h2zm14 0h10v14h3v6H34" fill="#393549"/><path d="M17 32h30v25H17z" fill="${draft.shirt}"/><path d="M11 36h7v21h-7zm35 0h7v21h-7zM19 12h27v23H19z" fill="${draft.skin}"/><path d="M16 8h32v10H22v8h-6z" fill="${draft.hair}"/><path d="M28 22h3v4h-3zm12 0h3v4h-3z" fill="#34283e"/><path d="M32 30h8v2h-8z" fill="#a76568"/></svg>`;}
function shell(body){closeModal();let el=$('creation');if(!el){el=document.createElement('div');el.id='creation';document.body.appendChild(el);}el.innerHTML=body;}
function titleScreen(){shell(`<div class="title-screen"><small>UM SIMULADOR DE RECOMEÇOS</small><h1>the<br><em>founder.</em></h1>${avatar()}<p>Uma ideia. Uma chance. Seu próximo começo.</p><button class="primary" onclick="step=0;creator()">▶ NOVA JORNADA</button>${s.founder||s.month>0?'<button onclick="document.getElementById(\'creation\').remove();render()">CONTINUAR</button>':''}<small>PROTÓTIPO 0.4 · PIXEL OFFICE</small></div>`);}
function chips(key,colors){return colors.map(col=>`<button aria-label="${key} ${col}" class="swatch ${draft[key]===col?'selected':''}" style="background:${col}" onclick="draft.${key}='${col}';creator()"></button>`).join('');}
function bars(vals,labels){return vals.map((v,i)=>`<div class="aud-row"><span>${labels[i]}</span><div><i style="width:${v}%;background:${['#f4ba69','#9bcda1','#b99edb','#e895a5'][i%4]}"></i></div><b>${v}%</b></div>`).join('');}
function creator(){let m=models[draft.model];shell(`<div class="creator"><div class="creator-head"><button onclick="titleScreen()">← Início</button><span>${['FOUNDER','EMPRESA','CAPITAL'].map((x,i)=>`<b class="${step===i?'current':''}">${i+1} ${x}</b>`).join('')}</span></div><div class="creation-grid"><aside class="portrait">${avatar()}<h2>${esc(draft.name)}</h2><p>${profiles[draft.profile]}</p><div class="sign">${esc(draft.company)}</div></aside><section class="choices">${step===0?`<h1>Quem vai começar essa história?</h1><label>Nome do founder<input maxlength="24" value="${esc(draft.name)}" oninput="draft.name=this.value"></label><div class="palette"><label>Cabelo</label>${chips('hair',['#593e50','#edb657','#a65335','#dbd6d8','#393447'])}</div><div class="palette"><label>Roupa</label>${chips('shirt',['#eb895a','#6ba8bb','#a48bd3','#83b47b','#e583a3'])}</div><div class="palette"><label>Pele</label>${chips('skin',['#f2bd8b','#d5956b','#a96d4d','#744b3f'])}</div><h3>Seu jeito de empreender</h3><div class="pick-grid">${profiles.map((p,i)=>`<button class="${draft.profile===i?'selected':''}" onclick="draft.profile=${i};creator()">${['⚡','✦','▥','★','⚒','⚙','∞','☀','◆','♥'][i]} ${p}</button>`).join('')}</div>${profileInfo()}`:step===1?`<h1>O que vamos construir?</h1><label>Nome da empresa<input maxlength="28" value="${esc(draft.company)}" oninput="draft.company=this.value"></label><div class="pick-grid">${['produto','serviço'].map(t=>`<button class="${m[2]===t?'selected':''}" onclick="draft.model=${t==='produto'?0:6};creator()">${t==='produto'?'📦 PRODUTO':'🤝 SERVIÇO'}</button>`).join('')}</div>${[m[2]==='produto'?'físico':'presencial','digital'].map(k=>`<h3>${k.toUpperCase()}</h3><div class="pick-grid models">${models.map((x,i)=>x[2]===m[2]&&x[3]===k?`<button class="${draft.model===i?'selected':''}" onclick="draft.model=${i};creator()"><strong>${x[0]}</strong>${x[1]}</button>`:'').join('')}</div>`).join('')}<div class="selection-info"><h3>${m[0]} ${m[1]}</h3><p>${modelDescriptions[draft.model]}</p></div>${audienceInfo(m)}`:`<h1>Como financiar o começo?</h1><div class="capital-grid">${capitals.map((x,i)=>`<button class="${draft.capital===i?'selected':''}" onclick="draft.capital=${i};creator()"><strong>${x[0]} ${x[1]}</strong><b>${money(x[2])}</b><small>${x[3]}</small></button>`).join('')}</div><div class="audience"><h3>${models[draft.model][0]} ${esc(draft.company)} · ${models[draft.model][1]}</h3><p>${draft.capital===1?'Devolução: R$ 1.750/mês, do mês 7 ao 26. Atrasos reduzem confiança.':draft.capital===3?'Investidores avaliam crescimento de receita a cada trimestre. Relacionamento começa em 80/100.':draft.capital===2?'Juros iniciais: R$ 1.875/mês. Amortização pelo caderno financeiro.':'Pouco caixa. Toda decisão conta.'}</p></div>`}<div class="creator-next">${step>0?'<button onclick="step--;creator()">← Voltar</button>':''}<button class="primary" onclick="creationNext()">${step===2?'FUNDAR EMPRESA ▶':'Continuar →'}</button></div></section></div></div>`);}
function creationNext(){if(!draft.name.trim()||!draft.company.trim())return toast('Dê um nome ao founder e à empresa.');if(step<2){step++;creator();return;}if(!s.ended&&(s.month>0||s.founder)){modal('<h2>Começar outra jornada?</h2><p>O save desta empresa será substituído. Seus aprendizados anteriores continuam.</p><button onclick="foundCompany()">Começar</button> <button onclick="closeModal()">Voltar</button>');return;}foundCompany();}
function foundCompany(){closeModal();s=fresh(draft.company.trim());s.founder={...draft};s.business=draft.model;s.capital=draft.capital;s.cash=capitals[draft.capital][2];s.debt=draft.capital===2?s.cash:0;s.friendsDebt=draft.capital===1?s.cash:0;s.trust=80;s.equity=draft.capital===3?.85:1;s.target=0;s.actions=4;tab=0;save();$('creation').remove();render();}
newCompany=function(){step=0;creator();};
const baseProduct=product;
product=function(){let m=models[s.business??3];return baseProduct().replace('PRODUTO 01 · SOFTWARE B2B',`${m[2].toUpperCase()} · ${m[1].toUpperCase()}`).replace('Flow — menos planilhas, mais tempo.',`${m[0]} Sua primeira oferta`).replace('Uma plataforma de gestão para pequenas empresas. Seu público valoriza facilidade, confiabilidade e um preço justo.','Desenvolva sua oferta, encontre seu público e ajuste o preço.').replace('ASSINATURA MENSAL','PREÇO POR CLIENTE / MÊS')+`<section class="panel"><h3>◎ Público-alvo · ${m[4].toLocaleString('pt-BR')} potenciais</h3><div class="pick-grid">${(m[7]||['18–24','25–34','35–54','55+']).map((v,i)=>`<button class="${(s.target||0)===i?'selected':''}" onclick="spend(0,()=>{s.target=${i}})">${v} · ${m[5][i]}%</button>`).join('')}</div>${audienceInfo(m)}<p class="muted">O segmento escolhido altera aquisição. Renda afeta tolerância ao preço. A demo usa uma operação mensal simplificada para todos os modelos.</p></section>`;};
function marketFactor(){if(s.business===undefined)return 1;let m=models[s.business],share=m[5][s.target||0]/100;return Math.min(2,Math.sqrt(m[4]*share/25000))*Math.max(.1,1-s.customers/Math.max(1,m[4]*share));}
function buyingPower(){if(s.business===undefined)return 1;let a=models[s.business][6];return (a[0]*1.6+a[1]+a[2]*.65)/100;}
const baseAdvance=advance;
advance=function(){if(s.ended)return;let before=s.month;baseAdvance();if(s.month===before)return;if(s.capital===1&&s.month>6&&s.friendsDebt>0){let due=Math.min(1750,s.friendsDebt);if(s.cash>=due){s.cash-=due;s.friendsDebt-=due;log('Parcela aos amigos: '+money(due));}else{s.trust=Math.max(0,s.trust-15);log('Parcela atrasada. Confiança dos amigos: '+s.trust);}}if(s.capital===3&&s.month%3===0){let prior=s.history.at(-4)?.revenue||0,now=s.history.at(-1).revenue;s.trust=clamp(s.trust+(now>prior*1.2?8:-15),0,100);log('Investidores: confiança '+s.trust+'/100.');}save();render();if($('modal').open)$('modalBody').innerHTML+=`<p>Caixa após financiamento: ${money(s.cash)}${s.capital===1||s.capital===3?' · Confiança: '+s.trust+'/100':''}</p>`;};
const baseFinance=finance;
finance=function(){return baseFinance()+`<section class="panel"><h3>Capital: ${capitals[s.capital||0][1]}</h3><p>Sua participação: ${Math.round((s.equity??1)*100)}%${s.friendsDebt?' · Saldo com amigos: '+money(s.friendsDebt):''}${s.capital===1||s.capital===3?' · Confiança: '+s.trust+'/100':''}</p></section>`;};
titleScreen();
