/* Tema 0.51 — interface do quarto vetorial.
   Camada final: troca a aparência pixel (fonte monoespaçada, bordas duras) por cartões
   arredondados, tipografia sem serifa e a paleta da cena. Não muda layout nem regras. */
:root{
 --q-ink:#241d33;--q-ink-soft:#5b5470;--q-paper:#fff7ea;--q-card:#fffdf8;--q-line:#eadbc4;--q-line-strong:#d9c4a3;
 --q-accent:#f2a93b;--q-accent-d:#c47d1f;--q-accent-dd:#9c5f14;--q-good:#2f8a5f;--q-bad:#c2453f;
 --q-navy:#1b1d31;--q-navy2:#24273f;--q-navy3:#2f3352;--q-cream:#f6efe2;
 --q-font:"Nunito","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
 --q-radius:16px;--q-shadow:0 18px 40px rgba(10,8,25,.38),0 3px 0 rgba(10,8,25,.12);
}
body{background:var(--q-navy)!important;color:var(--q-ink)}
#game,#game *,#dice-modal,#dice-modal *,#weekly-modal,#weekly-modal *,#launch-results,#launch-results *,#social-modal,#social-modal *,#knowledge-book,#knowledge-book *,#toast,#notice{font-family:var(--q-font)!important;letter-spacing:normal}
#game{background:var(--q-navy)}

/* barra superior */
.top{background:linear-gradient(180deg,var(--q-navy2),#1f2238)!important;border-bottom:1px solid var(--q-navy3)!important;box-shadow:0 4px 18px rgba(0,0,0,.25);color:var(--q-paper)!important}
.top .brand{color:var(--q-paper)!important;font-weight:900!important;letter-spacing:.02em!important}
.top .brand span{color:var(--q-accent)!important;font-weight:800!important;letter-spacing:.08em!important}
.top-company{color:var(--q-paper)!important;font-weight:800}
.cash b,#cash{color:#8ff0bf!important;font-weight:900}
.time button,.top button{background:var(--q-navy3)!important;color:var(--q-paper)!important;border:1px solid #3d4266!important;border-radius:10px!important;box-shadow:0 2px 0 rgba(0,0,0,.35)!important;font-weight:800!important}
.time button.selected,.time button[aria-pressed=true]{background:var(--q-accent)!important;color:var(--q-ink)!important;border-color:var(--q-accent-d)!important}
.day-clock{background:var(--q-navy3)!important;border-color:var(--q-paper)!important}

/* cena */
.guide,.guide h1,.guide p{color:var(--q-paper)!important;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.guide>span{color:var(--q-accent)!important;font-weight:800!important;letter-spacing:.08em!important}
.guide h1{font-weight:900!important}
.speech,#notice,#toast{background:var(--q-paper)!important;color:var(--q-ink)!important;border:0!important;border-radius:14px!important;box-shadow:var(--q-shadow)!important}

/* botões */
#game button,.modal-actions button,.dice-popup button,.week-sheet button,#launch-results button,.nexus-app button,.knowledge-book-panel button{border-radius:12px!important;font-weight:800!important;transition:transform .12s,box-shadow .12s,background .12s,border-color .12s}
#tray button,#workshop-info button,#work-order button,.dice-popup button,.week-sheet button,#launch-results button,.nexus-app button,.knowledge-book-panel button,.product-book button{background:var(--q-card)!important;color:var(--q-ink)!important;border:1.5px solid var(--q-line-strong)!important;box-shadow:0 3px 0 var(--q-line-strong)!important}
#game button.primary,button.primary{background:var(--q-accent)!important;border-color:var(--q-accent-d)!important;color:var(--q-ink)!important;box-shadow:0 4px 0 var(--q-accent-dd)!important}
#game button.secondary,button.secondary{background:#eef4ea!important;border-color:#b8cdb0!important;color:#2f4a3a!important;box-shadow:0 3px 0 #a9bfa1!important}
#game button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--q-accent)!important}
#game button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--q-line-strong)!important}
#game button:disabled{opacity:.5}

/* painéis */
#tray,#workshop-info .workshop-info-panel,#work-order,.dice-popup,.knowledge-book-panel,.week-sheet,#launch-results>*,.nexus-app,#product-overview,.product-book{
 background:var(--q-paper)!important;color:var(--q-ink)!important;border:0!important;border-radius:var(--q-radius)!important;box-shadow:var(--q-shadow)!important}
#tray .choice,.path-choice,.venue-card,.knowledge-card,.recap-card,.growth-card,.material-row,.product-account,.nexus-post{
 background:var(--q-card)!important;border:1.5px solid var(--q-line)!important;border-radius:14px!important;box-shadow:0 3px 0 var(--q-line)!important;color:var(--q-ink)!important}
#tray .choice:hover:not(:disabled),.path-choice:hover:not(:disabled),.venue-card:hover:not(:disabled){border-color:var(--q-accent)!important;box-shadow:0 3px 0 var(--q-accent)!important}
#tray .choice.selected,.venue-card.selected,.path-choice.selected{border-color:var(--q-accent)!important;background:#fff1d9!important}
#tray h1,#tray h2,#tray h3,.workshop-info-panel h2,.dice-popup h2,.week-sheet h2,.nexus-app h2,.product-book h2{color:var(--q-ink)!important;font-weight:900!important;letter-spacing:-.01em!important}
#tray small,#tray .muted,.tray-head small,.creation-title small{color:var(--q-ink-soft)!important;letter-spacing:.06em}
.creation-route span{border-radius:999px!important}
.creation-route .active{background:var(--q-accent)!important;color:var(--q-ink)!important}
.progress,.life-progress,.growth-meter{border-radius:999px!important;overflow:hidden}
.attribute-pips i{border-radius:4px!important}
.attribute-pips i.filled{background:var(--q-accent)!important;border-color:var(--q-accent-d)!important}
.positive{color:var(--q-good)!important}.negative{color:var(--q-bad)!important}
input,select{border-radius:10px!important;border:1.5px solid var(--q-line-strong)!important;background:#fff!important;color:var(--q-ink)!important;font-family:var(--q-font)!important}

/* modais com fundo escurecido */
#dice-modal,#weekly-modal,#launch-results,#social-modal,#knowledge-book{background:rgba(15,16,32,.62)!important;backdrop-filter:blur(3px)}

/* navegação inferior */
.workshop-nav{background:linear-gradient(0deg,var(--q-navy2),#1f2238)!important;border-top:1px solid var(--q-navy3)!important}
.workshop-nav button{background:transparent!important;color:var(--q-cream)!important;border:0!important;border-radius:12px!important;box-shadow:none!important;font-weight:800!important;margin:6px 3px!important}
.workshop-nav button:hover:not(:disabled){background:var(--q-navy3)!important}
.workshop-nav button.active{background:var(--q-accent)!important;color:var(--q-ink)!important}
.stock-hud{color:var(--q-cream)!important;font-weight:800}

/* Nexus (rede social) */

  const reports=g.weekly.reports;

  const legend='<div class="week-legend">Receita <i></i> Custos <i></i> Resultado <i></i> Caixa <i></i></div>';
  return legend+reports.map(r=>'<div class="week-chart"><b>S'+r.number+'</b>'+['revenue','costs','result','cashEnd'].map(key=>
   '<div class="week-bar '+key+'" title="'+money(r[key])+'"><i style="width:'+Math.abs(r[key])/max*100+'%"></i><span>'+money(r[key])+'</span></div>').join('')+(r.audience===undefined?'':'<small class="growth-week">'+r.audience.toLocaleString('pt-BR')+' na audiência · reputação '+Math.round(r.reputation)+'/100</small>')+'</div>').join('');
 }

   };

    '</section><section><h3>Caixa</h3><div>Saldo inicial <b>'+money(r.cashStart)+'</b></div><div>Recebimentos <b>'+money(r.inflow)+'</b></div><div>Pagamentos <b>'+money(r.outflow)+'</b></div>'+
    '<div class="week-cash-end">Saldo final <b>'+money(r.cashEnd)+'</b></div></section></div>'+

 function mixLegend(mix){
  return mix.map((value,i)=>'<span style="border-color:'+channelColors[i]+'">'+C.Reach.channels[i]+' '+value+'%</span>').join(' ');
 }
 function normalizeMix(weights){
  const total=weights.reduce((sum,v)=>sum+v,0);
  if(!total)return C.Reach.defaultMix();
  const shares=weights.map(v=>100*v/total);
  const mix=shares.map(Math.floor);
  const order=shares.map((v,i)=>({i,remainder:v-mix[i]})).sort((a,b)=>b.remainder-a.remainder);
  const missing=100-mix.reduce((sum,v)=>sum+v,0);
  for(let i=0;i<missing;i++)mix[order[i].i]++;
  return mix;
 }
