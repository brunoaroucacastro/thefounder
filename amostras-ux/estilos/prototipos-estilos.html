<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Founder · 5 estilos de interface</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#15121e}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0e0c14;color:#ddd;border-bottom:1px solid #2a2535}
.top b{white-space:nowrap;font:700 12px Inter;letter-spacing:.08em;color:#ffd166;margin-right:8px}
.top button{white-space:nowrap;font:600 11px Inter;background:#221d2e;color:#cfc8de;border:1px solid #3a3350;padding:6px 10px;cursor:pointer;border-radius:6px}
.top button.on{background:#ffd166;color:#1d1729;border-color:#ffd166}
.top .sep{width:1px;height:26px;background:#3a3350;margin:0 6px}
.top small{white-space:nowrap;margin-left:auto;color:#8d84a5;font-size:11px}
.stage{position:absolute;inset:52px 0 0 0;overflow:hidden}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
/* fundo de "mundo" atrás das janelas */
.bg-farm{background:repeating-linear-gradient(90deg,#c98b52 0 34px,#bf8048 34px 36px),#c98b52}
.bg-zoo{background:radial-gradient(circle at 20% 30%,#4f8f3a 0 60px,transparent 61px),radial-gradient(circle at 80% 70%,#4f8f3a 0 80px,transparent 81px),repeating-linear-gradient(45deg,#6fa84a 0 18px,#67a044 18px 36px)}
.bg-startup{background:linear-gradient(135deg,#d9c3a3,#c7ab86)}
.bg-dispatch{background:radial-gradient(ellipse at center,#1b3a3a,#0b1517 70%)}
.bg-mgt{background:linear-gradient(#7fc3e8,#cfe9f6)}
</style>
</head>
<body>
<div class="top"><b>THE FOUNDER · ESTILOS</b><span id="themes"></span><span class="sep"></span><span id="screens"></span><small id="ref"></small></div>
<div class="stage" id="stage"></div>
<script>
// ---------------- dados (os mesmos para os 5 estilos) ----------------
const ATTR=[{id:'q',n:'Qualidade',i:'✦',c:'#cc79a7',v:3},{id:'d',n:'Durabilidade',i:'⛨',c:'#0072b2',v:4},{id:'p',n:'Desempenho',i:'⚡',c:'#d55e00',v:2},{id:'r',n:'Praticidade',i:'✋',c:'#009e73',v:1},{id:'v',n:'Versatilidade',i:'⇄',c:'#56b4e9',v:0},{id:'e',n:'Economia',i:'$',c:'#e69f00',v:3}];
const AC=Object.fromEntries(ATTR.map(a=>[a.id,a]));
const PERS=[{n:'Clara',age:'25 a 34',job:'Trabalha em escritório aberto',col:'#5c96c5',hair:'#59414b',skin:'#e7b48f',q:'No escritório aberto ninguém fala baixo. Preciso sumir do barulho.',c:['Tem que ser <b>gostoso de usar</b>, não um aperto.','Uso <b>no computador e no celular</b>.','<b>Não me importo se não durar anos</b>.'],stats:[4,2,5,3,2],budget:'R$ 220'},
 {n:'Seu Jorge',age:'55+',job:'Ouve rádio e podcast o dia todo',col:'#de8b55',hair:'#cfcfcf',skin:'#d79a72',q:'Quero apertar um botão e ouvir meu programa. Sem mexer em aplicativo.',c:['Quero um que <b>aguente</b>.','<b>Não pode ser caro</b>.','<b>Não me importo com acabamento</b>.'],stats:[2,5,1,4,4],budget:'R$ 120'}];
// grade do produto 5x4: célula -> atributo ('' vazio, 'x' bloqueado, '*' estrela)
const GRID=['dd e*','ddqqe','pp qe','x r  '].map(r=>r.split(''));
const OFFER=[{t:'Comum',s:['##'],a:'v',pts:1},{t:'Incomum',s:['##','##'],a:'p',pts:2},{t:'Rara',s:['##.','.##','..#'],a:'q',pts:3}];
// tabuleiro 6x6: c comum, p persona, e viraliza, d cancela, m promotor, x concorrente; h = alcançado
const BOARD=['c c p c e c','c h h h c d','p h h h c c','c h h h m c','e c c x x c','c c d x x p'].map(r=>r.split(' '));
const CARDS=[{n:'Influenciador',d:'Área 3×3',e:2,sh:[[1,1],[2,1],[3,1],[1,2],[2,2],[3,2],[1,3],[2,3],[3,3]],on:true},{n:'Assessoria',d:'Linha inteira',e:1,sh:[[0,2],[1,2],[2,2],[3,2],[4,2]]},{n:'Outdoor',d:'Coluna inteira',e:1,sh:[[2,0],[2,1],[2,2],[2,3],[2,4]]},{n:'Vídeo de cliente',d:'Área 2×2',e:1,sh:[[1,1],[2,1],[1,2],[2,2]]}];
const KIND={c:['','#3b3355'],h:['','#7b5cd6'],p:['★','#f2c230'],e:['✶','#3a86ff'],d:['✕','#e0453b'],m:['♥','#e0457b'],x:['','#555']};
// ---------------- peças reutilizáveis ----------------
function face(p,px=6){const H=p.hair,S=p.skin,K='#2b2238',C=p.col;const M=['..HHHH..','.HHHHHH.','.HSSSSH.','.SKSSKS.','.SSSSSS.','..SKKS..','.CCCCCC.','CCCCCCCC'];let r='';M.forEach((row,y)=>[...row].forEach((ch,x)=>{const f={H,S,K,C}[ch];if(f)r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+f+'"/>';}));return '<svg viewBox="0 0 8 8" width="'+px*8+'" height="'+px*8+'" shape-rendering="crispEdges">'+r+'</svg>';}
function shapeGrid(s,col,cell=14,gap=2){const w=Math.max(...s.map(r=>r.length));return '<span class="shp" style="display:inline-grid;grid-template-columns:repeat('+w+','+cell+'px);gap:'+gap+'px">'+s.flatMap(r=>[...r.padEnd(w,'.')].map(ch=>'<i style="width:'+cell+'px;height:'+cell+'px;'+(ch==='#'?'background:'+col+';box-shadow:inset 0 0 0 1.5px #0004':'')+'"></i>')).join('')+'</span>';}
function cardShape(c,col='#7b5cd6',cell=7){const set=new Set(c.sh.map(q=>q.join()));let o='';for(let y=0;y<5;y++)for(let x=0;x<5;x++)o+='<i style="width:'+cell+'px;height:'+cell+'px;background:'+(set.has(x+','+y)?col:'#0001')+'"></i>';return '<span style="display:inline-grid;grid-template-columns:repeat(5,'+cell+'px);gap:1px">'+o+'</span>';}
function radar(vals,labels,size,stroke,fill,grid,txt,font){const n=vals.length,c=size/2,R=size/2-34,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*v/5;return[(c+r*Math.cos(a)).toFixed(1),(c+r*Math.sin(a)).toFixed(1)];};let o='';for(let k=1;k<=5;k++)o+='<polygon points="'+vals.map((_,i)=>pt(i,k).join(',')).join(' ')+'" fill="none" stroke="'+grid+'" stroke-width="1"/>';vals.forEach((_,i)=>{const [x,y]=pt(i,5);o+='<line x1="'+c+'" y1="'+c+'" x2="'+x+'" y2="'+y+'" stroke="'+grid+'"/>';const [lx,ly]=pt(i,6.3);o+='<text x="'+lx+'" y="'+ly+'" fill="'+txt+'" font-family="'+font+'" font-size="11" text-anchor="middle" dominant-baseline="middle">'+labels[i]+'</text>';});o+='<polygon points="'+vals.map((v,i)=>pt(i,v).join(',')).join(' ')+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>';return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+o+'</svg>';}
const gridCells=(cell,css)=>GRID.flatMap(r=>r.map(ch=>{const a=AC[ch];return '<i class="gc'+(ch==='x'?' dead':ch==='*'?' star':a?' on':'')+'" style="width:'+cell+'px;height:'+cell+'px;'+(a?'background:'+a.c:'')+'">'+(a?a.i:ch==='*'?'★':'')+'</i>';})).join('');
const boardCells=(cell)=>BOARD.flatMap(r=>r.map(k=>'<i class="bc k-'+k+'" style="width:'+cell+'px;height:'+cell+'px;background:'+KIND[k][1]+'">'+KIND[k][0]+'</i>')).join('');

// =====================================================================
// 1) FAZENDA · pergaminho, moldura de madeira, faixas de título, slots de inventário
// =====================================================================
const FARM=`
.farm{font-family:'Pixelify Sans',monospace;color:#5b2d0c}
.farm .win{background:#f9d9a0;border:6px solid #b2581c;box-shadow:inset 0 0 0 3px #e9a04f,0 0 0 4px #6b2e09,0 10px 0 4px #00000040;border-radius:4px;padding:18px 20px;position:relative}
.farm .ribbon{display:inline-block;background:#f4cc8a;border:3px solid #a8541b;box-shadow:inset 0 0 0 2px #fbe0b0;padding:4px 22px;font:700 22px 'Pixelify Sans';color:#5b2d0c;position:relative}
.farm .ribbon::before,.farm .ribbon::after{content:'';position:absolute;top:6px;width:14px;height:22px;background:#e6b06a;border:3px solid #a8541b}
.farm .ribbon::before{left:-16px;border-right:0}.farm .ribbon::after{right:-16px;border-left:0}
.farm h3{font:700 20px 'Pixelify Sans';margin:6px 0;color:#7a3612;text-shadow:1px 1px 0 #fbe0b0}
.farm .frame{background:#e9a04f;border:4px solid #8f4314;box-shadow:inset 0 0 0 3px #f6c27a;padding:10px}
.farm .slot{width:46px;height:46px;background:#f6c98a;border:3px solid #c3762f;box-shadow:inset 2px 2px 0 #fbe2b5;display:grid;place-items:center}
.farm .slot.sel{border-color:#d22;box-shadow:inset 0 0 0 2px #ff8a8a}
.farm .gc{display:grid;place-items:center;color:#fff;font-size:20px;border:2px solid #c3762f;background:#f6c98a}
.farm .gc.on{border-color:#5b2d0c;text-shadow:1px 1px 0 #0006}.farm .gc.dead{background:#8f4314}.farm .gc.star{color:#c3762f}
.farm .tip{background:#f6c98a;border:4px solid #b2581c;box-shadow:inset 0 0 0 2px #fbe0b0;padding:8px 10px;font-size:15px}
.farm .tip .cat{color:#d1137a}
.farm .heart{color:#d22;font-size:18px;letter-spacing:1px}
.farm .btn{background:#e98e3a;border:3px solid #6b2e09;box-shadow:inset 0 -4px 0 #b2581c,inset 0 2px 0 #f6c27a;color:#fff;font:700 18px 'Pixelify Sans';padding:8px 18px;text-shadow:1px 1px 0 #6b2e09}
.farm .bc{display:grid;place-items:center;color:#fff;font-size:16px;border:2px solid #6b2e09}
.farm .card{background:#f6c98a;border:4px solid #b2581c;box-shadow:inset 0 0 0 2px #fbe0b0;padding:8px;width:120px;text-align:center}
.farm .card.on{border-color:#d22}
.farm .bar{height:14px;background:#c3762f;border:2px solid #6b2e09}.farm .bar i{display:block;height:100%;background:#7cd44f;border-right:2px solid #3f8a1f}
`;
function farmPersona(){return '<div class="win" style="width:1100px"><div style="text-align:center"><span class="ribbon">Pesquisa de Mercado</span></div><h3 style="text-align:center">Para quem você vai criar?</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:10px">'+PERS.map((p,k)=>'<div style="display:grid;grid-template-columns:150px 1fr;gap:14px"><div class="frame" style="text-align:center"><div style="background:#7ac0e8;border:3px solid #8f4314;display:inline-block;padding:6px">'+face(p,9)+'</div><div class="ribbon" style="font-size:18px;margin-top:8px;padding:2px 14px">'+p.n+'</div><div class="heart" style="margin-top:6px">♥♥♥♡♡</div><div style="margin-top:4px;font-size:14px">'+p.age+' anos</div></div><div><div class="tip"><b style="font-size:17px">'+p.job+'</b><div class="cat">Persona</div><div style="margin-top:6px">“'+p.q+'”</div></div><div style="margin-top:10px;display:grid;gap:6px">'+p.c.map((c,i)=>'<div class="tip" style="padding:5px 8px;font-size:14px">'+['🗨','🗨','🗨'][i]+' “'+c+'”</div>').join('')+'</div><div style="text-align:right;margin-top:10px"><span class="btn">'+(k?'Escolher ✓':'Escolher ✓')+'</span></div></div></div>').join('')+'</div></div>';}
function farmProduto(){return '<div class="win" style="width:1180px"><div style="text-align:center"><span class="ribbon">Bancada de Criação</span></div><div style="display:grid;grid-template-columns:220px 1fr 280px;gap:18px;margin-top:14px"><div class="frame" style="text-align:center"><div style="background:#7ac0e8;border:3px solid #8f4314;display:inline-block;padding:6px">'+face(PERS[0],9)+'</div><div class="ribbon" style="font-size:17px;margin-top:8px;padding:2px 12px">Clara</div><div style="font-size:14px;margin-top:8px;text-align:left">“Preciso sumir do barulho.”</div></div><div style="text-align:center"><div class="frame" style="display:inline-block"><div style="display:grid;grid-template-columns:repeat(5,64px);gap:3px">'+gridCells(64)+'</div></div><div style="display:flex;gap:10px;justify-content:center;margin-top:14px">'+OFFER.map((o,i)=>'<div class="slot'+(i===1?' sel':'')+'" style="width:96px;height:96px;flex-direction:column">'+shapeGrid(o.s,AC[o.a].c,14,2)+'<small style="font-size:13px">'+AC[o.a].i+' +'+o.pts+'</small></div>').join('')+'<div class="slot" style="width:60px;height:96px;font-size:22px">↻</div><div class="slot" style="width:60px;height:96px;font-size:22px">⇄</div></div></div><div><div class="tip"><b style="font-size:18px">Fone Aurora</b><div class="cat">Fone de ouvido</div><div style="margin-top:6px;display:grid;gap:5px">'+ATTR.map(a=>'<div style="display:grid;grid-template-columns:22px 1fr 70px;gap:6px;align-items:center;font-size:14px"><span style="color:'+a.c+'">'+a.i+'</span>'+a.n+'<span class="heart" style="font-size:13px">'+'♥'.repeat(a.v)+'<span style="opacity:.25">'+'♥'.repeat(5-a.v)+'</span></span></div>').join('')+'</div><div style="margin-top:8px">🪙 Custo: R$ 35 a R$ 49</div></div><div style="text-align:right;margin-top:12px"><span class="btn">Pronto!</span></div></div></div></div>';}
function farmMkt(){return '<div class="win" style="width:1180px"><div style="text-align:center"><span class="ribbon">Campanha · Fone Aurora</span></div><div style="display:grid;grid-template-columns:auto 1fr;gap:22px;margin-top:14px"><div class="frame"><div style="display:grid;grid-template-columns:repeat(6,58px);gap:3px">'+boardCells(58)+'</div></div><div><div class="tip" style="display:flex;gap:18px;font-size:17px"><span>Alcance <b>32%</b></span><span>★ <b>2/3</b></span><span>Energia <b>⚡⚡⚡</b>⚡</span></div><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">'+CARDS.map(c=>'<div class="card'+(c.on?' on':'')+'">'+cardShape(c,'#b2581c',9)+'<div style="font-weight:700;margin-top:4px">'+c.n+'</div><small>'+c.d+'</small><div>'+'⚡'.repeat(c.e)+'</div></div>').join('')+'</div><div class="tip" style="margin-top:14px;font-size:14px">Mural: <b>Influenciador</b> → <b>Assessoria</b></div><div style="text-align:right;margin-top:14px"><span class="btn">Lançar!</span></div></div></div></div>';}

// =====================================================================
// 2) ZOO · painel marrom chapado, título grande, seções creme, tabela com colunas coloridas, − / + e régua
// =====================================================================
const ZOO=`
.zoo{font-family:'Silkscreen',monospace;color:#5a3d2b}
.zoo .win{background:#a87a54;border-radius:6px;padding:12px;box-shadow:0 8px 0 #0003}
.zoo .hd{display:flex;align-items:center;justify-content:space-between;color:#fff8ec;font:700 26px 'Silkscreen';padding:4px 8px 12px}
.zoo .x{background:#e0453b;color:#fff;width:32px;height:32px;border:2px solid #fff;display:grid;place-items:center;font:700 18px Inter}
.zoo .sec{background:#f6efe2;border-radius:4px;padding:12px}
.zoo .sec2{background:#fffaf0;border-radius:4px;padding:10px;border:3px solid #d9c6a6}
.zoo .lbl{font-size:11px;color:#8a6e57;letter-spacing:.04em}
.zoo .big{font:700 34px 'Silkscreen';color:#5a3d2b}
.zoo .pm{display:inline-grid;place-items:center;width:28px;height:28px;color:#fff;font:700 18px Inter;border:2px solid #fff;box-shadow:0 0 0 2px #2e7d32;background:#43a047}
.zoo .pm.m{background:#43a047}
.zoo .track{height:14px;background:linear-gradient(90deg,#f0a83a 0 60%,#64c3e8 60%);border:2px solid #5a3d2b;position:relative}
.zoo .knob{position:absolute;top:-6px;width:20px;height:22px;background:#c8f25a;border:2px solid #4a6b10}
.zoo .tag{background:#f7e2a0;border:2px solid #d9b766;padding:4px 10px;font-size:12px;text-align:center}
.zoo table{width:100%;border-collapse:collapse;font-size:12px}
.zoo th{background:#8a5f3e;color:#fff8ec;padding:6px;font-weight:400}.zoo td{background:#7a5232;color:#fff8ec;text-align:center;padding:10px 6px}
.zoo th.g,.zoo td.g{background:#8ed08b;color:#2c4a2a}.zoo th.b,.zoo td.b{background:#7fa6d9;color:#1f3550}
.zoo .gc{display:grid;place-items:center;color:#fff;font-size:18px;background:#e8dcc4;border:2px solid #fffaf0}.zoo .gc.dead{background:#a08a70}.zoo .gc.star{color:#d9b766}
.zoo .bc{display:grid;place-items:center;color:#fff;font-size:14px;border:2px solid #f6efe2}
.zoo .btn{background:#43a047;color:#fff;border:3px solid #fff;box-shadow:0 0 0 3px #2e7d32;padding:8px 18px;font:700 14px 'Silkscreen'}
.zoo .btn.gray{background:#b9ad9c;box-shadow:0 0 0 3px #8a7c69}
.zoo .stars{color:#f2b600;font-size:16px}
`;

.mgt .dots{display:flex;gap:4px;align-items:center}.mgt .dots i{width:14px;height:14px;border-radius:50%;border:1px solid #5a6b7d;background:#fff}.mgt .dots i.on{background:#5a6b7d}
`;
const slider=(v,max=5)=>'<div class="rs"><i style="width:'+v/max*100+'%"></i><b style="left:calc('+v/max*100+'% - 11px)"></b></div>';
function mgtPersona(){return '<div class="win" style="width:1000px"><div class="tb">👥 Pesquisa de mercado<span class="x">✕</span></div><div style="padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px">'+PERS.map(p=>'<div><div class="sh">'+p.n+' · '+p.age+' anos</div><div class="sb" style="display:grid;grid-template-columns:90px 1fr;gap:12px"><div style="background:#dfe6ee;border:1px solid #9aaabd;border-radius:6px;display:grid;place-items:center;height:96px">'+face(p,9)+'</div><div><b>'+p.job+'</b><div style="font-size:13px;margin-top:4px">“'+p.q+'”</div></div></div><div class="sh">O que ela/ele disse</div><div class="sb" style="font-size:13px;display:grid;gap:6px">'+p.c.map((c,i)=>'<div><span class="num" style="min-width:26px">'+(i+1)+'</span> “'+c+'”</div>').join('')+'</div><div class="sh">Perfil</div><div class="sb" style="display:grid;gap:8px">'+['Qualidade','Durabilidade','Desempenho','Praticidade','Versatilidade'].map((n,i)=>'<div style="display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:13px">'+n+slider(p.stats[i])+'</div>').join('')+'</div></div>').join('')+'</div><div style="display:flex;align-items:center;gap:10px;padding:0 14px 14px"><span class="num">R$ 24.000</span><div class="dots" style="margin:0 auto"><i></i><i class="on"></i><i></i></div><span class="rb">🔍</span><span class="ok">✓</span></div></div>';}
function mgtProduto(){return '<div class="win" style="width:1080px"><div class="tb">⌨ Fone Aurora<span class="x">✕</span></div><div style="padding:0 14px 14px;display:grid;grid-template-columns:auto 1fr;gap:14px"><div><div class="sh">Planta · NV 4</div><div class="sb"><div style="display:grid;grid-template-columns:repeat(5,58px);gap:3px">'+gridCells(58)+'</div></div><div class="sh">Peças</div><div class="sb" style="display:flex;gap:8px">'+OFFER.map(o=>'<div style="width:92px;text-align:center;border:1px solid #b8c7d6;border-radius:6px;padding:6px;background:#f5f8fb"><small style="font-weight:700;color:'+(o.t==='Rara'?'#2f7fc4':o.t==='Incomum'?'#2e9d3a':'#6c7a8a')+'">'+o.t+'</small><div style="margin:6px 0">'+shapeGrid(o.s,AC[o.a].c,12,2)+'</div><small>'+AC[o.a].i+' +'+o.pts+'</small></div>').join('')+'<span class="rb">↻</span><span class="rb">⇄</span><span class="rb">◐</span></div></div><div><div class="sh">Design focus</div><div class="sb" style="display:grid;gap:10px">'+ATTR.map(a=>'<div style="display:grid;grid-template-columns:70px 120px 1fr;gap:10px;align-items:center;font-size:13px"><span class="num">'+a.v+' <em>['+a.v+']</em></span><span>'+a.i+' '+a.n+'</span>'+slider(a.v)+'</div>').join('')+'</div><div class="sh">Custo</div><div class="sb" style="display:flex;justify-content:space-between;align-items:center"><span>Por unidade</span><span class="num" style="color:#c0392b">R$ 35 a 49</span></div></div></div><div style="display:flex;align-items:center;gap:10px;padding:0 14px 14px"><span class="num">💼 672</span><span class="num" style="color:#c0392b">R$ 20.000</span><div class="dots" style="margin:0 auto"><i></i><i></i><i class="on"></i><i></i></div><span class="rb">📒</span><span class="ok">✓</span></div></div>';}
function mgtMkt(){return '<div class="win" style="width:1080px"><div class="tb">📣 Campanha<span class="x">✕</span></div><div style="padding:0 14px 14px;display:grid;grid-template-columns:auto 1fr;gap:14px"><div><div class="sh">Tabuleiro</div><div class="sb"><div style="display:grid;grid-template-columns:repeat(6,54px);gap:3px">'+boardCells(54)+'</div></div></div><div><div class="sh">Resultado previsto</div><div class="sb" style="display:grid;gap:10px">'+[['Alcance',32,100,'%'],['Personas',2,3,''],['Energia',3,4,'']].map(x=>'<div style="display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;font-size:13px">'+x[0]+slider(x[1],x[2])+'<span class="num">'+x[1]+x[3]+'</span></div>').join('')+'</div><div class="sh">Cartas</div><div class="sb" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+CARDS.map(c=>'<div style="display:flex;gap:10px;align-items:center;border:1px solid '+(c.on?'#2f7fc4':'#b8c7d6')+';border-radius:6px;padding:6px;background:'+(c.on?'#e3f0fb':'#f5f8fb')+'">'+cardShape(c,'#2f7fc4',8)+'<div style="font-size:13px"><b>'+c.n+'</b><br>'+c.d+'<br>'+'⚡'.repeat(c.e)+'</div></div>').join('')+'</div><div class="sh">Prioridade</div><div class="sb" style="display:grid;gap:8px">'+[['Alcance','#2f7fc4',40],['Personas','#e6a23c',35],['Combos','#2e9d3a',25]].map(x=>'<div style="display:grid;grid-template-columns:90px 1fr 50px;gap:10px;align-items:center;font-size:13px">'+x[0]+'<div class="rs" style="background:#eef2f6"><i style="width:'+x[2]+'%;background:'+x[1]+'"></i><b style="left:calc('+x[2]+'% - 11px)"></b></div><b style="color:#2f7fc4">'+x[2]+'%</b></div>').join('')+'</div></div></div><div style="display:flex;align-items:center;gap:10px;padding:0 14px 14px"><span class="num">R$ 1.200</span><div class="dots" style="margin:0 auto"><i></i><i></i><i></i><i class="on"></i></div><span class="ok">✓</span></div></div>';}

// ---------------- montagem ----------------
const THEMES=[
 {id:'farm',n:'1 · Pergaminho e madeira',ref:'Referência: Stardew Valley',bg:'bg-farm',css:FARM,s:[farmPersona,farmProduto,farmMkt]},
 {id:'zoo',n:'2 · Painel chapado e tabela',ref:'Referência: Let\'s Build a Zoo',bg:'bg-zoo',css:ZOO,s:[zooPersona,zooProduto,zooMkt]},
 {id:'startup',n:'3 · App moderno',ref:'Referência: Startup Company',bg:'bg-startup',css:STARTUP,s:[stPersona,stProduto,stMkt]},
 {id:'disp',n:'4 · Dossiê cinematográfico',ref:'Referência: Dispatch',bg:'bg-dispatch',css:DISP,s:[dispPersona,dispProduto,dispMkt]},
 {id:'mgt',n:'5 · Tycoon clássico',ref:'Referência: Mad Games Tycoon',bg:'bg-mgt',css:MGT,s:[mgtPersona,mgtProduto,mgtMkt]}];
const SCREENS=['Persona','Produto','Marketing'];
let T=0,S=0;
const st=document.createElement('style');st.textContent=THEMES.map(t=>t.css).join('\n');document.head.appendChild(st);
function paint(){const t=THEMES[T];document.getElementById('themes').innerHTML=THEMES.map((x,i)=>'<button class="'+(i===T?'on':'')+'" data-t="'+i+'">'+x.n+'</button>').join(' ');document.getElementById('screens').innerHTML=SCREENS.map((x,i)=>'<button class="'+(i===S?'on':'')+'" data-s="'+i+'">'+x+'</button>').join(' ');document.getElementById('ref').textContent=t.ref;
 const stage=document.getElementById('stage');stage.innerHTML='<div class="scene '+t.bg+' '+t.id+'"><div class="fit" id="fit">'+t.s[S]()+'</div></div>';fit();location.hash=t.id+'-'+S;}
function fit(){const f=document.getElementById('fit');if(!f)return;f.style.transform='none';const st=document.getElementById('stage'),w=f.scrollWidth,h=f.scrollHeight,k=Math.min(1,(st.clientWidth-30)/w,(st.clientHeight-30)/h);f.style.transform='scale('+k+')';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t],[data-s]');if(!b)return;if(b.dataset.t)T=+b.dataset.t;if(b.dataset.s)S=+b.dataset.s;paint();});
addEventListener('resize',fit);
{const m=/^#(\w+)-(\d)$/.exec(location.hash);if(m){T=Math.max(0,THEMES.findIndex(t=>t.id===m[1]));S=+m[2];}}
paint();
</script>
